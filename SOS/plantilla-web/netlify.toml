# El que demana el botó «Deploy to Netlify». El mapa (TT_MAPA) el posa el botó de l'editor.
[template.environment]
  TT_NOM = "El nom de la web"
  TT_CORREU = "El correu on arriben els formularis"
  TT_LLENGUA = "ca o es"
  TT_MAPA = "El mapa, el posa el botó de l'editor (opcional)"
