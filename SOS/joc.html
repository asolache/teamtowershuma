<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>El joc del Comando · planta, defensa i activa Catalunya</title>
<meta name="description" content="Entra a una comarca, planta projectes a la plaça i defensa-la de Max Miedox, Mala Yerbax i Mc Greggor. Amb el polze. El Comando és la cara fantàstica del SOS, i el joc n'ensenya les regles de veritat.">
<meta property="og:title" content="El joc del Comando · planta, defensa i activa Catalunya">
<meta property="og:description" content="Un poble no cau per falta de ganes: cau quan penja de massa poca gent. Juga-hi amb el polze i ho veuràs en cinc minuts.">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#0b0b12;--panel:#141420;--card:#1a1a28;--text:#f5f5f7;--muted:#82828d;--light:#c7c7d1;
  --border:#2a2a35;--indigo:#6366f1;--green:#00e676;--orange:#ff9100;--purple:#e040fb;
  --blue:#00b0ff;--red:#ff5252;--amber:#ffc107;
  --mono:'SF Mono',SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --polze:96px;              /* alçada de la barra del polze */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.45;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
a{color:var(--indigo)}
h1,h2,h3,h4{line-height:1.2;margin:0}
button{font:inherit;cursor:pointer;border-radius:10px;padding:.5rem .8rem;border:1px solid var(--border);
  background:var(--card);color:var(--text);touch-action:manipulation;transition:border-color .12s,background .12s}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.b-pri{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}

/* ── L'aplicació ocupa la pantalla i prou. Res de scroll de pàgina: el joc no
      pot fer que se't mogui el terra mentre hi jugues. ────────────────────── */
.app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;
  background:var(--bg);position:relative;overflow:hidden}
@media(min-width:660px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}

/* ── Capçalera prima: els comptadors que has de veure sempre ────────────── */
/* Dues files, sempre. En una sola fila el títol i els quatre comptadors no hi
   caben a 320px: el títol quedava en 74px i es llegia «El joc del…», i a més la
   capçalera sortia de la pantalla. Repartit en dues files cap sencer a 320px i
   no depèn de com de llarg sigui el nom d'una comarca o d'un nivell. */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .5rem;padding:.4rem .7rem;
  border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.hud .tit{font-weight:700;font-size:.86rem;flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
/* El subtítol també s'ha de tallar amb punts suspensius. Sense això queia a
   mitja paraula —«Practi»— i semblava un error de la pàgina. */
.hud .tit small{display:block;font-family:var(--mono);font-size:.55rem;color:var(--muted);font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Segona fila sencera: els comptadors es llegeixen d'un cop d'ull. Número i
   etiqueta van de costat i no un sobre l'altre: la capçalera es queda en dues
   línies baixes i la plaça no perd alçada. */
/* Cinc comptadors, no quatre. A 320px hi caben amb aquest buit i no amb el de
   .85rem que hi havia quan n'eren quatre: mesurat, no estimat. */
.pips{order:9;flex:1 0 100%;display:flex;gap:.55rem;align-items:baseline}
.pip{display:flex;align-items:baseline;gap:.2rem}
.pip .n{font-family:var(--mono);font-size:.82rem;font-weight:700;line-height:1.1}
.pip .l{font-size:.5rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pip.h .n{color:var(--amber)} .pip.v .n{color:var(--green)} .pip.m .n{color:var(--red)}
.pip.a .n{color:var(--blue)}
.b-tor{padding:.4rem .6rem;font-size:.78rem}

/* ── La introducció ─────────────────────────────────────────────────────── */
.intro{position:absolute;inset:0;z-index:60;background:rgba(11,11,18,.97);display:flex;
  align-items:center;justify-content:center;padding:1rem}
.intro[hidden]{display:none}
.in-card{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--panel);
  border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem 1rem}
.in-cap{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.in-n{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.in-x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:.78rem;
  cursor:pointer;padding:.2rem .3rem;font-family:inherit}
.in-x:hover{color:var(--text)}
.in-card h2{margin:0 0 .5rem;font-size:1.22rem;line-height:1.2}
.in-cos{color:var(--light);font-size:.92rem;line-height:1.6}
.in-cos p{margin:0 0 .7rem}
.in-cos p:last-child{margin-bottom:0}
.in-cos b,.in-cos strong{color:var(--text)}
.in-peu{display:flex;align-items:center;gap:.6rem;margin-top:1rem;padding-top:.8rem;
  border-top:1px solid var(--border)}
.in-punts{display:flex;gap:4px;flex:1;justify-content:center}
.in-punts i{width:6px;height:6px;border-radius:50%;background:var(--card);display:block;transition:all .2s}
.in-punts i.on{width:18px;border-radius:3px}
.in-punts i.on{background:var(--verd)}
.in-punts i.fet{background:#3a3a52}
/* La caixa que es pot tocar: el pas de la regla es prova, no es llegeix. */
.in-lab{border:1px solid var(--border);border-radius:12px;padding:.85rem;background:var(--card);margin:.6rem 0}
.in-xifres{display:flex;gap:1.1rem;flex-wrap:wrap;margin-bottom:.6rem}
.in-xifres div{text-align:center;min-width:56px}
.in-xifres .n{font-family:var(--mono);font-size:1.35rem;font-weight:700;line-height:1}
.in-xifres .l{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.15rem}
.in-barra{height:8px;border-radius:4px;background:#22222f;overflow:hidden;margin:.5rem 0 .4rem}
.in-barra i{display:block;height:100%;transition:width .25s ease,background .25s ease}
.in-est{font-size:.84rem;font-weight:600}
.in-bots{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.in-bots button{font-size:.78rem;padding:.42rem .6rem}
.in-llista{margin:.4rem 0 0;padding:0;list-style:none}
.in-llista li{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem 0;
  border-bottom:1px solid var(--border);font-size:.87rem}
.in-llista li:last-child{border-bottom:0}
.in-llista .ic{font-size:1.1rem;flex-shrink:0}
.in-llista b{display:block}
.in-dues{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0}
.in-dues>div{border:1px solid var(--border);border-radius:10px;padding:.7rem;background:var(--card)}
.in-dues .t{font-weight:700;font-size:.9rem;margin-bottom:.25rem}
.in-dues .d{font-size:.8rem;color:var(--muted);line-height:1.5}

/* ── El cos: canvia de pantalla ──────────────────────────────────────────── */
.cos{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pant{display:none;padding:.7rem} .pant.on{display:block}

/* ── Pantalla MAPA ───────────────────────────────────────────────────────── */
.nota{font-family:var(--mono);font-size:.6rem;color:var(--muted);line-height:1.6;margin:0 0 .7rem}
.prov-t{font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:.7rem 0 .3rem}
.caselles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.35rem}
.cas{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.45rem .5rem;
  text-align:left;min-height:56px;display:flex;flex-direction:column;justify-content:space-between;gap:.15rem}
.cas .nm{font-size:.68rem;font-weight:600;color:var(--muted);line-height:1.2}
.cas .st{font-family:var(--mono);font-size:.55rem;color:var(--muted)}
.cas.pot{border-color:rgba(99,102,241,.4)} .cas.pot .nm{color:var(--light)}
.cas.on{background:rgba(0,230,118,.07);border-color:rgba(0,230,118,.4)}
.cas.on .nm{color:var(--text)} .cas.on .st{color:var(--green)}
.cas.risc{background:rgba(255,145,0,.09);border-color:rgba(255,145,0,.5)} .cas.risc .st{color:var(--orange)}
.cas.morta{background:rgba(255,82,82,.08);border-color:rgba(255,82,82,.45)}
.cas.morta .nm,.cas.morta .st{color:var(--red)}
.cas.liq{background:rgba(224,64,251,.11);border-color:var(--purple)} .cas.liq .st{color:var(--purple)}

/* ── Pantalla COMARCA · la plaça ─────────────────────────────────────────── */
.placa{position:relative;background:linear-gradient(90deg,rgba(0,230,118,.06),rgba(255,82,82,.07));
  border:1px solid var(--border);border-radius:12px;overflow:hidden;touch-action:manipulation}
.fila{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid rgba(255,255,255,.04)}
.fila:last-child{border-bottom:0}
.cel{aspect-ratio:1;border-right:1px solid rgba(255,255,255,.04);display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;background:transparent;border-radius:0;padding:0;min-height:0}
.cel:last-child{border-right:0}
.cel.buida:active{background:rgba(99,102,241,.14)}
.cel.te{background:rgba(0,230,118,.07)}
.cel.te.parat{background:rgba(255,145,0,.14)}
.cel .hp{position:absolute;bottom:2px;left:6%;width:88%;height:3px;border-radius:2px;background:rgba(255,255,255,.1)}
.cel .hp i{display:block;height:100%;background:var(--green);border-radius:2px}
.cel-wrap{position:relative;display:flex;align-items:center;justify-content:center}
/* Amb un llavor triat, on es pot plantar es veu. Abans es tocava i no passava
   res, i el motiu sortia al diari —que és a 400px d'on mires. */
/* Suau: s'il·luminen dinou caselles alhora i, pintades fortes, el tauler sencer
   sembla seleccionat i les d'aportació desapareixen entre elles. */
.cel.pot{background:rgba(99,102,241,.08);box-shadow:inset 0 0 0 1px rgba(99,102,241,.3)}
.cel.apaga{opacity:.3}
/* La casella d'aportació: un projecte real del SOS esperant que hi posis alguna
   cosa. Ha de cridar l'ull sense tapar el que hi ha a sobre. */
.cel .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;opacity:.5;animation:bri 1.9s ease-in-out infinite;pointer-events:none}
/* Guanya sobre `.pot`: la casella d'aportació ha de ser el que crida l'ull
   quan tens un llavor triat, perquè és la decisió que val la pena. */
.cel.val-cas,.cel.val-cas.pot{background:rgba(0,176,255,.16);
  box-shadow:inset 0 0 0 2px rgba(0,176,255,.6)}
@keyframes bri{0%,100%{opacity:.34}50%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.cel .val{animation:none;opacity:.6}}
.vilans{position:absolute;inset:0;pointer-events:none}
/* Les hores cauen i es recullen amb el dit. La capa no intercepta res; només
   les fitxes, perquè tocar-ne una reculli en comptes de plantar. */
.caigudes{position:absolute;inset:0;pointer-events:none;z-index:3}
.cai{position:absolute;transform:translate(-50%,-50%);font-size:1.25rem;padding:.15rem;
  background:rgba(255,193,7,.16);border:1px solid rgba(255,193,7,.6);border-radius:50%;
  pointer-events:auto;cursor:pointer;line-height:1;animation:puja .4s ease-out}
.cai.fuig{opacity:.4}
@keyframes puja{from{transform:translate(-50%,-30%) scale(.5)}to{transform:translate(-50%,-50%) scale(1)}}
/* La primera vegada la gent surt al carrer: una salvada per fila i per plaça. */
/* Prim i mig transparent: és el marge del carrer, no una casella més. Amb la
   mida de la resta semblava una cosa plantada a la primera columna. */
.marges{position:absolute;left:0;top:0;bottom:0;width:13px;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(0,230,118,.10),transparent)}
.marges span{position:absolute;left:0;transform:translateY(-50%);font-size:.56rem;opacity:.55}
.marges span.gastat{opacity:.14;filter:grayscale(1)}
/* L'avís surt on mires, no al diari. */
.flot{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;max-width:92%;
  background:rgba(11,11,18,.94);border:1px solid var(--orange);color:var(--light);
  border-radius:9px;padding:.32rem .6rem;font-size:.72rem;pointer-events:none;text-align:center}
.flot.bo{border-color:var(--green)} .flot.lliq{border-color:var(--purple)}
.vil{position:absolute;font-size:1.35rem;transform:translate(-50%,-50%);transition:left .25s linear;
  filter:drop-shadow(0 0 4px rgba(0,0,0,.7))}
.vil small{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--mono);
  font-size:.42rem;color:var(--red);white-space:nowrap}
.onada{display:flex;align-items:center;gap:.5rem;margin:.6rem 0 .4rem;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.onada .bar{flex:1;height:4px;background:var(--card);border-radius:2px;overflow:hidden}
.onada .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}

.fitxa{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem;margin-bottom:.6rem}
.fitxa .lin{display:flex;justify-content:space-between;gap:.6rem;font-size:.76rem;color:var(--muted);margin-bottom:.25rem}
.barra{height:6px;border-radius:3px;background:var(--card);overflow:hidden}
.barra i{display:block;height:100%;background:var(--green);transition:width .3s}
.barra.alta i{background:var(--orange)} .barra.critica i{background:var(--red)}
.equip{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.5rem}
.pers{font-size:.6rem;padding:.16rem .38rem;border-radius:5px;background:var(--card);border:1px solid var(--border)}
.pers.form{border-color:rgba(0,230,118,.5);color:var(--green)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.6rem 0}
.mini{padding:.6rem .4rem;font-size:.66rem;line-height:1.25;text-align:center;min-height:58px}
.mini b{display:block;font-size:.8rem;margin-bottom:.1rem}

/* ── La barra del polze · tot el que es toca sovint viu aquí baix ───────── */
.polze{flex-shrink:0;border-top:1px solid var(--border);background:var(--panel);
  padding:.5rem .6rem calc(.5rem + env(safe-area-inset-bottom));min-height:var(--polze)}
.tira{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.sem{flex:0 0 auto;width:74px;min-height:66px;padding:.4rem .3rem;border-radius:12px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.55rem;
  line-height:1.15;text-align:center;color:var(--light)}
.sem{position:relative;overflow:hidden}
.sem .ic{font-size:1.3rem}
.sem .cost{font-family:var(--mono);font-size:.55rem;color:var(--amber)}
.sem.sel{border-color:var(--indigo);background:rgba(99,102,241,.16)}
.sem.no{opacity:.32}
/* El sobre que es recarrega: la targeta s'omple de baix a dalt i mentre s'omple
   no es pot plantar. És el que fa que la partida vagi de temps i no de saldo. */
.sem .rec{position:absolute;left:0;right:0;bottom:0;background:rgba(11,11,18,.72);
  pointer-events:none;border-top:1px solid rgba(255,255,255,.14)}
/* La pala viu FORA de la tira que llisca. Dins, amb nou targetes, quedava
   sempre a l'altra punta: l'eina de desfer no pot ser la més difícil d'arribar-hi. */
.eines{display:flex;gap:.4rem;align-items:stretch}
.eines .tira{flex:1;min-width:0}
.sem.pala{flex:0 0 auto;width:58px;color:var(--orange)}
.sem.pala.sel{border-color:var(--orange);background:rgba(255,145,0,.16)}
.accions{display:flex;gap:.4rem;margin-top:.45rem}
.accions button{flex:1;min-height:44px;font-size:.78rem;padding:.4rem .3rem}

/* ── Diari ───────────────────────────────────────────────────────────────── */
.diari{margin-top:.7rem;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.6rem .7rem}
.diari h4{font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:400;margin-bottom:.4rem}
.linies{max-height:120px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:.28rem}
.li{font-size:.72rem;color:var(--light);padding-left:.6rem;border-left:2px solid var(--border);line-height:1.4}
.li.bo{border-color:var(--green)} .li.mal{border-color:var(--red)}
.li.avis{border-color:var(--orange)} .li.lliq{border-color:var(--purple)}
.li b{color:var(--text)}

/* ── Modals ──────────────────────────────────────────────────────────────── */
dialog{border:1px solid var(--border);border-radius:16px;background:var(--panel);color:var(--text);
  max-width:520px;width:calc(100vw - 1.6rem);padding:0;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dl-cap{padding:1rem 1.1rem .5rem}
.dl-cap .kick{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.dl-cap h2{font-size:1.05rem;margin-top:.15rem}
.dl-cos{padding:0 1.1rem .9rem;max-height:60vh;overflow-y:auto;font-size:.86rem;color:var(--light)}
.dl-cos p{margin:0 0 .7rem} .dl-cos strong{color:var(--text)} .dl-cos em{color:var(--muted);font-style:italic}
.dl-cos ul{margin:0 0 .7rem;padding-left:1.1rem} .dl-cos li{margin-bottom:.25rem}
.dl-peu{padding:.8rem 1.1rem calc(.8rem + env(safe-area-inset-bottom));border-top:1px solid var(--border);
  display:flex;gap:.45rem;flex-wrap:wrap}
.dl-peu button{flex:1;min-height:46px;min-width:120px}

/* ── Minijocs ────────────────────────────────────────────────────────────── */
.mj{display:grid;gap:.45rem}
.mj-parell{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.mj-b{min-height:52px;font-size:.76rem;text-align:left;padding:.5rem .6rem;line-height:1.25}
.mj-b.sel{border-color:var(--indigo);background:rgba(99,102,241,.16)}
.mj-b.ok{border-color:var(--green);background:rgba(0,230,118,.12);opacity:.55}
.mj-b.mal{border-color:var(--red)}
.mj-est{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:flex;justify-content:space-between}
.disco{height:120px;position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.disco .zona{position:absolute;left:50%;top:0;bottom:0;width:56px;transform:translateX(-50%);
  background:rgba(0,230,118,.12);border-left:1px solid var(--green);border-right:1px solid var(--green)}
.disco .puck{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:1.6rem}
.carr{display:grid;gap:.35rem}
.carr-p{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:.45rem .6rem;font-size:.74rem}
.carr-p .nm{flex:1}
.carr-p .num{font-family:var(--mono);font-size:.8rem}
.carr-p.ple{border-color:var(--red)} .carr-p.ple .num{color:var(--red)}
.carr-p.ok{border-color:var(--green)} .carr-p.ok .num{color:var(--green)}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <button id="btnEnrere" hidden aria-label="Torna al mapa">←</button>
    <div class="tit" id="hudTit">El joc del Comando<small id="hudSub">Catalunya · tardor 1</small></div>
    <div class="pips">
      <div class="pip"><div class="n" id="pAcc">3</div><div class="l">acc</div></div>
      <div class="pip h"><div class="n" id="pHores">0</div><div class="l">hores</div></div>
      <div class="pip v"><div class="n" id="pPsico">0</div><div class="l">vincle</div></div>
      <div class="pip a"><div class="n" id="pApo">0</div><div class="l">apo</div></div>
      <div class="pip m"><div class="n" id="pMort">0</div><div class="l">mort</div></div>
    </div>
    <button class="b-pri b-tor" id="btnTorn">Torn →</button>
    <button id="btnAjuda" aria-label="Com es juga">?</button>
  </header>

  <!-- ══ INTRODUCCIÓ ══ ─────────────────────────────────────────────────
       Set passos, i el tercer no explica la regla: la deixa provar. Veda 117. -->
  <div class="intro" id="intro" hidden>
    <div class="in-card">
      <div class="in-cap">
        <span class="in-n" id="inN"></span>
        <button class="in-x" id="inSalta" type="button">Salta</button>
      </div>
      <h2 id="inT"></h2>
      <div class="in-cos" id="inCos"></div>

   · L'única manera de perdre és la cremada: **un node que penja de massa poca
     gent**. Ni al mapa ni a la plaça hi ha cap altra derrota.

   · **Mapa** — on activar comarques, formar gent i lligar-les. És l'estratègia.
   · **Plaça** — dins d'una comarca: plantes projectes i els defenses. És el que
     es toca amb el polze, i el que passa aquí alimenta el model de dalt.

   Si un dia una regla d'aquí deixa de ser certa al SOS, s'ha de canviar aquí:
   un joc que ensenya una cosa que l'eina no fa, ensenya una mentida. Veda 110.
   ══════════════════════════════════════════════════════════════════════════ */

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tria=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ── Dades reals ──────────────────────────────────────────────────────────

/* Els rols: el roster del Comando fet mecànica. Cada arquetip és una manera de

const ROLS={
  connecta:{nom:'Connecta',heroi:'La Medusa Andaluza',ic:'🪼'},

/* Les dinàmiques del catàleg del SOS. `cal` són els rols que han de ser al
   node; `carrega` és el pes que posen sobre la gent —la xifra que ho decideix
   tot al mapa. A la plaça, cadascuna té a més una manera de defensar. */
const DINS={
  banctemps:{nom:'Banc de temps',ic:'⏳',cal:['connecta','cuida'],carrega:3,psico:3,econo:2,cost:0,
    fa:'genera',diu:'Genera hores. Sense això no pots plantar res més'},
  cures:{nom:'Cures',ic:'🤝',cal:['cuida','sosté'],carrega:4,psico:5,econo:1,cost:35,

  festa:{nom:'Festa major',ic:'🎉',cal:['encén','ritme'],carrega:1,psico:4,econo:0,cost:30,
    fa:'neteja',diu:'Neteja el rumor de tota la fila'},
  biblioteca:{nom:'Biblioteca de les coses',ic:'🧰',cal:['fabrica','ordena'],carrega:2,psico:1,econo:3,cost:25,

  energia:{nom:'Comunitat energètica',ic:'⚡',cal:['finança','ordena'],carrega:5,psico:1,econo:5,cost:70,

  compra:{nom:'Compra col·lectiva',ic:'🛒',cal:['desencalla','ordena'],carrega:2,psico:1,econo:3,cost:20,
    fa:'tira',dany:7,diu:'Barat. Junts es negocia'},
  coop:{nom:'Cooperativa',ic:'🛠️',cal:['finança','sosté','desencalla'],carrega:6,psico:3,econo:6,cost:95,
    fa:'tira',dany:40,diu:'Qui hi treballa decideix'}
};
const DIN_IDS=Object.keys(DINS);

/* Quant triga a poder-se tornar a plantar. No és una xifra de joc: és la
   `carrega`, la mateixa que decideix si un poble es crema. El que pesa més
   sobre la gent, triga més a poder-se repetir. Això és el que fa que la
   partida vagi de temps i no de saldo —el repte és la velocitat. */
const recDe=d=>1200+DINS[d].carrega*900;

/* L'ordre en què s'obren. Es comença amb una de sola i cada onada aguantada
   n'obre una: vuit targetes fredes el primer minut no són vuit opcions, són
   una pantalla que no es pot llegir. La primera ha de ser la de cost 0 o la
   partida naixeria bloquejada. */
const DESBLOQUEIG=['banctemps','festa','biblioteca','cures','compra','consum','energia','coop'];
/* Compta les onades **aguantades**, no les començades: si comptés les que
   arrenquen, la dinàmica nova apareixeria just quan et venen a sobre i no
   quan l'has guanyada, que és quan es diu que l'has apresa. */
const desbloquejades=n=>DESBLOQUEIG.slice(0,Math.min(DESBLOQUEIG.length,1+(n?n.placa.aguantades:0)));

/* ── Les caselles d'aportació ─────────────────────────────────────────────
   Algunes caselles de la plaça són **un projecte real del SOS esperant que hi
   posis alguna cosa**. `proj`, `nom` i `ic` són còpia literal de `DYNAMICS` de
   `SOS/index.html`: si allà es canvia un nom, aquí queda una mentida, i per
   això hi ha `SOS/tools/check-joc.js` que compara les dues llistes.

   Plantar-hi registra una **aportació** al node. Al SOS de debò l'aportació és
   el que has posat al ledger d'un projecte, i és el criteri de la porta 2 de la
   MATRIU: «≥1 aportació al ledger». Aquí compta per pujar a Gestor/a. El bonus
   de cada casella és el que aquell projecte dona de veritat, no un premi. */
const VALOR=[
  {proj:'banc_temps',nom:'Banc de Temps',ic:'⏳',bonus:'hores',
   diu:'Has posat hores al banc de temps del poble. Te\'n tornen de seguida: així funciona.'},
  {proj:'biblioteca_coses',nom:'Biblioteca de les Coses',ic:'🧰',bonus:'aguanta',
   diu:'Hi has deixat una eina. El que plantes aquí té el doble de vida perquè no comença de zero.'},
  {proj:'matriu',nom:'MATRIU · Incubadora',ic:'🌱',bonus:'forma',
   diu:'Has portat el cas a la incubadora. Algú del poble en surt sabent-ho portar sol.'},
  {proj:'mapeig_vna',nom:'Mapeig de Xarxa de Valor',ic:'🕸️',bonus:'veure',
   diu:'Has mapat la xarxa. Ara es veu per quina fila entra el que ve, abans que entri.'},
  {proj:'comunitat_energetica',nom:'Comunitat Energètica',ic:'⚡',bonus:'doble',
   diu:'Hi has posat teulada. El que plantes aquí va al doble de ritme.'},
  {proj:'suport_mutu',nom:'Suport Mutu / Cures Veïnals',ic:'🤝',bonus:'salva',
   diu:'Has entrat a la xarxa de cures. La fila torna a tenir qui surti al carrer.'},
  {proj:'compra_collectiva',nom:'Compra Col·lectiva / Estalvi',ic:'🛒',bonus:'gratis',
   diu:'Has entrat a la compra conjunta. La pròxima plantada no et costa hores.'},
  {proj:'cens_entitats',nom:'Sprint de Cens d\'Entitats',ic:'🗂️',bonus:'gent',
   diu:'Has censat el teixit del poble. Apareix gent que ja hi era i no sabies.'}
];
const valorPer=p=>VALOR.find(v=>v.proj===p);

/* Els tres supervilans del còmic, amb el poder que hi tenen. No són genèrics:
   cadascun ataca una cosa diferent i es para d'una manera diferent. */
const VILANS={
  por:{nom:'Max Miedox',ic:'😨',vida:170,vel:.30,dany:1.1,
    diu:'La por que paralitza abans de començar. Para un projecte en tocar-lo'},
  rumor:{nom:'Mala Yerbax',ic:'🗣️',vida:80,vel:.62,dany:.8,
    diu:'El rumor que corroeix la confiança. Va de pressa i s\'escampa'},
  extraccio:{nom:'Mc Greggor',ic:'💼',vida:260,vel:.20,dany:1.4,roba:2,
    diu:'L\'extracció que buida el territori. Et pren les hores mentre camina'}
};

/* Els nivells del SOS. Còpia de `SOS_LEVELS`, i cada pujada obre un rol de
   `SOS_ROLES` i cita els mòduls de formació de veritat. */
const NIVELLS=[
  {id:'N0',nom:'Explorador/a',rol:'simpatitzant',rolNom:'Ciutadà/na simpatitzant',
   one:'Has entrat, tens perfil i entens per a què serveix el SOS.',
   cal:{},moduls:[['m1','Fonaments SOS i codex Antigravity']]},
  {id:'N1',nom:'Practicant',rol:'superheroi',rolNom:'Superheroi/na',
   one:'Operes una dinàmica real: aportes, intercanvies, registres.',
   cal:{dins:2},moduls:[['m4','Recursos comunitaris · banc de temps i biblioteca'],
     ['m7','Comando Molekulon i reputació'],['m10','Comunicació i captació de persones']]},
  {id:'N2',nom:'Gestor/a SOS',rol:'coordinador',rolNom:'Coordinador/a de comunitat',
   one:'Sostens un node sencer: mapa, governança, comptabilitat i incubació.',
   /* `aportacions` no és una xifra del joc: és el criteri de la porta 2 de la
      MATRIU —«≥1 aportació al ledger»—, que és el que separa un projecte
      planificat d'un on algú ja hi ha posat hores. Veure la guia de la MATRIU. */
   cal:{dins:4,formades:4,comarques:2,aportacions:2},
   moduls:[['m5','Governança i Guardians'],['m6','MATRIU, Slicing Pie i intercooperació'],
     ['m11','Conflictes, cures i relleu'],['m12','Finançament i subvencions a Catalunya']]},
  {id:'N3',nom:'Mentor/a',rol:'mentor',rolNom:'Mentor/a d\'iniciatives',
   one:'Formes altres gestors i certifiques la seva pràctica.',
   cal:{formades:10,comarques:4,onades:6},
   moduls:[['m16','Formació de formadors · l\'ofici de mentorar'],
     ['m14','Mesura d\'impacte i justificació']]}
];

/* El coneixement que el Molekulon passa. No es compra: s'obté ensenyant. */
const SABERS=[
  {id:'mapa',cal:2,nom:'El mapa de valor',diu:'Les caselles avisen abans de cremar-se.'},
  {id:'registre',cal:5,nom:'El registre signat',diu:'El vincle puja més de pressa.'},
  {id:'relleu',cal:9,nom:'El relleu',diu:'Formar ja no gasta acció si algú del poble ho sap.'},
  {id:'pont',cal:14,nom:'El pont entre pobles',diu:'Es poden lligar comarques i repartir la càrrega.'},
  {id:'liquid',cal:20,nom:'L\'estat líquid',diu:'Molekulàndia és possible.'}
];

const NOMS=['Marta','Pau','Neus','Jordi','Aina','Quim','Rosa','Biel','Carme','Ferran','Laia','Toni',
  'Núria','Xavi','Mercè','Guiu','Anna','Roc','Pilar','Enric','Júlia','Manel','Sílvia','Oriol',
  'Fàtima','Youssef','Elena','Dani','Rocío','Ibrahim','Lin','Andreu'];
const COGN=['Vidal','Ferrer','Puig','Roca','Serra','Bosch','Mas','Soler','Riera','Camps','Grau','Font'];
const nouNom=()=>tria(NOMS)+' '+tria(COGN);

const FILES=4, COLS=5;

/* ── Estat ────────────────────────────────────────────────────────────────── */
const S={
  torn:1,accions:3,psico:0,econo:0,mort:0,
  nodes:{},sabers:[],ponts:[],
  sel:INICI,pantalla:'mapa',
  nivell:'N0',rols:['simpatitzant'],onadesGuanyades:0,
  molekulandia:false,acabat:null,diari:[],
  llavor:null              // la partida a la plaça, si n'hi ha
};
const node=c=>S.nodes[c];
const actives=()=>Object.keys(S.nodes);
const formades=()=>actives().reduce((n,c)=>n+node(c).gent.filter(p=>p.formada).length,0);
const sap=id=>S.sabers.includes(id);
const totDins=()=>actives().reduce((n,c)=>n+node(c).dins.length,0);

/* ── El model estratègic · no es toca ─────────────────────────────────────
   La capacitat NO és el nombre de persones: és quantes en poden sostenir. Una
   persona formada compta per dues perquè sap fer-ho i sap ensenyar-ho — la
   traducció del quart pas del mètode a una xifra que decideix partides. */
/* Les tres funcions treballen sobre un node solt, i les versions per nom
   només hi porten el node de la partida. Ho necessita la introducció, que
   ensenya la regla amb un node de mentida i **crida aquestes mateixes
   funcions**: si en tingués una còpia, el dia que el model canviés el tutorial
   seguiria ensenyant les regles velles i ho hauria de notar algú. Veda 117. */
function capacitatDe(n,lligams){
  if(!n)return 0;
  return n.gent.reduce((t,p)=>t+(p.formada?2:1),0)+(lligams||0);
}
const carregaDe=n=>n?n.dins.reduce((t,d)=>t+DINS[d].carrega,0):0;
function tensioDe(n,lligams){
  const cap=capacitatDe(n,lligams),car=carregaDe(n);
  if(!car)return 0;
  if(car>cap)return 2;
  if(car>cap*0.75)return 1;
  return 0;
}
const lligamsDe=c=>S.ponts.filter(p=>p[0]===c||p[1]===c).length;
const capacitat=c=>capacitatDe(node(c),lligamsDe(c));
const carrega=c=>carregaDe(node(c));
const tensio=c=>tensioDe(node(c),lligamsDe(c));
function potEngegar(c,d){
  const n=node(c);if(!n||n.dins.includes(d))return false;
  return DINS[d].cal.every(r=>n.gent.some(p=>p.rol===r));
}
function log(txt,mena){S.diari.push({txt,mena:mena||''});if(S.diari.length>60)S.diari.shift();}
/* El diari és per repassar; el que passa ara s'ha de dir on mires. Un avís al
   diari mentre tens el dit a la plaça és un avís que no llegeix ningú. */
let _flot=null;
function flota(txt,mena,ms){
  S.flot={txt,mena:mena||''};
  const box=$('#flot');
  if(box){box.className='flot '+(mena||'');box.textContent=txt;}
  clearTimeout(_flot);
  _flot=setTimeout(()=>{S.flot=null;const b=$('#flot');if(b){b.className='';b.textContent='';}},ms||2600);
}

function activa(c,quiet){
  if(S.nodes[c])return;
  /* Els dos primers no són a l'atzar: són **els que demana el banc de temps**,
     qui connecta i qui cuida. Amb rols a la sort, un poble podia néixer sense
     poder fer res —el primer moviment ha de ser sempre possible, i a més és
     com comencen de debò: primer apareix qui truca a la gent i qui s'hi posa. */
  S.nodes[c]={gent:DINS.banctemps.cal.map(r=>({nom:nouNom(),rol:r,formada:false})),
              dins:[],trobada:false,cremades:0,hores:60,placa:novaPlaca(),onada:0,protegida:false,
              aportacions:[]};
  if(!quiet)log('S\'activa <b>'+esc(c)+'</b>. Dues persones i moltes ganes.','bo');
}
/* Les aportacions de tot el país. Al SOS és el que has posat al ledger d'un
   projecte, i és el que la porta 2 de la MATRIU demana per avançar d'etapa. */
const aportacions=()=>actives().reduce((t,c)=>t+(node(c).aportacions||[]).length,0);
function troba(c){
  const n=node(c),p={nom:nouNom(),rol:tria(ROL_IDS),formada:false};
  n.gent.push(p);
  log(esc(p.nom)+' s\'apunta a <b>'+esc(c)+'</b> · '+ROLS[p.rol].ic+' '+ROLS[p.rol].nom,'');
  return p;
}
function forma(c){
  const n=node(c),cand=n.gent.filter(p=>!p.formada);
  if(!cand.length)return null;
  const p=tria(cand);p.formada=true;
  log(esc(p.nom)+' ja ho sap portar sol. <b>'+esc(c)+'</b> depèn menys de ningú.','bo');
  obreSabers();pujaNivell();
  return p;
}
function obreSabers(){
  const f=formades();
  SABERS.forEach(s=>{
    if(!sap(s.id)&&f>=s.cal){
      S.sabers.push(s.id);
      log('Coneixement nou: <b>'+esc(s.nom)+'</b>','lliq');
      modal('Coneixement','El Molekulon en sap una altra',
        '<p>Amb <strong>'+f+' persones formades</strong>, el Comando ja pot fer una cosa que abans no sabia.</p>'+
        '<p><strong>'+esc(s.nom)+'.</strong> '+esc(s.diu)+'</p>'+
        '<p><em>No s\'ha comprat ni s\'ha trobat: l\'ha obert la gent que sap fer-ho.</em></p>',[['Entesos',null]]);
    }
  });
}

/* ── Els nivells del SOS ──────────────────────────────────────────────────
   Es guanyen fent, no acumulant punts, i cada pujada diu **quins mòduls de la
   formació** corresponen a aquell nivell, amb l'enllaç a la pàgina de debò.
   Aquesta és la costura amb el programa: el joc no inventa cap itinerari. */
function compleix(cal){
  if(cal.dins&&totDins()<cal.dins)return false;
  if(cal.formades&&formades()<cal.formades)return false;
  if(cal.comarques&&actives().length<cal.comarques)return false;
  if(cal.onades&&S.onadesGuanyades<cal.onades)return false;
  if(cal.aportacions&&aportacions()<cal.aportacions)return false;
  return true;
}
function pujaNivell(){
  const i=NIVELLS.findIndex(n=>n.id===S.nivell);
  const seg=NIVELLS[i+1];
  if(!seg||!compleix(seg.cal))return;
  S.nivell=seg.id;
  if(!S.rols.includes(seg.rol))S.rols.push(seg.rol);
  log('Puges a <b>'+esc(seg.nom)+'</b>','lliq');
  modal('Nivell '+seg.id,seg.nom,
    '<p>'+esc(seg.one)+'</p>'+
    '<p>Al SOS de debò això és un rol: <strong>'+esc(seg.rolNom)+'</strong>.</p>'+
    '<p>I té la seva formació. Aquests són els mòduls que li toquen:</p><ul>'+
    seg.moduls.map(([id,t])=>'<li><a href="formacio.html#'+id+'" target="_blank" rel="noopener">'+esc(t)+'</a></li>').join('')+
    '</ul><p><em>No és un premi del joc: és el temari que hi ha escrit a la guia formativa.</em></p>',
    [['Segueixo',null],['Obre la formació',()=>window.open('formacio.html','_blank','noopener')]]);
}

/* ── La plaça ─────────────────────────────────────────────────────────────
   Cinc columnes i quatre files. Els vilans entren per la dreta i caminen cap a
   l'esquerra; si arriben, s'emporten una cosa. Es planta tocant una casella. */
const VALOR_CASELLES=3;
function novaPlaca(){
  /* Tres caselles d'aportació per plaça, a llocs diferents i mai a la columna
     de l'entrada: una casella que et fa córrer a plantar-hi just on entren els
     vilans no és una decisió, és una trampa. */
  const llocs=[];
  for(let f=0;f<FILES;f++)for(let co=0;co<COLS-1;co++)llocs.push([f,co]);
  llocs.sort(()=>Math.random()-.5);
  const valor=VALOR.map(v=>v.proj).sort(()=>Math.random()-.5).slice(0,VALOR_CASELLES)
    .map((proj,i)=>({proj,f:llocs[i][0],co:llocs[i][1]}));
  return {cel:Array.from({length:FILES},()=>Array(COLS).fill(null)),vilans:[],
    onada:0,dins:0,restants:0,corrent:false,t:0,
    valor,rec:{},caigudes:[],cai:0,gratis:0,espera:ESPERA_PRIMERA,aguantades:0,
    /* Una salvada per fila: la primera vegada que allò arriba al final del
       carrer, els veïns surten. La segona ja estan cansats. */
    salva:Array(FILES).fill(true)};
}
function cellsPlantades(c){
  const p=node(c).placa;let n=0;
  p.cel.forEach(f=>f.forEach(x=>{if(x)n++;}));
  return n;
}
const TIC=120;
const HORES_FITXA=10;      // el que deixa caure un banc de temps
const HORES_AMBIENT=8;     // el que apareix sol, més a poc a poc
const FITXA_VIU=9000;      // una hora que ningú recull, caduca
const ESPERA_PRIMERA=9000, ESPERA_ENTRE=11000;
let _idFitxa=0;

/* Les hores ja no se sumen soles: **cauen i s'han de recollir amb el dit**.
   Un banc de temps no ingressa res al teu compte mentre mires; algú ofereix una
   estona i algú l'ha d'agafar. La que no agafa ningú, es perd. Això és el que
   converteix la plaça en una cosa de velocitat i no d'esperar. */
function deixaFitxa(p,f,co,val){
  p.caigudes.push({id:++_idFitxa,f,co,val,viu:FITXA_VIU});
}
function recull(id){
  const n=node(S.sel);if(!n)return 0;
  const p=n.placa,i=p.caigudes.findIndex(x=>x.id===id);
  if(i<0)return 0;
  const val=p.caigudes[i].val;
  p.caigudes.splice(i,1);
  n.hores+=val;
  return val;
}

/* Per què no es pot plantar això, ara. Ho fa servir `planta()` per refusar i la
   pintura per il·luminar les caselles on sí que es pot: si fossin dues llistes
   de condicions, un dia el tauler diria verd on el model diu que no. */
function motiuNo(c,d){
  const n=node(c),p=n.placa;
  if(!desbloquejades(n).includes(d))return DINS[d].nom+': encara no. Aguanta una onada més';
  if(p.rec[d]>0)return DINS[d].nom+' s\'està recarregant';
  if(!potEngegar(c,d)&&!n.dins.includes(d)){
    const falten=DINS[d].cal.filter(r=>!n.gent.some(x=>x.rol===r)).map(r=>ROLS[r].nom);
    return 'Falta qui '+falten.join(' i qui ');
  }
  if(n.hores<(p.gratis>0?0:DINS[d].cost))return 'Falten hores. Recull-ne de la plaça';
  return null;
}
function planta(c,f,co,d){
  const n=node(c),p=n.placa;
  if(p.cel[f][co])return {ok:false,per:'Aquí ja hi ha alguna cosa'};
  const no=motiuNo(c,d);
  if(no)return {ok:false,per:no};
  const cost=p.gratis>0?0:DINS[d].cost;
  n.hores-=cost;
  if(p.gratis>0&&DINS[d].cost)p.gratis--;
  p.rec[d]=recDe(d);
  const cel={d,vida:DINS[d].vida||260,max:DINS[d].vida||260,parat:0,tic:0};
  p.cel[f][co]=cel;
  /* Plantar-la a la plaça **és** obrir-la al node: la mateixa dinàmica, la
     mateixa càrrega. Si fossin dues coses separades, la plaça seria un
     videojoc al costat i no el SOS. */
  if(!n.dins.includes(d)){
    n.dins.push(d);
    log('<b>'+esc(c)+'</b> obre «'+esc(DINS[d].nom)+'»','bo');
    if(tensio(c)===2)log('Compte: <b>'+esc(c)+'</b> ja va per sobre del que pot sostenir.','avis');
    pujaNivell();
  }
  const v=p.valor.find(x=>x.f===f&&x.co===co);
  if(v){p.valor=p.valor.filter(x=>x!==v);aplicaBonus(c,v.proj,f,co);}
  return {ok:true,valor:v?v.proj:null};
}

/* Treure el que has plantat. Un pas fàcil ha de ser reversible: si posar una
   cosa on no tocava fos definitiu, deixaries de provar. No torna les hores
   —ja s'han gastat—, i si era l'última còpia tanca la dinàmica al node, perquè
   la plaça i el node són la mateixa comptabilitat. */
function llevaPlanta(c,f,co){
  const n=node(c),p=n.placa,cel=p.cel[f][co];
  if(!cel)return false;
  p.cel[f][co]=null;
  const queda=p.cel.some(fila=>fila.some(x=>x&&x.d===cel.d));
  if(!queda&&n.dins.includes(cel.d)){
    n.dins=n.dins.filter(x=>x!==cel.d);
    log('<b>'+esc(c)+'</b> tanca «'+esc(DINS[cel.d].nom)+'». La càrrega baixa.','');
  }
  return true;
}

/* El bonus de cada casella és **el que aquell projecte del SOS dona de debò**.
   Si un dia fos un premi qualsevol, la casella ensenyaria una mentida amb el
   nom d'un projecte que existeix, que és pitjor que no tenir-la. Veda 110. */
function aplicaBonus(c,proj,f,co){
  const n=node(c),p=n.placa,V=valorPer(proj);
  if(!V)return null;
  const cel=p.cel[f][co];
  if(V.bonus==='hores')n.hores+=25;
  if(V.bonus==='aguanta'&&cel){cel.max*=2;cel.vida=cel.max;}
  if(V.bonus==='forma')forma(c);
  if(V.bonus==='veure')p.veure=true;
  if(V.bonus==='doble'&&cel)cel.doble=true;
  if(V.bonus==='salva')p.salva[f]=true;
  if(V.bonus==='gratis')p.gratis++;
  if(V.bonus==='gent')troba(c);
  n.aportacions.push({proj,torn:S.torn});
  S.psico+=2;
  log('Aportació a <b>'+esc(V.nom)+'</b> des de '+esc(c)+'.','lliq');
  flota(V.ic+' '+V.nom+' · '+V.diu,'lliq',3400);
  pujaNivell();
  return V;
}

function comencaOnada(c){
  const n=node(c),p=n.placa;
  if(p.corrent)return;
  p.onada++;p.corrent=true;p.t=0;p.espera=0;
  const q=3+p.onada*2;
  p.restants=q;p.cua=[];
  for(let i=0;i<q;i++){
    const mena=p.onada<2?'por':p.onada<4?tria(['por','rumor']):tria(['por','rumor','extraccio']);
    /* La fila es decideix ara i no en entrar: així el mapa de xarxa de valor
       pot ensenyar per on vindran, que és el que fa un mapa. */
    p.cua.push({mena,f:Math.floor(Math.random()*FILES),quan:i*(1400-Math.min(700,p.onada*90))});
  }
  log('<b>'+esc(c)+'</b> · onada '+p.onada+': '+q+' que venen','avis');
  flota('Onada '+p.onada+' · '+q+' que venen','',2000);
  pinta();
}
/* Anar-hi abans d'hora. No és impaciència: si estàs a punt, els minuts que no
   gastes esperant són hores que et quedes. El repte és la velocitat. */
function avancaOnada(c){
  const n=node(c),p=n.placa;
  if(p.corrent)return 0;
  const guany=Math.round(Math.max(0,p.espera)/1000)*2;
  if(guany){n.hores+=guany;flota('+'+guany+' hores per no fer-te esperar','bo',2200);}
  comencaOnada(c);
  return guany;
}

/* El motor. Un sol interval per a tot: més d'un rellotge és més d'una veritat. */
let _rellotge=null;
const ritme=(cel,ms)=>cel.doble?ms/2:ms;
function tic(){
  const c=S.sel,n=node(c);
  if(!n||S.pantalla!=='comarca')return;
  const p=n.placa;
  p.t+=TIC;

  /* Les recàrregues i les fitxes corren sempre, també entre onades: el temps
     entre una onada i la següent és per recollir i plantar, no per esperar. */
  DIN_IDS.forEach(d=>{if(p.rec[d]>0)p.rec[d]=Math.max(0,p.rec[d]-TIC);});
  let perdudes=0;
  p.caigudes.forEach(x=>{x.viu-=TIC;if(x.viu<=0)perdudes++;});
  if(perdudes)p.caigudes=p.caigudes.filter(x=>x.viu>0);

  /* Una caiguda ambient, lenta. Sense això, qui encara no té banc de temps es
     queda sense hores i sense sortida —i al poble sempre hi ha algú que ofereix
     una estona. El gruix, però, ha de venir del banc: per això va a la meitat. */
  p.cai+=TIC;
  if(p.cai>=8000){
    p.cai=0;
    deixaFitxa(p,Math.floor(Math.random()*FILES),Math.floor(Math.random()*COLS),HORES_AMBIENT);
  }

  // Entren els que toquen
  if(p.corrent)p.cua=(p.cua||[]).filter(x=>{
    if(x.quan<=p.t){p.vilans.push({mena:x.mena,f:x.f,x:COLS,
      vida:VILANS[x.mena].vida,max:VILANS[x.mena].vida});return false;}
    return true;
  });

  // Els projectes fan la seva, hi hagi onada o no
  p.cel.forEach((fila,f)=>fila.forEach((cel,co)=>{
    if(!cel)return;
    if(cel.parat>0){cel.parat-=TIC;return;}
    const D=DINS[cel.d];cel.tic+=TIC;
    /* El banc de temps ja no ingressa: **deixa caure** una fitxa d'hores i
       algú l'ha de recollir. Una hora oferta que ningú agafa, es perd. */
    if(D.fa==='genera'&&cel.tic>=ritme(cel,3000)){cel.tic=0;deixaFitxa(p,f,co,HORES_FITXA);}
    if(D.fa==='tira'&&cel.tic>=ritme(cel,900)){
      cel.tic=0;
      const obj=p.vilans.filter(v=>v.f===f&&v.x>co).sort((a,b)=>a.x-b.x)[0];
      if(obj)obj.vida-=D.dany;
    }
    if(D.fa==='neteja'&&cel.tic>=ritme(cel,3000)){
      cel.tic=0;
      /* La festa no mata ningú: dissol el rumor. És el que fa una festa major
         de debò en un poble on la gent ha deixat de parlar-se. */
      p.vilans.filter(v=>v.f===f&&v.mena==='rumor').forEach(v=>{v.vida=0;});
    }
  }));

  // Els vilans caminen, ataquen i arriben
  p.vilans.forEach(v=>{
    const V=VILANS[v.mena];
    const co=Math.floor(v.x);
    const davant=co>=0&&co<COLS?p.cel[v.f][clamp(co,0,COLS-1)]:null;
    if(davant&&v.x<=co+.4){
      davant.vida-=V.dany*(davant.d==='cures'?.5:1);   // les cures aguanten més
      if(v.mena==='por')davant.parat=900;              // la por paralitza
      if(V.roba&&n.hores>0)n.hores=Math.max(0,n.hores-V.roba);
      if(davant.vida<=0){
        p.cel[v.f][co]=null;
        log('<b>'+esc(c)+'</b>: «'+esc(DINS[davant.d].nom)+'» cau a la plaça.','mal');
      }
    }else{
      /* La biblioteca alenteix qui ve a extreure: compartir el que ja hi ha
         és exactament el que treu ganes de venir a buidar-ho. */
      const alenteix=p.cel[v.f].some(x=>x&&x.d==='biblioteca')&&v.mena==='extraccio';
      v.x-=V.vel*(alenteix?.45:1)*.12;
    }
    if(v.x<-.3){
      v.arribat=true;
      /* La primera vegada que allò arriba al final del carrer, **surt gent**.
         Una vegada per fila i per plaça: un error pot ser gratuït un cop, i el
         segon ja no —un poble cansat no torna a sortir el mateix dia. */
      if(p.salva[v.f]){
        p.salva[v.f]=false;S.psico+=1;
        log('<b>'+esc(c)+'</b>: '+esc(VILANS[v.mena].nom)+' arriba i el veïnat surt al carrer.','avis');
        flota('🫂 El veïnat atura '+VILANS[v.mena].nom+'. La fila ja no en té una altra.','bo',2800);
      }else{
        S.mort+=2;
        if(n.gent.length>1){const fora=n.gent.pop();log('<b>'+esc(c)+'</b>: '+esc(VILANS[v.mena].nom)+' arriba. '+esc(fora.nom)+' plega.','mal');}
        else log('<b>'+esc(c)+'</b>: '+esc(VILANS[v.mena].nom)+' travessa la plaça.','mal');
      }
    }
  });
  p.vilans=p.vilans.filter(v=>v.vida>0&&!v.arribat);

  if(p.corrent&&!p.cua.length&&!p.vilans.length){
    p.corrent=false;p.veure=false;p.espera=ESPERA_ENTRE;p.aguantades++;
    S.onadesGuanyades++;
    n.hores+=25;S.psico+=3;
    log('<b>'+esc(c)+'</b> aguanta l\'onada '+p.onada+'.','bo');
    const noves=desbloquejades(n);
    const nova=noves[noves.length-1];
    if(noves.length>1&&nova)flota('Nova dinàmica: '+DINS[nova].ic+' '+DINS[nova].nom,'bo',3200);
    if(p.onada>=3&&!n.protegida){
      n.protegida=true;
      troba(c);
      modal('Comarca protegida',c,
        '<p>Tres onades aguantades. <strong>'+esc(c)+'</strong> ja no cau sola.</p>'+
        '<p>S\'hi ha apuntat gent nova: quan un poble aguanta, se sap.</p>'+
        '<p><em>Això no la fa invencible al mapa. Allà segueix valent la mateixa regla: '+
        'si obres més del que pots sostenir, es crema igual.</em></p>',[['Va',null]]);
    }
    pujaNivell();
  }else if(!p.corrent&&!S.acabat){
    /* L'onada ja no espera que premis res. Això és el canvi que fa que la
       plaça vagi de velocitat: el temps corre igual si tu no fas res. */
    p.espera-=TIC;
    if(p.espera<=0)comencaOnada(c);
  }
  pinta();
}
function engegaRellotge(){if(_rellotge)return;_rellotge=setInterval(tic,TIC);}
function paraRellotge(){if(_rellotge){clearInterval(_rellotge);_rellotge=null;}}

/* ── El torn · el que passa al mapa ───────────────────────────────────────── */
function passaTorn(){
  if(S.acabat)return;
  S.torn++;
  let dp=0,de=0;
  actives().forEach(c=>{
    const t=tensio(c);
    node(c).dins.forEach(d=>{const f=t===2?0.4:t===1?0.75:1;dp+=DINS[d].psico*f;de+=DINS[d].econo*f;});
  });
  if(sap('registre'))dp*=1.25;
  S.psico+=Math.round(dp);S.econo+=Math.round(de);

  // La cremada. L'única manera de perdre.
  actives().forEach(c=>{
    const n=node(c);
    if(tensio(c)!==2||!n.dins.length)return;
    const mor=n.dins[n.dins.length-1];
    n.dins=n.dins.filter(d=>d!==mor);
    n.cremades++;
    n.placa.cel.forEach((f,fi)=>f.forEach((x,co)=>{if(x&&x.d===mor)n.placa.cel[fi][co]=null;}));
    const fora=n.gent.length>1?n.gent.pop():null;
    S.mort+=3;
    log('<b>'+esc(c)+'</b>: es crema «'+esc(DINS[mor].nom)+'». '+(fora?esc(fora.nom)+' plega.':'')+
        ' Penjava de massa poca gent.','mal');
  });

  const buides=COMARQUES.length-actives().length;
  S.mort+=Math.max(0,Math.round(buides/14));
  if(S.mort>0&&S.torn%3===0)S.mort=Math.max(0,S.mort-Math.round(S.psico/40));
  if(S.torn%5===0&&!S.acabat)ofereixMcGragor();
  comprovaLiquid();
  S.accions=3+(sap('relleu')?1:0);
  if(S.mort>=40)fi(false);
  pinta();
}

/* McGragor no ataca: ofereix. La trampa del còmic 2, i ha de sortir a compte
   avui — si fos òbviament dolenta seria un espantall, no una decisió. */
function ofereixMcGragor(){
  const c=tria(actives());
  modal('Mr. McGragor','Una oferta que sembla bona',
    '<p>Un senyor amb un àbac es planta a <strong>'+esc(c)+'</strong>. Diu que ell us pot posar '+
    'el projecte en marxa demà mateix: hi posa els diners, la gent i el paper.</p>'+
    '<p>«No cal que ho aprengueu. Ja ho fem nosaltres.»</p>',
    [['Acceptar · +12 estalvi',()=>{
        S.econo+=12;S.mort+=8;node(c).gent.forEach(p=>p.formada=false);
        log('<b>'+esc(c)+'</b> accepta McGragor. Estalvi immediat — i ningú del poble sap ja com va.','mal');
        pinta();
      }],
     ['Dir que no',()=>{S.psico+=4;log('<b>'+esc(c)+'</b> li diu que no. Costa més i és seu.','bo');pinta();}]],
    'Acceptar-ho no és perdre. És el que passa a molts pobles: surt a compte avui.');
}

function clusterLiquid(){
  if(!sap('liquid'))return [];
  const bons=actives().filter(c=>node(c).trobada&&tensio(c)===0&&node(c).dins.length>=2);
  const dins=new Set(bons),vist=new Set(),grups=[];
  bons.forEach(c=>{
    if(vist.has(c))return;
    const cua=[c],g=[];vist.add(c);
    while(cua.length){
      const x=cua.pop();g.push(x);
      S.ponts.forEach(([a,b])=>{
        const alt=a===x?b:b===x?a:null;
        if(alt&&dins.has(alt)&&!vist.has(alt)){vist.add(alt);cua.push(alt);}
      });
    }
    grups.push(g);
  });
  return grups;
}
function comprovaLiquid(){
  const g=clusterLiquid().sort((a,b)=>b.length-a.length)[0]||[];
  if(g.length>=5&&!S.molekulandia){S.molekulandia=true;fi(true,g);}
}
function fi(guanya,g){
  if(S.acabat)return;
  S.acabat=guanya?'guanya':'perd';paraRellotge();
  if(guanya){
    modal('Molekulàndia','L\'estat líquid',
      '<p><strong>'+g.length+' comarques</strong> s\'aguanten entre elles. Cap depèn de tu, i cap depèn '+
      'de dues persones cansades.</p>'+
      '<p>Molekulàndia és <strong>l\'estat líquid que es configura com a xarxa descentralitzada</strong>. '+
      'No té capital ni fronteres, i no cau si en treus un tros — perquè no penja de cap tros.</p>'+
      '<p>I quan els molekulandesos es troben en persona, també <strong>és un lloc</strong>: l\'espai que '+
      'fan ells en trobar-se. Per això calia haver fet la trobada.</p>'+
      '<p><em>Nivell '+S.nivell+' · '+S.psico+' de vincle · '+formades()+' persones que ho saben portar soles.</em></p>',
      [['Tornar-hi',()=>reinicia()],['Fer-ho de debò',()=>location.href='uneix-te.html']]);
  }else{
    modal('El Mundo Muerto','S\'ha apagat',
      '<p>El gris ho ha cobert. No ha guanyat cap batalla: ha esperat que els pobles es cremessin sols.</p>'+
      '<p><strong>El que ha fallat no són les ganes.</strong> Les comarques que has perdut tenien més '+
      'projectes oberts que gent per sostenir-los.</p>'+
      '<p><em>Formar algú abans d\'obrir res més és avorrit, i és tot el joc.</em></p>',
      [['Tornar-hi',()=>reinicia()]]);
  }
}

/* ── Accions ──────────────────────────────────────────────────────────────── */
const pot=n=>!S.acabat&&S.accions>=(n||1);
const gasta=n=>{S.accions-=(n||1);};
function fesActiva(c){if(!pot())return;gasta();activa(c);S.sel=c;pujaNivell();pinta();}
function fesTroba(c){if(!pot())return;gasta();troba(c);pinta();}
function fesForma(c){
  const lliure=sap('relleu')&&node(c).gent.some(p=>p.formada);
  if(!lliure&&!pot())return;
  if(!lliure)gasta();
  if(!forma(c))log('A <b>'+esc(c)+'</b> ja ho sap portar tothom.','');
  pinta();
}
function fesEngega(c,d){
  if(!pot()||!potEngegar(c,d))return;
  /* La mateixa porta que a la plaça: una dinàmica que encara no saps portar no
     s'obre pel fet de ser al mapa. Si el mapa la deixés obrir i la plaça no,
     hi hauria dues regles per a la mateixa cosa. */
  if(!desbloquejades(node(c)).includes(d))return;
  gasta();node(c).dins.push(d);
  log('<b>'+esc(c)+'</b> engega «'+esc(DINS[d].nom)+'»','bo');
  if(tensio(c)===2)log('Compte: <b>'+esc(c)+'</b> ja va per sobre del que pot sostenir.','avis');
  pujaNivell();pinta();
}
function fesTrobada(c){
  if(!pot())return;
  gasta();node(c).trobada=true;S.psico+=3;
  log('<b>'+esc(c)+'</b> es troba en persona. Molekulàndia també és un lloc.','lliq');
  pinta();
}
function fesPont(c){
  if(!pot()||!sap('pont'))return;
  const altres=actives().filter(x=>x!==c&&!S.ponts.some(p=>(p[0]===c&&p[1]===x)||(p[0]===x&&p[1]===c)));
  if(!altres.length)return;
  modal('Pont','Lliga '+c+' amb…','<p>Un node lligat reparteix la càrrega amb l\'altre.</p>',
    altres.slice(0,6).map(x=>[x,()=>{gasta();S.ponts.push([c,x]);
      log('Pont entre <b>'+esc(c)+'</b> i <b>'+esc(x)+'</b>','lliq');pinta();}]));
}

/* ══ MINIJOCS ══════════════════════════════════════════════════════════════
   Tres, i cadascun ensenya una cosa que el SOS fa de debò. Cap dona punts per
   punts: tots tres alimenten el model —hores, gent, o una persona formada. */

/* 1 · Aparella · el que fa un banc de temps, fet joc.
      Qui ofereix i qui busca no es troben sols: algú els ha de creuar. */
const OFERTES=[['🍲','Cuino per a colles'],['🚗','Porto amb el cotxe'],['🔧','Arreglo persianes'],
  ['💻','Configuro ordinadors'],['📚','Faig repàs'],['🌱','Sé podar'],['🧵','Cuso i arreglo'],['👵','Acompanyo']];
const DEMANDES=[['🍲','Cal menjar per a 40'],['🚗','He d\'anar al metge'],['🔧','La persiana no baixa'],
  ['💻','El mòbil no va'],['📚','El nen suspèn mates'],['🌱','La vinya està feta un desastre'],
  ['🧵','Cal pujar uns pantalons'],['👵','La iaia està sola']];
function mjAparella(){
  const c=S.sel,n=node(c);
  const idx=[0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5).slice(0,4);
  const esq=idx.map(i=>({i,t:OFERTES[i]})).sort(()=>Math.random()-.5);
  const dre=idx.map(i=>({i,t:DEMANDES[i]})).sort(()=>Math.random()-.5);
  let sel=null,fets=0,errors=0;
  const dibuixa=()=>{
    $('#dlCos').innerHTML='<p>Qui ofereix i qui busca <strong>no es troben sols</strong>. Creua\'ls.</p>'+
      '<div class="mj-est"><span>'+fets+' de 4</span><span>'+errors+' errades</span></div>'+
      '<div class="mj-parell" style="margin-top:.5rem"><div class="mj">'+
      esq.map(o=>'<button class="mj-b'+(o.fet?' ok':'')+(sel&&sel.i===o.i?' sel':'')+'" data-o="'+o.i+'"'+
        (o.fet?' disabled':'')+'>'+o.t[0]+' '+esc(o.t[1])+'</button>').join('')+
      '</div><div class="mj">'+
      dre.map(d=>'<button class="mj-b'+(d.fet?' ok':'')+'" data-d="'+d.i+'"'+(d.fet?' disabled':'')+'>'+
        d.t[0]+' '+esc(d.t[1])+'</button>').join('')+'</div></div>';
  };
  const clic=e=>{
    const o=e.target.closest('[data-o]'),d=e.target.closest('[data-d]');
    if(o){sel={i:Number(o.dataset.o)};return dibuixa();}
    if(!d||!sel)return;
    const i=Number(d.dataset.d);
    if(i===sel.i){
      esq.find(x=>x.i===i).fet=true;dre.find(x=>x.i===i).fet=true;fets++;sel=null;
      if(fets===4){
        $('#dlCos').removeEventListener('click',clic);
        const guany=20+ (4-errors)*8;
        n.hores+=guany;S.psico+=2;
        log('<b>'+esc(c)+'</b>: quatre creuaments fets. +'+guany+' hores','bo');
        return modal('Aparellat','Quatre parelles',
          '<p>Has creuat quatre coses que ja hi eren. <strong>+'+guany+' hores.</strong></p>'+
          '<p><em>Això és literalment el que fa el SOS quan diu «coincidència»: no inventa res, '+
          'ensenya el que ja encaixava i no es veia.</em></p>',[['Va',()=>pinta()]]);
      }
    }else{errors++;sel=null;}
    dibuixa();
  };
  modal('Miniojoc','Aparella el que ja hi és','',[['Deixar-ho',()=>pinta()]]);
  dibuixa();
  $('#dlCos').addEventListener('click',clic);
}

/* 2 · La Bomba Disco · trencar la cuirassa d'Afrodito.
      Toca quan el disc passa per la zona. Qui apareix ve amb un rol nou. */
function mjDisco(){
  const c=S.sel;
  let x=0,dir=1,encerts=0,intents=0,acabat=false,anim=null;
  const dibuixa=()=>{
    $('#dlCos').innerHTML='<p>L\'Afrodito vivia sota un abric de cuir, amagant-se. El que el va treure '+
      'no va ser una xerrada: va ser <strong>la Bomba Disco</strong>.</p>'+
      '<div class="mj-est"><span>'+encerts+' de 3</span><span>'+intents+' intents</span></div>'+
      '<div class="disco" id="disco"><div class="zona"></div><div class="puck" id="puck">🪩</div></div>'+
      '<p style="font-size:.76rem;margin-top:.5rem">Toca quan el disc sigui a la franja verda.</p>';
  };
  const mou=()=>{
    x+=dir*2.4;
    if(x>100){x=100;dir=-1;} if(x<0){x=0;dir=1;}
    const p=$('#puck');if(p)p.style.left=x+'%';
  };
  const toca=()=>{
    if(acabat)return;
    intents++;
    if(x>40&&x<60){
      encerts++;
      if(encerts>=3){
        acabat=true;clearInterval(anim);
        const p=troba(c);p.formada=false;
        S.psico+=3;
        return modal('Bomba Disco','Ha sortit de sota l\'abric',
          '<p><strong>'+esc(p.nom)+'</strong> s\'apunta · '+ROLS[p.rol].ic+' '+esc(ROLS[p.rol].nom)+'.</p>'+
          '<p><em>No li faltava talent: li sobrava cuirassa. El que la treu no és convèncer ningú, '+
          'és fer que passi alguna cosa on val la pena sortir.</em></p>',[['Va',()=>pinta()]]);
      }
    }
    dibuixa();
  };
  modal('Miniojoc','La Bomba Disco','',[['Deixar-ho',()=>{clearInterval(anim);pinta();}]]);
  dibuixa();
  anim=setInterval(mou,30);
  $('#dlCos').addEventListener('click',e=>{if(e.target.closest('.disco'))toca();});
  $('#dlg').addEventListener('close',()=>clearInterval(anim),{once:true});
}

/* 3 · Reparteix la càrrega · la regla de la cremada, com a trencaclosques.
      Repartir el que hi ha entre qui hi ha. Si algú passa de dos, es crema. */
function mjCarrega(){
  const c=S.sel,n=node(c);
  const gent=n.gent.slice(0,5).map(p=>({nom:p.nom.split(' ')[0],rol:p.rol,pes:0}));
  if(gent.length<2)return modal('Encara no','Falta gent',
    '<p>Amb una sola persona no hi ha res a repartir. Això també és una lliçó.</p>',[['Va',null]]);
  const feines=n.dins.length?n.dins.slice(0,6):['banctemps','biblioteca','cures'];
  let i=0;
  const dibuixa=()=>{
    const fet=i>=feines.length;
    const cremat=gent.some(g=>g.pes>2);
    $('#dlCos').innerHTML='<p>Reparteix les feines. <strong>Ningú pot portar-ne més de dues</strong> — '+
      'la tercera és la que crema.</p>'+
      (fet?'':'<p style="color:var(--amber)">Ara toca: <strong>'+esc(DINS[feines[i]].nom)+'</strong>. A qui?</p>')+
      '<div class="carr">'+gent.map((g,j)=>'<button class="carr-p '+(g.pes>2?'ple':g.pes?'ok':'')+'" data-g="'+j+'"'+
        (fet?' disabled':'')+'><span>'+ROLS[g.rol].ic+'</span><span class="nm">'+esc(g.nom)+'</span>'+
        '<span class="num">'+g.pes+'</span></button>').join('')+'</div>'+
      (fet?('<p style="margin-top:.7rem">'+(cremat?
        '<strong style="color:var(--red)">Algú en porta tres.</strong> Això és exactament el que passa '+
        'als pobles: no cau el projecte, cau la persona.':
        '<strong style="color:var(--green)">Ningú va sobrecarregat.</strong>')+'</p>'):'');
  };
  const clic=e=>{
    const b=e.target.closest('[data-g]');if(!b||i>=feines.length)return;
    gent[Number(b.dataset.g)].pes++;i++;
    dibuixa();
    if(i>=feines.length){
      const cremat=gent.some(g=>g.pes>2);
      $('#dlCos').removeEventListener('click',clic);
      setTimeout(()=>{
        if(cremat){S.mort+=2;log('<b>'+esc(c)+'</b>: el repartiment deixa algú amb tres feines.','avis');}
        else{const p=forma(c);n.hores+=15;
          log('<b>'+esc(c)+'</b>: repartiment net. '+(p?esc(p.nom)+' es forma.':'')+' +15 hores','bo');}
        modal('Repartit',cremat?'Algú n\'ha quedat amb tres':'Ningú va sobrecarregat',
          cremat?'<p>El Mundo Muerto avança una mica. No perquè hagi atacat: perquè algú s\'ha cremat.</p>'+
                 '<p><strong>No cau el projecte: cau la persona.</strong> I quan cau, s\'emporta el projecte '+
                 'amb ella. Per això la regla és aquesta i no una altra.</p>'
                :'<p>Repartir bé <strong>forma gent</strong>: qui porta una cosa sola l\'aprèn a portar.</p>',
          [['Va',()=>pinta()]]);
      },600);
    }
  };
  modal('Miniojoc','Reparteix la càrrega','',[['Deixar-ho',()=>pinta()]]);
  dibuixa();
  $('#dlCos').addEventListener('click',clic);
}

/* ── Pintar ───────────────────────────────────────────────────────────────── */
let semSel=null;
function pinta(){
  const n=node(S.sel);
  $('#pAcc').textContent=S.accions;
  $('#pHores').textContent=n?n.hores:0;
  $('#pPsico').textContent=S.psico;
  $('#pApo').textContent=aportacions();
  $('#pMort').textContent=S.mort;
  $('#btnTorn').disabled=!!S.acabat;
  $('#btnEnrere').hidden=S.pantalla!=='comarca';
  $('#pMapa').classList.toggle('on',S.pantalla==='mapa');
  $('#pComarca').classList.toggle('on',S.pantalla==='comarca');
  const niv=NIVELLS.find(x=>x.id===S.nivell);
  if(S.pantalla==='mapa'){
    $('#hudTit').innerHTML='El joc del Comando<small>'+esc(niv.nom)+' · T'+S.torn+' · '+actives().length+' comarca'+(actives().length===1?'':'s')+'</small>';
    pintaMapa();
  }else{
    $('#hudTit').innerHTML=esc(S.sel)+'<small>'+esc(niv.nom)+' · '+(n?n.gent.length:0)+'p</small>';
    pintaComarca();
  }
  pintaPolze();
  const d=S.diari.slice(-12).map(l=>'<div class="li '+l.mena+'">'+l.txt+'</div>').join('');
  $('#diari').innerHTML=d;$('#diari2').innerHTML=d;
}
function classeCas(c){
  if(!S.nodes[c])return 'pot';
  const g=clusterLiquid().find(x=>x.includes(c));
  if(g&&g.length>=5)return 'on liq';
  const t=tensio(c);
  return t===2?'on morta':t===1?'on risc':'on';
}
function pintaMapa(){
  $('#mapa').innerHTML=PROVS.map(pr=>{
    const cs=COMARQUES.filter(x=>x[1]===pr);
    return '<div class="prov-t">'+esc(pr)+'</div><div class="caselles">'+
      cs.map(([c])=>{
        const n=S.nodes[c];
        const st=n?(n.gent.length+'p · '+carrega(c)+'/'+capacitat(c)):'—';
        return '<button class="cas '+classeCas(c)+'" data-c="'+esc(c)+'">'+
          '<span class="nm">'+esc(c)+'</span><span class="st">'+esc(st)+'</span></button>';
      }).join('')+'</div>';
  }).join('');
}
function pintaComarca(){
  const c=S.sel,n=node(c);
  if(!n){S.pantalla='mapa';return;}
  const cap=capacitat(c),car=carrega(c),t=tensio(c);
  const pct=cap?Math.min(100,Math.round(car/cap*100)):0;
  $('#fitxa').innerHTML=
    '<div class="lin"><span>càrrega '+car+' / '+cap+'</span><span>'+
      (t===2?'Es crema':t===1?'Va just':'Aguanta')+(n.protegida?' · protegida':'')+'</span></div>'+
    '<div class="barra '+(t===2?'critica':t===1?'alta':'')+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="equip">'+n.gent.map(p=>'<span class="pers'+(p.formada?' form':'')+'">'+ROLS[p.rol].ic+' '+
      esc(p.nom.split(' ')[0])+'</span>').join('')+'</div>';
  const p=n.placa;
  /* Entre onades hi ha un compte enrere, no una espera indefinida. Saber quant
     et queda és el que fa que corris: sense el número, la pressa no existeix. */
  if(p.corrent){
    $('#onTxt').textContent='Onada '+p.onada+' · '+(p.vilans.length+(p.cua||[]).length)+' venen';
    $('#onBar').style.width=Math.min(100,(p.vilans.length+(p.cua||[]).length)*12)+'%';
  }else{
    $('#onTxt').textContent='Onada '+(p.onada+1)+' en '+Math.max(0,Math.ceil(p.espera/1000))+' s';
    $('#onBar').style.width=Math.round(100-clamp(p.espera,0,ESPERA_ENTRE)/ESPERA_ENTRE*100)+'%';
  }
  pintaPlaca();
  $('#minis').innerHTML=
    '<button class="mini" data-mj="aparella"><b>🔀</b>Aparella</button>'+
    '<button class="mini" data-mj="disco"><b>🪩</b>Bomba Disco</button>'+
    '<button class="mini" data-mj="carrega"><b>⚖️</b>Reparteix</button>';
}
const PALA='__pala';
let _caiClau='';
function pintaPlaca(){
  const n=node(S.sel);if(!n)return;
  const p=n.placa;
  /* Amb un llavor triat, el tauler diu on es pot posar. El motiu de per què no
     surt de `motiuNo`, la mateixa funció que fa servir `planta()`. */
  const bloq=(semSel&&semSel!==PALA)?motiuNo(S.sel,semSel):null;
  const files=p.cel.map((fila,f)=>'<div class="fila">'+fila.map((cel,co)=>{
    const D=cel?DINS[cel.d]:null;
    const vida=cel?Math.max(0,Math.round(cel.vida/cel.max*100)):0;
    const V=p.valor.find(x=>x.f===f&&x.co===co);
    let cl=cel?('te'+(cel.parat>0?' parat':'')):'buida';
    if(V&&!cel)cl+=' val-cas';
    if(semSel===PALA)cl+=cel?' pot':' apaga';
    else if(semSel)cl+=(!cel&&!bloq)?' pot':' apaga';
    return '<button class="cel cel-wrap '+cl+'" data-f="'+f+'" data-co="'+co+'">'+
      (V&&!cel?'<span class="val">'+valorPer(V.proj).ic+'</span>':'')+
      (cel?(D.ic+'<span class="hp"><i style="width:'+vida+'%"></i></span>'):'')+'</button>';
  }).join('')+'</div>').join('');
  $('#reixa').innerHTML=files;
  /* Amb el mapa de xarxa de valor fet, es veu per quina fila entra el que ve
     abans que entri. Un mapa serveix per això i no per res més. */
  /* Dins del tauler i no a 104%: `.placa` retalla el que en surt, i l'avís del
     mapa de valor no es veuria enlloc —un bonus que no es nota és cap bonus. */
  const cua=p.veure?(p.cua||[]).slice(0,3).map((x,i)=>
    '<span class="vil" style="left:'+(95-i*4)+'%;top:'+((x.f+.5)/FILES*100)+
    '%;opacity:'+(.42-i*.1)+';font-size:.9rem">'+VILANS[x.mena].ic+'</span>').join(''):'';
  $('#vilans').innerHTML=p.vilans.map(v=>{
    const V=VILANS[v.mena];
    const left=clamp((v.x+.5)/COLS*100,-6,106);
    const top=(v.f+.5)/FILES*100;
    return '<span class="vil" style="left:'+left+'%;top:'+top+'%">'+V.ic+
      '<small>'+Math.max(0,Math.round(v.vida))+'</small></span>';
  }).join('')+cua;
  $('#marges').innerHTML=p.salva.map((viu,f)=>
    '<span class="'+(viu?'':'gastat')+'" style="top:'+((f+.5)/FILES*100)+'%">🫂</span>').join('');
  /* La capa de fitxes només es torna a dibuixar quan canvia el que hi ha. Si es
     refés a cada tic, el dit tocaria un element que ja no existeix. */
  const clau=p.caigudes.map(x=>x.id).join(',');
  if(clau!==_caiClau){
    _caiClau=clau;
    $('#caigudes').innerHTML=p.caigudes.map(x=>
      '<button class="cai" data-cai="'+x.id+'" '+
      'style="left:'+((x.co+.5)/COLS*100)+'%;top:'+((x.f+.5)/FILES*100)+'%" '+
      'aria-label="Recull '+x.val+' hores">⏳</button>').join('');
  }
  /* «Se'n va» és una classe sobre el botó que ja hi és, no un botó nou: si es
     refés per avisar que caduca, el canvi arribaria just quan hi tens el dit. */
  $('#caigudes').querySelectorAll('[data-cai]').forEach(el=>{
    const x=p.caigudes.find(y=>y.id===Number(el.dataset.cai));
    el.classList.toggle('fuig',!!x&&x.viu<2400);
  });
}
/* La barra es refà 8 cops per segon si no es vigila, i llavors la tira torna a
   l'inici cada vegada que l'arrossegues i el botó se't mou sota el dit. Es
   compara l'HTML abans d'escriure'l, i l'ompliment de recàrrega —que sí que
   canvia a cada tic— es posa a part, sobre els nodes que ja hi són. */
let _polzeHTML='';
function pintaPolze(){
  const box=$('#polze');
  if(S.pantalla==='mapa'){
    const c=S.sel,hi=!!S.nodes[c];
    const h='<div class="tira">'+
      '<div class="sem" style="width:auto;padding:.4rem .7rem"><span class="ic">📍</span>'+esc(c)+'</div></div>'+
      '<div class="accions">'+
      (hi?'<button class="b-pri" data-a="entra">Entra a la plaça</button>'
         :'<button class="b-pri" data-a="activa"'+(pot()?'':' disabled')+'>Activa · 1 acció</button>')+
      '<button data-a="troba"'+(hi&&pot()?'':' disabled')+'>Troba gent · 1</button>'+
      '<button data-a="forma"'+(hi&&(pot()||sap('relleu'))?'':' disabled')+'>Forma · 1</button>'+
      '</div>';
    if(h!==_polzeHTML){_polzeHTML=h;box.innerHTML=h;}
    return;
  }
  const n=node(S.sel),p=n.placa;
  /* Només les que ja saps portar. Vuit targetes el primer minut, sis d'elles
     apagades, no són sis opcions: són una pantalla que no es pot llegir. */
  const h='<div class="eines"><div class="tira">'+desbloquejades(n).map(d=>{
    const D=DINS[d],no=motiuNo(S.sel,d);
    return '<button class="sem'+(semSel===d?' sel':'')+(no?' no':'')+'" data-sem="'+d+'">'+
      '<span class="ic">'+D.ic+'</span><span>'+esc(D.nom)+'</span>'+
      '<span class="cost">'+((p.gratis>0||!D.cost)?'gratis':D.cost+' h')+'</span>'+
      '<span class="rec" data-rec="'+d+'"></span></button>';
  }).join('')+'</div>'+
  '<button class="sem pala'+(semSel===PALA?' sel':'')+'" data-sem="'+PALA+'">'+
    '<span class="ic">🧹</span><span>Treure</span></button>'+
  '</div>'+
  '<div class="accions">'+
    '<button class="b-pri" data-a="onada"'+(p.corrent?' disabled':'')+'>'+
      (p.corrent?'Onada en marxa':'⏩ Ja! · onada '+(p.onada+1))+'</button>'+
    '<button data-a="trobada"'+(n.trobada||!pot()?' disabled':'')+'>'+(n.trobada?'Ja us heu vist':'Trobada · 1')+'</button>'+
    (sap('pont')?'<button data-a="pont"'+(pot()?'':' disabled')+'>Lliga · 1</button>':'')+
  '</div>';
  if(h!==_polzeHTML){_polzeHTML=h;box.innerHTML=h;}
  box.querySelectorAll('[data-rec]').forEach(el=>{
    const d=el.dataset.rec,r=p.rec[d]>0?Math.round(p.rec[d]/recDe(d)*100):0;
    el.style.height=r+'%';el.style.display=r?'block':'none';
  });
}

/* ── Modal ────────────────────────────────────────────────────────────────── */
function modal(kick,tit,cos,opcions,nota){
  $('#dlKick').textContent=kick;$('#dlTit').textContent=tit;
  $('#dlCos').innerHTML=cos+(nota?'<p style="font-size:.76rem;color:var(--muted);border-top:1px solid var(--border);padding-top:.6rem">'+esc(nota)+'</p>':'');
  $('#dlPeu').innerHTML='';
  (opcions||[['Tanca',null]]).forEach(([txt,fn],i)=>{
    const b=document.createElement('button');
    b.textContent=txt;if(i===0)b.className='b-pri';
    b.onclick=()=>{$('#dlg').close();if(fn)fn();};
    $('#dlPeu').appendChild(b);
  });
  if(!$('#dlg').open)$('#dlg').showModal();
}
/* ═══ LA INTRODUCCIÓ ═══════════════════════════════════════════════════════
   Abans això era un mur de text en un modal: tres regles escrites, cap
   provada. Qui el llegia el tancava i entrava sense saber què decidia la
   partida —i el que decideix la partida és una sola cosa, la càrrega contra la
   capacitat, que en una frase no es veu i tocant-la s'entén de seguida.

   Set passos. El tercer no explica la regla: **la deixa provar**, i les xifres
   que ensenya surten de `capacitatDe`, `carregaDe` i `tensioDe` —les mateixes
   que decideixen la partida de debò. Si el model canviés, el tutorial canviaria
   amb ell; amb una còpia, seguiria ensenyant les regles velles.

   Veda 117. */
/* El laboratori comença **en verd**, i s'ha de poder recórrer verd → just →
   es crema amb tres tocs. Si comencés cremat, el primer que veuria qui entra
   seria un error seu, i l'ordre dels projectes és fix perquè la pujada de
   càrrega sigui gradual i no un salt. */
const LAB_GENT=5, LAB_ORDRE=['banctemps','festa','biblioteca','cures','consum'];
const labInici=()=>({gent:Array.from({length:LAB_GENT},()=>({rol:'connecta',formada:false})),
  dins:['banctemps']});
const LAB=labInici();
function labPinta(){
  const cap=capacitatDe(LAB),car=carregaDe(LAB),t=tensioDe(LAB);
  const c=['var(--green)','var(--amber)','var(--red)'][t];
  const est=['Va sobrat','Va just','Es crema'][t];
  const box=$('#inLab');
  if(!box)return;
  box.querySelector('#labCap').textContent=cap;
  box.querySelector('#labCar').textContent=car;
  box.querySelector('#labPer').textContent=LAB.gent.length;
  box.querySelector('#labForm').textContent=LAB.gent.filter(p=>p.formada).length;
  const b=box.querySelector('#labBar');
  b.style.width=Math.min(100,cap?car*100/cap:0)+'%';
  b.style.background=c;
  const e=box.querySelector('#labEst');
  e.textContent=est+' · càrrega '+car+' de capacitat '+cap;
  e.style.color=c;
}
const LAB_HTML=
  '<div class="in-lab" id="inLab">'+
    '<div class="in-xifres">'+
      '<div><div class="n" id="labPer">5</div><div class="l">persones</div></div>'+
      '<div><div class="n" id="labForm">0</div><div class="l">formades</div></div>'+
      '<div><div class="n" style="color:var(--green)" id="labCap">5</div><div class="l">capacitat</div></div>'+
      '<div><div class="n" style="color:var(--amber)" id="labCar">3</div><div class="l">càrrega</div></div>'+
    '</div>'+
    '<div class="in-barra"><i id="labBar"></i></div>'+
    '<div class="in-est" id="labEst"></div>'+
    '<div class="in-bots">'+
      '<button type="button" data-lab="gent">+ una persona</button>'+
      '<button type="button" data-lab="forma">forma\'n una</button>'+
      '<button type="button" data-lab="dins">+ un projecte</button>'+
      '<button type="button" data-lab="reset">↺</button>'+
    '</div>'+
  '</div>';
function labAcciona(q){
  if(q==='gent')LAB.gent.push({rol:'connecta',formada:false});
  if(q==='forma'){const p=LAB.gent.find(x=>!x.formada);if(p)p.formada=true;}
  if(q==='dins'){const lliure=LAB_ORDRE.find(d=>!LAB.dins.includes(d));if(lliure)LAB.dins.push(lliure);}
  if(q==='reset'){const i=labInici();LAB.gent=i.gent;LAB.dins=i.dins;}
  labPinta();
}

let inPas=0;
function pintaIntro(){
  const P=INTRO[inPas];
  $('#inN').textContent=P.n;
  $('#inT').textContent=P.t;
  $('#inCos').innerHTML=P.cos();
  $('#inPunts').innerHTML=INTRO.map((x,i)=>
    '<i class="'+(i===inPas?'on':(i<inPas?'fet':''))+'"></i>').join('');
  $('#inEnrere').disabled=inPas===0;
  $('#inAvant').textContent=inPas===INTRO.length-1?'Comença':'Següent';
  if(P.munta)P.munta();
}
function obreIntro(i){
  inPas=Math.max(0,Math.min(INTRO.length-1,i||0));
  $('#intro').hidden=false;
  pintaIntro();
}
function tancaIntro(){
  $('#intro').hidden=true;
  try{localStorage.setItem('joc_intro','1');}catch(e){/* sense memòria: es juga igual */}
}
const ajuda=()=>obreIntro(0);

function reinicia(){
  paraRellotge();
  /* Les capes que es pinten «només si han canviat» han d'oblidar el que
     recorden: si no, una partida nova ensenyaria les fitxes de l'anterior. */
  _caiClau='';_polzeHTML='';semSel=null;
  clearTimeout(_flot);S.flot=null;
  ['#caigudes','#flot','#marges'].forEach(s=>{const e=$(s);if(e){e.innerHTML='';e.className=s==='#caigudes'?'caigudes':(s==='#marges'?'marges':'');}});
  Object.assign(S,{torn:1,accions:3,psico:0,econo:0,mort:0,nodes:{},sabers:[],ponts:[],
    sel:INICI,pantalla:'mapa',nivell:'N0',rols:['simpatitzant'],onadesGuanyades:0,
    molekulandia:false,acabat:null,diari:[]});
  activa(INICI,true);
  log('El Molekulon passa el coneixement a Mazinguer i Horacio Motomachi. Comencen a <b>'+esc(INICI)+'</b>.','lliq');
  pinta();
}

/* ── Enganxar-ho ──────────────────────────────────────────────────────────── */
$('#mapa').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b)return;
  const c=b.dataset.c;
  /* Tocar una comarca activa hi entra directament: amb el polze, dos passos
     per fer una cosa òbvia són un pas de més. */
  S.sel=c;
  if(S.nodes[c]){S.pantalla='comarca';engegaRellotge();}
  pinta();
});
$('#placa').addEventListener('click',e=>{
  /* Primer les fitxes: estan a sobre i recollir-les no ha de plantar res. */
  const fit=e.target.closest('[data-cai]');
  if(fit){
    const v=recull(Number(fit.dataset.cai));
    if(v)flota('+'+v+' hores','bo',1200);
    pinta();return;
  }
  const cel=e.target.closest('[data-f]');if(!cel)return;
  const f=Number(cel.dataset.f),co=Number(cel.dataset.co);
  if(semSel===PALA){
    if(llevaPlanta(S.sel,f,co))flota('Tret. Torna-hi on toqui.','',1600);
    pinta();return;
  }
  if(!semSel){flota('Tria una dinàmica de la barra de baix','',1800);return;}
  const r=planta(S.sel,f,co,semSel);
  /* El motiu surt on tens el dit, no al diari: un avís a 400px de la mirada
     no és un avís, és una nota per a després. */
  if(!r.ok){log(r.per,'avis');flota(r.per,'',2400);}
  pinta();
});
$('#minis').addEventListener('click',e=>{
  const b=e.target.closest('[data-mj]');if(!b)return;
  if(b.dataset.mj==='aparella')mjAparella();
  else if(b.dataset.mj==='disco')mjDisco();
  else mjCarrega();
});
$('#polze').addEventListener('click',e=>{
  const sem=e.target.closest('[data-sem]');
  if(sem){semSel=semSel===sem.dataset.sem?null:sem.dataset.sem;return pinta();}
  const a=e.target.closest('[data-a]');if(!a)return;
  const c=S.sel;
  const q=a.dataset.a;
  if(q==='activa')fesActiva(c);
  else if(q==='entra'){S.pantalla='comarca';engegaRellotge();pinta();}
  else if(q==='troba')fesTroba(c);
  else if(q==='forma')fesForma(c);
  else if(q==='trobada')fesTrobada(c);
  else if(q==='pont')fesPont(c);
  else if(q==='onada')avancaOnada(c);
});
$('#btnEnrere').addEventListener('click',()=>{S.pantalla='mapa';paraRellotge();semSel=null;pinta();});
$('#btnTorn').addEventListener('click',passaTorn);
$('#btnAjuda').addEventListener('click',ajuda);

  mjAparella,mjDisco,mjCarrega,entra:c=>{S.sel=c;S.pantalla='comarca';pinta();},
  selSem:d=>{semSel=d;},
  INTRO,LAB,labPinta,labAcciona,obreIntro,tancaIntro,pas:()=>inPas,
  capacitatDe,carregaDe,tensioDe,
  VALOR,valorPer,DESBLOQUEIG,desbloquejades,recDe,motiuNo,aportacions,
  deixaFitxa,recull,aplicaBonus,llevaPlanta,avancaOnada,PALA,
  HORES_FITXA,ESPERA_PRIMERA,ESPERA_ENTRE};

$('#inAvant').addEventListener('click',()=>{
  if(inPas<INTRO.length-1){inPas++;pintaIntro();}else tancaIntro();
});
$('#inEnrere').addEventListener('click',()=>{if(inPas>0){inPas--;pintaIntro();}});
$('#inSalta').addEventListener('click',tancaIntro);

reinicia();
/* La primera vegada s'obre sola. Qui ja hi ha estat entra directe i la té al
   botó «?»: obligar-la cada cop seria un peatge, i no tenir-la enlloc deixaria
   la partida sense explicar. */
/* La condició es torna a mirar en disparar-se, no només en programar-la: si
   entremig algú ja l'ha tancada, obrir-la seria tornar-li a posar al davant una
   cosa que acaba de treure. */
try{ if(!localStorage.getItem('joc_intro'))
  setTimeout(()=>{try{if(!localStorage.getItem('joc_intro'))obreIntro(0);}catch(e){obreIntro(0);}},400); }
catch(e){ /* sense emmagatzematge: no s'obre sola i el botó segueix */ }
