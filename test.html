
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                body {
                  background-color: white; /* Ensure the iframe has a white background */
                }

                
              </style>

              <script>
                              const hre = require("hardhat");
const fs = require("fs");
const path = require("path");

async function main() {
    console.log("🚀 Iniciando despliegue de sistema tokenómico...\n");
    
    // Leer configuración desde tokenomics-config.json
    const configPath = path.join(__dirname, "../tokenomics-config.json");
    const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
    
    console.log(`📦 Configuración cargada para proyecto: ${config.projectName}`);
    console.log(`💰 Suministro total: ${config.totalSupply.toLocaleString()} tokens\n`);
    
    // Validar configuración
    validateConfig(config);
    
    // Obtener cuentas
    const [deployer] = await hre.ethers.getSigners();
    console.log(`👤 Desplegando desde cuenta: ${deployer.address}`);
    console.log(`💰 Saldo: ${(await deployer.provider.getBalance(deployer.address)).toString()}\n`);
    
    // 1. Desplegar Phase0Token (Value Accounting Token)
    console.log("🔧 Desplegando Phase0Token (Value Accounting)...");
    const Phase0Token = await hre.ethers.getContractFactory("Phase0Token");
    const phase0Token = await Phase0Token.deploy(
        `${config.projectName} Value Units`,
        "PVU",
        deployer.address // Temporal, luego se transferirá a multisig
    );
    await phase0Token.waitForDeployment();
    console.log(`✅ Phase0Token desplegado en: ${await phase0Token.getAddress()}\n`);
    
    // 2. Desplegar Phase1Token (Token Principal)
    console.log("🔧 Desplegando Phase1Token (Token Principal)...");
    
    // Calcular allocationsConfig (simplificado para ejemplo)
    // En producción: crear hash con todos los parámetros de asignación
    const allocationsConfig = hre.ethers.keccak256(
        hre.ethers.AbiCoder.defaultAbiCoder().encode(
            ["uint16", "uint16", "uint16", "uint16"],
            [
                config.allocations.investors * 100,   // Convertir % a basis points
                config.allocations.team * 100,
                config.allocations.communityReserve * 100,
                config.allocations.treasury * 100
            ]
        )
    );
    
    const Phase1Token = await hre.ethers.getContractFactory("Phase1Token");
    const phase1Token = await Phase1Token.deploy(
        config.projectName,
        config.symbol || "TKN",
        hre.ethers.parseUnits(config.totalSupply.toString(), 18),
        allocationsConfig,
        deployer.address // Temporal, luego se transferirá a multisig
    );
    await phase1Token.waitForDeployment();
    const phase1Address = await phase1Token.getAddress();
    console.log(`✅ Phase1Token desplegado en: ${phase1Address}\n`);
    
    // 3. Configurar direcciones críticas
    console.log("⚙️ Configurando direcciones críticas...");
    const treasuryAddress = config.treasuryAddress || deployer.address;
    
    await phase1Token.setCriticalAddresses(
        treasuryAddress,
        await phase0Token.getAddress()
    );
    console.log(`✅ Direcciones críticas configuradas`);
    console.log(`   Tesorería: ${treasuryAddress}`);
    console.log(`   Phase0Token: ${await phase0Token.getAddress()}\n`);
    
    // 4. Configurar miembros del equipo con vesting
    console.log("👔 Configurando miembros del equipo con vesting...");
    const vestingStart = Math.floor(Date.now() / 1000); // Ahora en timestamp
    
    for (const member of config.teamAllocations) {
        await phase1Token.addTeamMember(
            member.address,
            hre.ethers.parseUnits(member.allocation.toString(), 18),
            vestingStart,
            config.vesting.teamCliffDays * 86400, // Convertir días a segundos
            config.vesting.teamVestingDays * 86400
        );
        console.log(`   ✅ ${member.address}: ${member.allocation} tokens con vesting`);
    }
    console.log("");
    
    // 5. Configurar rondas de inversión Fibonacci
    console.log("📈 Configurando rondas de inversión Fibonacci...");
    let totalRoundPercentage = 0;
    
    for (const round of config.fibonacciRounds) {
        totalRoundPercentage += round.percentage;
        
        // Calcular precio por token (ejemplo: incremento según Fibonacci)
        // En producción, esto vendría de la configuración o se calcularía off-chain
        const priceMultiplier = round.round; // Simplificado: ronda 1 = 1x, ronda 2 = 2x, etc.
        const pricePerToken = hre.ethers.parseUnits((0.001 * priceMultiplier).toString(), "ether");
        
        await phase1Token.configureInvestmentRound(
            `Ronda ${round.round} - ${config.projectName}`,
            round.percentage * 100, // Convertir % a basis points
            pricePerToken,
            vestingStart + (round.round - 1) * 90 * 86400, // Inicio cada 90 días
            vestingStart + round.round * 90 * 86400,       // Fin después de 90 días
            round.round > 1, // Aplicar vesting a rondas posteriores a la primera
            round.round > 1 ? 180 * 86400 : 0, // Cliff de 6 meses para rondas posteriores
            round.round > 1 ? 365 * 86400 : 0  // Vesting de 1 año para rondas posteriores
        );
        
        console.log(`   ✅ Ronda ${round.round}: ${round.percentage}% del suministro total`);
    }
    
    console.log(`   📊 Total asignado en rondas: ${totalRoundPercentage}%\n`);
    
    // 6. Configurar snapshot de UV para distribución de comunidad
    console.log("👥 Configurando distribución de comunidad basada en UV...");
    let totalUV = 0;
    for (const stakeholder of config.valueAccountingSnapshot) {
        totalUV += stakeholder.uvAmount;
    }
    
    await phase1Token.setCommunityDistributionSnapshot(totalUV);
    console.log(`   ✅ Snapshot configurado con ${totalUV} UV totales\n`);
    
    // 7. Transferir ownership a multisig (si existe)
    if (config.multisigAddress && config.multisigAddress !== deployer.address) {
        console.log("🔐 Transfiriendo ownership a multisig...");
        await phase0Token.transferOwnership(config.multisigAddress);
        await phase1Token.transferOwnership(config.multisigAddress);
        console.log(`   ✅ Ownership transferido a: ${config.multisigAddress}\n`);
    }
    
    // 8. Despausar contratos
    console.log("⏯️ Despausando contratos para operación normal...");
    await phase0Token.connect(deployer).emergencyPause(false);
    await phase1Token.connect(deployer).emergencyPause(false);
    console.log("   ✅ Contratos despausados y operativos\n");
    
    // 9. Guardar información de despliegue
    const deploymentInfo = {
        projectName: config.projectName,
        chainId: (await hre.ethers.provider.getNetwork()).chainId,
        deploymentTimestamp: new Date().toISOString(),
        contracts: {
            phase0Token: {
                address: await phase0Token.getAddress(),
                abi: (await hre.artifacts.readArtifact("Phase0Token")).abi
            },
            phase1Token: {
                address: phase1Address,
                abi: (await hre.artifacts.readArtifact("Phase1Token")).abi
            }
        },
        config: {
            totalSupply: config.totalSupply,
            allocations: config.allocations,
            teamCount: config.teamAllocations.length,
            roundCount: config.fibonacciRounds.length,
            totalUV: totalUV
        }
    };
    
    const deploymentPath = path.join(__dirname, "../deployment-info.json");
    fs.writeFileSync(deploymentPath, JSON.stringify(deploymentInfo, null, 2));
    console.log(`💾 Información de despliegue guardada en: ${deploymentPath}\n`);
    
    console.log("🎉 Despliegue completado exitosamente!");
    console.log("\n📝 Pasos siguientes:");
    console.log("1. Verificar contratos en block explorer");
    console.log("2. Configurar UI de Value Accounting App con las direcciones desplegadas");
    console.log("3. Para distribuir comunidad: ejecutar script de distribución por lotes");
    console.log("4. Para iniciar ronda 1: asegurar que startTime ha sido alcanzado");
}

function validateConfig(config) {
    // Validar porcentajes sumen 100
    const totalAlloc = config.allocations.investors + 
                      config.allocations.team + 
                      config.allocations.communityReserve + 
                      config.allocations.treasury;
    
    if (Math.abs(totalAlloc - 100) > 0.01) {
        throw new Error(`Los porcentajes de asignación deben sumar 100% (actual: ${totalAlloc}%)`);
    }
    
    // Validar teamAllocations no exceda team allocation
    const totalTeamAllocation = config.teamAllocations.reduce((sum, m) => sum + m.allocation, 0);
    const maxTeamAllocation = (config.totalSupply * config.allocations.team) / 100;
    
    if (totalTeamAllocation > maxTeamAllocation) {
        throw new Error(
            `Asignación de equipo (${totalTeamAllocation}) excede el límite de ${maxTeamAllocation} tokens`
        );
    }
    
    // Validar direcciones
    config.teamAllocations.forEach(member => {
        if (!hre.ethers.isAddress(member.address)) {
            throw new Error(`Dirección inválida para miembro del equipo: ${member.address}`);
        }
    });
    
    console.log("✅ Configuración validada correctamente\n");
}

main()
    .then(() => process.exit(0))
    .catch((error) => {
        console.error(error);
        process.exit(1);
    });

// Ejemplo de endpoints para integración con frontend
const express = require('express');
const app = express();

// 1. Endpoint para generar configuración desde Value Accounting App
app.post('/api/tokenomics/generate-config', async (req, res) => {
    const { projectName, stakeholders, rounds } = req.body;
    
    // Calcular porcentajes y validaciones
    const config = generateTokenomicsConfig(projectName, stakeholders, rounds);
    
    // Guardar configuración para despliegue
    await saveDeploymentConfig(config);
    
    res.json({ 
        success: true, 
        config,
        nextStep: '/api/tokenomics/deploy' 
    });
});

// 2. Endpoint para desplegar contratos (protegido)
app.post('/api/tokenomics/deploy', async (req, res) => {
    const config = await getDeploymentConfig();
    
    // Ejecutar script de despliegue con Hardhat
    const deploymentResult = await deployContracts(config);
    
    // Notificar a multisig para aprobación final
    await notifyMultisig(deploymentResult);
    
    res.json({ 
        success: true,
        contracts: deploymentResult.contracts,
        multisigApprovalRequired: true
    });
});

// 3. Endpoint para distribuir comunidad (protegido por multisig)
app.post('/api/tokenomics/distribute-community', async (req, res) => {
    const { batchSize = 50, startIndex = 0 } = req.body;
    
    // Obtener snapshot de UV desde Phase0Token
    const snapshot = await getUVSnapshot();
    
    // Procesar lote
    const batch = snapshot.slice(startIndex, startIndex + batchSize);
    const beneficiaries = batch.map(item => item.address);
    const uvAmounts = batch.map(item => item.uv);
    
    // Ejecutar distribución en Phase1Token
    const tx = await phase1Token.distributeCommunityTokens(
        beneficiaries, 
        uvAmounts
    );
    
    await tx.wait();
    
    res.json({ 
        success: true,
        processed: batch.length,
        nextIndex: startIndex + batchSize,
        completed: (startIndex + batchSize) >= snapshot.length
    });
});

// 4. Endpoint para obtener estado de vesting de usuario
app.get('/api/vesting/status/:address', async (req, res) => {
    const { address } = req.params;
    const [total, claimed, releasable, locked, start, cliffEnd, vestingEnd] = 
        await phase1Token.getVestingInfo(address);
    
    res.json({
        address,
        totalAllocation: formatEther(total),
        claimed: formatEther(claimed),
        releasable: formatEther(releasable),
        locked: formatEther(locked),
        vestingStart: new Date(start * 1000).toISOString(),
        cliffEnd: new Date(cliffEnd * 1000).toISOString(),
        vestingEnd: new Date(vestingEnd * 1000).toISOString()
    });
});


              </script>
