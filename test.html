// NUEVA FUNCIÓN: Construir índice unificado de TODO el ecosistema
function buildEcosystemIndex() {
  const index = {
    timestamp: new Date().toISOString(),
    sources: {},
    entities: {
      users: new Map(),      // Mapa: userId → { name, roles, totalValue, apps }
      roles: new Map(),      // Mapa: roleId → { name, deliverables, value, apps }
      deliverables: [],      // Array de todos los entregables
      projects: new Map(),   // Mapa: projectId → { name, apps, lastUpdate }
      tokens: new Map()      // Mapa: tokenId → { symbol, supply, distribution }
    },
    knowledge: {
      patterns: patronesBase, // Patrones de valor existentes
      faq: getFAQContent(),   // FAQ actual
      institutional: institutionalKnowledge
    },
    stats: {
      totalUsers: 0,
      totalRoles: 0,
      totalDeliverables: 0,
      totalProjects: 0,
      lastUpdated: new Date().toISOString()
    }
  };

  // 1. Indexar datos de VNA (app.html)
  try {
    const vnaData = JSON.parse(localStorage.getItem('vnaData') || '{"nodes":[],"edges":[]}');
    index.sources.vna = { lastUpdate: new Date().toISOString(), itemCount: vnaData.nodes.length };
    
    vnaData.nodes.forEach(node => {
      if (node.label) {
        const roleId = node.id || node.label;
        if (!index.entities.roles.has(roleId)) {
          index.entities.roles.set(roleId, {
            id: roleId,
            name: node.label,
            type: 'vna-node',
            deliverables: [],
            value: 0,
            apps: ['vna'],
            sourceData: node
          });
        }
      }
    });
  } catch(e) { console.error('Error indexando VNA:', e); }

  // 2. Indexar datos de Mapas (mapas.html)
  try {
    const mapasData = JSON.parse(localStorage.getItem('valueMapData') || '{"roles":[],"deliverables":[]}');
    index.sources.mapas = { lastUpdate: new Date().toISOString(), itemCount: mapasData.deliverables.length };
    
    mapasData.roles.forEach(role => {
      const roleId = role.id || role.name;
      if (!index.entities.roles.has(roleId)) {
        index.entities.roles.set(roleId, {
          id: roleId,
          name: role.name,
          type: 'mapa-role',
          deliverables: [],
          value: 0,
          apps: ['mapas'],
          sourceData: role
        });
      } else {
        const existing = index.entities.roles.get(roleId);
        existing.apps.push('mapas');
      }
    });
    
    mapasData.deliverables.forEach(del => {
      index.entities.deliverables.push({
        id: del.id,
        name: del.name,
        role: del.roleId,
        value: del.value,
        type: del.type,
        app: 'mapas',
        timestamp: del.timestamp
      });
      
      // Vincular entregable al rol
      if (index.entities.roles.has(del.roleId)) {
        const role = index.entities.roles.get(del.roleId);
        role.deliverables.push(del.id);
        role.value += del.value;
      }
    });
  } catch(e) { console.error('Error indexando Mapas:', e); }

  // 3. Indexar datos de Accounting (lacolla-accounting.html)
  try {
    const accountingData = JSON.parse(localStorage.getItem('colla_accounting') || '{"deliverables":[]}');
    index.sources.accounting = { lastUpdate: new Date().toISOString(), itemCount: accountingData.deliverables.length };
    
    accountingData.deliverables.forEach(del => {
      // Agregar entregable si no existe
      const existingDel = index.entities.deliverables.find(d => d.id === del.id);
      if (!existingDel) {
        index.entities.deliverables.push({
          id: del.id,
          name: del.deliverable,
          role: del.role,
          value: del.value,
          type: del.transactionType,
          app: 'accounting',
          timestamp: del.timestamp,
          user: del.userName
        });
      }
      
      // Indexar usuario
      if (del.userName && !index.entities.users.has(del.userName)) {
        index.entities.users.set(del.userName, {
          name: del.userName,
          roles: [del.role],
          totalValue: del.value,
          apps: ['accounting'],
          deliverables: [del.id]
        });
      } else if (del.userName) {
        const user = index.entities.users.get(del.userName);
        if (!user.roles.includes(del.role)) user.roles.push(del.role);
        user.totalValue += del.value;
        if (!user.deliverables.includes(del.id)) user.deliverables.push(del.id);
        if (!user.apps.includes('accounting')) user.apps.push('accounting');
      }
      
      // Vincular al rol
      if (del.role) {
        const roleId = `role-${del.role.replace(/\s+/g, '-')}`;
        if (!index.entities.roles.has(roleId)) {
          index.entities.roles.set(roleId, {
            id: roleId,
            name: del.role,
            type: 'accounting-role',
            deliverables: [del.id],
            value: del.value,
            apps: ['accounting']
          });
        } else {
          const role = index.entities.roles.get(roleId);
          if (!role.deliverables.includes(del.id)) role.deliverables.push(del.id);
          role.value += del.value;
          if (!role.apps.includes('accounting')) role.apps.push('accounting');
        }
      }
    });
  } catch(e) { console.error('Error indexando Accounting:', e); }

  // 4. Indexar Tokenomics, Finances, etc. (similar a los anteriores)
  // ... [código para tokenomics, finances, etc.]

  // Actualizar estadísticas
  index.stats.totalUsers = index.entities.users.size;
  index.stats.totalRoles = index.entities.roles.size;
  index.stats.totalDeliverables = index.entities.deliverables.length;
  index.stats.totalProjects = index.entities.projects.size;
  
  // Guardar índice en localStorage para acceso rápido
  localStorage.setItem('colla_ecosystem_index', JSON.stringify(index));
  return index;
}

// Variables globales para el índice
let ecosystemIndex = null;
const INDEX_CACHE_DURATION = 5 * 60 * 1000; // 5 minutos

// Inicializar índice al cargar
function initEcosystemSearch() {
  // Cargar índice desde caché si existe y es reciente
  const cachedIndex = localStorage.getItem('colla_ecosystem_index');
  const lastUpdate = localStorage.getItem('colla_ecosystem_index_timestamp');
  
  if (cachedIndex && lastUpdate && (Date.now() - new Date(lastUpdate).getTime() < INDEX_CACHE_DURATION)) {
    ecosystemIndex = JSON.parse(cachedIndex);
    updateIndexSummary();
  } else {
    rebuildIndex();
  }
  
  // Event listeners
  document.getElementById('search-btn').addEventListener('click', performSearch);
  document.getElementById('ecosystem-search').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') performSearch();
  });
  document.getElementById('refresh-index').addEventListener('click', rebuildIndex);
  document.getElementById('search-filter').addEventListener('change', performSearch);
  
  // Actualizar resumen inicial
  updateIndexSummary();
}

// Reconstruir índice completo
function rebuildIndex() {
  showNotification('🔄 Actualizando índice del ecosistema...', 'info', 2000);
  
  try {
    ecosystemIndex = buildEcosystemIndex();
    localStorage.setItem('colla_ecosystem_index_timestamp', new Date().toISOString());
    updateIndexSummary();
    showNotification('✅ Índice actualizado correctamente', 'success');
    
    // Si hay búsqueda activa, reejecutar
    if (document.getElementById('ecosystem-search').value.trim()) {
      performSearch();
    }
  } catch (error) {
    console.error('Error reconstruyendo índice:', error);
    showNotification(`❌ Error al actualizar el índice: ${error.message}`, 'error');
  }
}

// Actualizar resumen del índice en UI
function updateIndexSummary() {
  if (!ecosystemIndex) return;
  
  document.getElementById('index-last-update').textContent = 
    new Date(ecosystemIndex.timestamp).toLocaleString();
  
  const sources = Object.keys(ecosystemIndex.sources).join(', ');
  document.getElementById('index-sources').textContent = sources || 'Ninguna';
  
  // Actualizar stats de búsqueda
  document.getElementById('stat-search-users').textContent = ecosystemIndex.stats.totalUsers;
  document.getElementById('stat-search-roles').textContent = ecosystemIndex.stats.totalRoles;
  document.getElementById('stat-search-deliverables').textContent = ecosystemIndex.stats.totalDeliverables;
  document.getElementById('stat-search-projects').textContent = ecosystemIndex.stats.totalProjects;
  
  // Actualizar timestamp en botón
  document.getElementById('index-timestamp').textContent = 
    `(${new Date(ecosystemIndex.timestamp).toLocaleTimeString()})`;
}

// Ejecutar búsqueda
function performSearch() {
  const query = document.getElementById('ecosystem-search').value.trim().toLowerCase();
  const filter = document.getElementById('search-filter').value;
  const resultsContainer = document.getElementById('search-results');
  
  if (!query) {
    resultsContainer.style.display = 'none';
    return;
  }
  
  if (!ecosystemIndex) {
    showNotification('⚠️ El índice no está cargado. Actualiza primero.', 'warning');
    return;
  }
  
  // Buscar según filtro
  let results = { users: [], roles: [], deliverables: [], projects: [], knowledge: [] };
  
  if (filter === 'all' || filter === 'users') {
    results.users = Array.from(ecosystemIndex.entities.users.values())
      .filter(u => u.name.toLowerCase().includes(query) || u.roles.some(r => r.toLowerCase().includes(query)));
  }
  
  if (filter === 'all' || filter === 'roles') {
    results.roles = Array.from(ecosystemIndex.entities.roles.values())
      .filter(r => r.name.toLowerCase().includes(query) || r.type.includes(query));
  }
  
  if (filter === 'all' || filter === 'deliverables') {
    results.deliverables = ecosystemIndex.entities.deliverables
      .filter(d => d.name.toLowerCase().includes(query) || 
                  (d.role && d.role.toString().toLowerCase().includes(query)) ||
                  (d.user && d.user.toLowerCase().includes(query)));
  }
  
  if (filter === 'all' || filter === 'projects') {
    results.projects = Array.from(ecosystemIndex.entities.projects.values())
      .filter(p => p.name.toLowerCase().includes(query));
  }
  
  if (filter === 'all' || filter === 'knowledge') {
    // Buscar en patrones
    results.knowledge = Object.entries(ecosystemIndex.knowledge.patterns)
      .flatMap(([role, tipos]) => 
        Object.entries(tipos).map(([tipo, data]) => ({
          type: 'pattern',
          role,
          deliverableType: tipo,
          value: data.promedio,
          frequency: data.frecuencia,
          match: `${role} ${tipo}`.toLowerCase().includes(query)
        }))
      )
      .filter(item => item.match);
    
    // Buscar en FAQ
    const lang = document.documentElement.lang;
    const faqs = lang === 'ca' ? [
      { q: "Què és el Value Network Analysis?", a: "És una metodologia..." },
      // ... más FAQs
    ] : [
      { q: "¿Qué es el Value Network Analysis?", a: "Es una metodología..." },
      // ... más FAQs
    ];
    
    faqs.forEach(faq => {
      if (faq.q.toLowerCase().includes(query) || faq.a.toLowerCase().includes(query)) {
        results.knowledge.push({
          type: 'faq',
          question: faq.q,
          answer: faq.a.substring(0, 100) + '...'
        });
      }
    });
  }
  
  // Mostrar resultados
  displaySearchResults(results, query);
}

// Mostrar resultados en UI
function displaySearchResults(results, query) {

  container.style.display = 'block';

           data-es="Prueba con otro término o actualiza el índice" 
           data-ca="Prova amb un altre terme o actualitza l'índex">
          Prueba con otro término o actualiza el índice

      </div>
    `;
    return;
  }
  
  // Construir HTML de resultados
  let html = `<div style="padding: 10px 0;">`;

  if (results.users.length > 0) {
    html += `<h4 style="margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); color: var(--primary);">
              👥 <span class="lang" data-es="Usuarios" data-ca="Usuaris">Usuarios</span> (${results.users.length})
             </h4>`;
    results.users.forEach(user => {
      html += `
        <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--primary);">

          <span style="background: var(--light); padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; margin-left: 8px;">

          <div style="font-size: 0.9rem; color: var(--gray); margin-top: 5px;">
            <i class="fas fa-tag"></i> ${user.roles.join(', ')} | 
            <i class="fas fa-cube"></i> ${user.deliverables.length} entregables | 
            <i class="fas fa-layer-group"></i> ${user.apps.join(', ')}
          </div>
        </div>
      `;
    });
  }
  
  // Roles
  if (results.roles.length > 0) {
    html += `<h4 style="margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); color: var(--primary);">
              👤 <span class="lang" data-es="Roles" data-ca="Rols">Roles</span> (${results.roles.length})
             </h4>`;
    results.roles.forEach(role => {
      html += `
        <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--secondary);">
          <strong>${role.name}</strong>
          <span style="background: rgba(79, 70, 229, 0.15); color: var(--secondary); padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; margin-left: 8px;">
            ${role.value} UV
          </span>
          <div style="font-size: 0.9rem; color: var(--gray); margin-top: 5px;">
            <i class="fas fa-tasks"></i> ${role.deliverables.length} entregables | 
            <i class="fas fa-layer-group"></i> ${role.apps.join(', ')} |
            <span style="background: var(--light); padding: 2px 6px; border-radius: 4px; margin-left: 6px;">${role.type}</span>
          </div>
        </div>
      `;
    });
  }
  
  // Entregables
  if (results.deliverables.length > 0) {
    html += `<h4 style="margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); color: var(--primary);">
              📋 <span class="lang" data-es="Entregables" data-ca="Entregables">Entregables</span> (${results.deliverables.length})
             </h4>`;
    results.deliverables.slice(0, 10).forEach(del => { // Limitar a 10 resultados
      html += `
        <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid ${del.type === 'tangible' ? '#10b981' : '#f59e0b'};">
          <strong>${del.name}</strong>
          <span style="background: ${del.type === 'tangible' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(245, 158, 11, 0.15)'}; 
                    color: ${del.type === 'tangible' ? '#0da27f' : '#d97706'}; 
                    padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; margin-left: 8px;">

    if (results.deliverables.length > 10) {

  // Conocimiento
  if (results.knowledge.length > 0) {
    html += `<h4 style="margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); color: var(--primary);">
              🧠 <span class="lang" data-es="Conocimiento" data-ca="Coneixement">Conocimiento</span> (${results.knowledge.length})

      if (item.type === 'pattern') {
        html += `

      } else if (item.type === 'faq') {

            <strong>❓ ${item.question}</strong>
            <div style="font-size: 0.9rem; margin-top: 5px; color: var(--gray);">
              ${item.answer}

          </div>
        `;
      }
    });
  }
  
  html += `</div>`;
  container.innerHTML = html;
}
