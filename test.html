    <script>
        // ========== VALUE ACCOUNTING APP (VERSIÓ REVISADA) ==========
        // [MEJORA] Añadimos una estructura de datos con versión para facilitar futuras migraciones
        let accountingData = {
            version: "1.0",                // [MEJORA] Versión del formato
            projectName: "Proyecto MASIA",
            valueUnit: "puntos",
            roles: [],
            deliverables: [],
            userAddresses: {}
        };

        // ... (resto de variables globales y funciones auxiliares sin cambios) ...

        // [MEJORA] Función mejorada de validación de dirección Ethereum (con soporte para checksum básico)
        function isValidEthereumAddress(address) {
            if (!/^0x[a-fA-F0-9]{40}$/.test(address)) return false;
            // Opcional: validar checksum EIP-55 (si se desea)
            // Por ahora solo validamos formato
            return true;
        }

        // [MEJORA] Función de importación JSON más tolerante (acepta backup y snapshot)
        function importJSON() {
            const fileInput = document.getElementById('import-json-file');
            const file = fileInput.files[0];
            if (!file) {
                showNotification('⚠️ Selecciona un archivo JSON primero', 'warning');
                return;
            }

            const importBtn = document.getElementById('import-json');
            const originalHTML = importBtn.innerHTML;
            importBtn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px;"></span> Importando...';
            importBtn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    // [MEJORA] Detección inteligente del formato
                    if (imported.snapshot && Array.isArray(imported.snapshot)) {
                        // Formato snapshot (tokenomics)
                        // Convertir snapshot a deliverables simulados para mantener compatibilidad
                        const snapshot = imported.snapshot;
                        const newDeliverables = [];
                        const newAddresses = { ...accountingData.userAddresses };
                        
                        snapshot.forEach(item => {
                            if (item.user && item.uvAmount) {
                                // Creamos un entregable ficticio por cada entrada (para poder visualizarlo)
                                newDeliverables.push({
                                    id: `imported-${Date.now()}-${Math.random()}`,
                                    userName: item.user,
                                    role: "importado",
                                    deliverable: "Snapshot importado",
                                    transactionType: "tangible",
                                    description: "Importado desde snapshot",
                                    link: "",
                                    value: item.uvAmount,
                                    timestamp: new Date().toISOString()
                                });
                                if (item.address) {
                                    newAddresses[item.user] = item.address;
                                }
                            }
                        });
                        
                        accountingData.deliverables.push(...newDeliverables);
                        accountingData.userAddresses = { ...accountingData.userAddresses, ...newAddresses };
                        
                        // Añadir rol "importado" si no existe
                        if (!accountingData.roles.includes("importado")) {
                            accountingData.roles.push("importado");
                        }
                        
                        showNotification(`✅ Snapshot importado: ${snapshot.length} usuarios`, 'success');
                    } 
                    else if (imported.deliverables && Array.isArray(imported.deliverables)) {
                        // Formato backup completo
                        accountingData = {
                            version: imported.version || "1.0",
                            projectName: imported.projectName || accountingData.projectName,
                            valueUnit: imported.valueUnit || accountingData.valueUnit,
                            roles: imported.roles || [],
                            deliverables: imported.deliverables || [],
                            userAddresses: imported.userAddresses || {}
                        };
                        showNotification(`✅ Backup importado: ${imported.deliverables.length} entregables`, 'success');
                    }
                    else {
                        throw new Error('Formato no reconocido (debe tener snapshot o deliverables)');
                    }

                    // Actualizar campos de formulario
                    document.getElementById('project-name').value = accountingData.projectName;
                    document.getElementById('value-unit').value = accountingData.valueUnit;
                    
                    saveData();
                    updateVisualizations();
                } catch (error) {
                    showNotification(`❌ Error al importar: ${error.message}`, 'error');
                } finally {
                    importBtn.innerHTML = originalHTML;
                    importBtn.disabled = false;
                }
            };
            reader.readAsText(file);
        }

        // [MEJORA] Función exportTokenomicsJSON mejorada: incluye versión y metadatos
        function exportTokenomicsJSON() {
            if (accountingData.deliverables.length === 0) {
                showNotification('⚠️ No hay datos para exportar. Registra entregables primero.', 'warning');
                return;
            }

            try {
                // Agregar por usuario
                const userTotals = {};
                accountingData.deliverables.forEach(d => {
                    userTotals[d.userName] = (userTotals[d.userName] || 0) + d.value;
                });

                const snapshot = Object.entries(userTotals).map(([user, uvAmount]) => ({
                    user: user,
                    address: accountingData.userAddresses[user] || '',
                    uvAmount: uvAmount
                }));

                const output = {
                    version: "1.0",
                    projectName: accountingData.projectName,
                    valueUnit: accountingData.valueUnit,
                    snapshot: snapshot,
                    exportDate: new Date().toISOString(),
                    description: "Snapshot generado por Value Accounting App para TeamTowers Humà"
                };

                const dataStr = JSON.stringify(output, null, 2);
                const blob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const exportFileDefaultName = `tokenomics-snapshot-${accountingData.projectName.replace(/\s+/g, '-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', url);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.style.display = 'none';
                document.body.appendChild(linkElement);
                linkElement.click();
                setTimeout(() => {
                    document.body.removeChild(linkElement);
                    URL.revokeObjectURL(url);
                }, 100);

                showNotification(`✅ Snapshot exportado: ${snapshot.length} usuarios. Listo para importar en Tokenomics App.`, 'success');
            } catch (error) {
                showNotification(`❌ Error al exportar: ${error.message}`, 'error');
            }
        }

        // [MEJORA] Actualización de visualizaciones para incluir el nuevo rol "importado"
        function updateVisualizations() {
            document.getElementById('total-users').textContent = [...new Set(accountingData.deliverables.map(d => d.userName))].length;
            document.getElementById('total-roles').textContent = accountingData.roles.length;
            document.getElementById('total-deliverables').textContent = accountingData.deliverables.length;
            document.getElementById('total-value').textContent = accountingData.deliverables.reduce((sum, d) => sum + d.value, 0);
            updateChart();
            updateRankingTable();
            updateDeliverablesList();
        }

        // [MEJORA] También podemos añadir un pequeño aviso si la dirección no es válida al añadir entregable
        function addDeliverable() {
            // ... (validaciones existentes) ...
            const address = document.getElementById('user-address').value.trim();
            if (address && !isValidEthereumAddress(address)) {
                showNotification('⚠️ La dirección Ethereum no es válida. Debe empezar por 0x y tener 40 caracteres hexadecimales.', 'warning');
                document.getElementById('user-address').focus();
                return;
            }
            // ... (resto igual) ...
        }

        // [MEJORA] Aseguramos que los botones tengan tooltips
        function setupTooltips() {
            document.querySelectorAll('[data-tooltip]').forEach(btn => {
                // Los tooltips ya se manejan con CSS :hover::after
            });
        }

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            setupLanguageSelector();
            loadData();
            initChart();
            setupEventListeners();
            setupAutocompletes();
            updateVisualizations();
            setupTooltips();  // [MEJORA]
            document.getElementById('run-tests').addEventListener('click', runTests);
            setTimeout(() => {
                showNotification('✨ ¡Bienvenido! Usa el botón "Exportar JSON (Smart Contract)" para generar el snapshot para Tokenomics.', 'success', 6000);
            }, 1000);
        });
    </script>
