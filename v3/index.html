<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>TeamTowers Humà v3.3</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .test-link {
            background: #10b981;
            color: white !important;
            border-radius: 30px;
            padding: 8px 16px !important;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .metric-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 12px;
            color: #64748b;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        .data-table th {
            background: #f1f5f9;
            padding: 12px 15px;
            text-align: left;
        }
        .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table tr:hover td {
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="logo">🏗️ TeamTowers v3.3</div>
            <nav class="main-nav">
                <a href="#" data-page="dashboard" class="active">📊 Dashboard</a>
                <a href="#" data-page="projects">📋 Proyectos</a>
                <a href="#" data-page="users">👥 Usuarios</a>
                <a href="#" data-page="castell">🏰 Castell</a>
                <a href="#" data-page="value-map">🗺️ Value Map</a>
                <a href="#" data-page="value-accounting">💰 Value Accounting</a>
                <a href="#" class="test-link" onclick="window.open('tests/run-tests.html', '_blank')">🧪 Tests</a>
            </nav>
        </header>

        <div class="breadcrumb" id="breadcrumb">
            <a href="#" data-page="dashboard">Inicio</a>
        </div>

        <main id="main-content">
            <div class="loading">Cargando TeamTowers v3.3...</div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="js/core/event-bus.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/core/selectors.js"></script>
    <script src="js/core/router.js"></script>

    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/projects.js"></script>
    <script src="js/pages/project.js"></script>
    <script src="js/pages/users.js"></script>
    <script src="js/pages/user.js"></script>
    <script src="js/pages/castell-view.js"></script>
    <script src="js/pages/value-mapping.js"></script>
    <script src="js/pages/value-accounting.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Iniciando TeamTowers v3.3');
            window.router = new Router();
            setTimeout(() => window.router.navigate('dashboard'), 100);
        });
    </script>
</body>
</html>
