<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers v3.5 | Test Driven Architecture</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; display: flex; justify-content: center;
            align-items: center; z-index: 9999; color: white;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">🚀 Iniciando Motor VNA...</div>

    <header class="main-header">
        <div class="logo" onclick="window.router.navigate('dashboard')">🏰 TeamTowers v3.5</div>
        <nav>
            <button onclick="window.router.navigate('dashboard')">📊 Dashboard</button>
            <button onclick="window.router.navigate('projects')">🏗️ Proyectos</button>
        </nav>
    </header>

    <main id="app-viewport"></main>

    <script type="module">
        import { APP_CONSTANTS } from './js/core/constants.js';
        import { EventBus } from './js/core/event-bus.js';
        import { store } from './js/core/store.js';
        import { Selectors } from './js/core/selectors.js';

        // Hacemos el bridge a window para que los componentes NO-módulos funcionen
        window.APP_CONSTANTS = APP_CONSTANTS;
        window.EventBus = EventBus;
        window.store = store;
        window.Selectors = Selectors;

        console.log("✅ Core inyectado en window desde módulos");
    </script>

    <script src="js/core/router.js"></script>
    <script src="js/components/tt-dynamic-form.js"></script>
    <script src="js/components/tt-role-selector.js"></script>

    <script>
        async function loadPageScripts() {
            const pages = [
                'js/pages/dashboard.js',
                'js/pages/projects.js',
                'js/pages/project.js'
            ];
            
            for (const src of pages) {
                await new Promise((resolve) => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.onload = resolve;
                    document.head.appendChild(s);
                });
            }
        }

        window.addEventListener('load', async () => {
            await loadPageScripts();
            document.getElementById('loading-overlay').style.display = 'none';
            if (window.router) window.router.init();
            console.log("🚀 App Ready");
        });
    </script>
</body>
</html>
