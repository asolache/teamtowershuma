<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers v3.5 - TDD Suite</title>
    <style>
        :root { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #1e1e1e; color: #fff; padding: 2rem; max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 1rem; }
        .test-case { background: #2d2d2d; margin-bottom: 1rem; padding: 1rem; border-radius: 8px; border-left: 5px solid gray; }
        .pass { border-left-color: #4CAF50; }
        .fail { border-left-color: #F44336; }
        .status { font-weight: bold; margin-bottom: 0.5rem; }
        .pass .status { color: #4CAF50; }
        .fail .status { color: #F44336; }
        .details { font-family: monospace; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>
    <h1>🧪 TeamTowers v3.5 - Core Engine Tests</h1>
    <div id="test-results"></div>

    <script type="module">
        import { EventBus } from '../js/core/event-bus.js';
        import { store } from '../js/core/store.js';
        import { Selectors } from '../js/core/selectors.js';

        const resultsDiv = document.getElementById('test-results');

        // Micro-framework de testing
        function runTest(name, testFn) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test-case';
            try {
                testFn();
                testDiv.classList.add('pass');
                testDiv.innerHTML = `<div class="status">✅ PASS: ${name}</div>`;
            } catch (error) {
                testDiv.classList.add('fail');
                testDiv.innerHTML = `
                    <div class="status">❌ FAIL: ${name}</div>
                    <div class="details">${error.message}</div>
                `;
                console.error(`Test falló: ${name}`, error);
            }
            resultsDiv.appendChild(testDiv);
        }

        // --- SUITE DE TESTS --- //

        // Limpiar el store antes de los tests
        localStorage.removeItem('teamtowers-v3-state');
        store.init(); // Asegura un estado limpio

        runTest("1. El Store se inicializa correctamente", () => {
            const state = store.getState();
            if (!state.proyectos) throw new Error("El estado no tiene la propiedad 'proyectos'");
        });

        runTest("2. Creación de Proyecto (Tronco Común)", () => {
            // Simulamos la creación de un proyecto
            store.addProject({
                id: "#test-startup",
                nombre: "Startup Test",
                sector: "1", // Tecnología, Software e IA
                roles: [
                    { id: "@ceo", multiplicador: 2.0 },
                    { id: "@developer", multiplicador: 1.0 }
                ]
            });

            const state = store.getState();
            const project = state.proyectos.find(p => p.id === "#test-startup");
            if (!project) throw new Error("El proyecto no se guardó en el store");
            if (project.roles.length !== 2) throw new Error("Los roles del tronco común no se guardaron");
        });

        // NOTA: Añadiremos más tests aquí a medida que programemos el ValueEngine.
    </script>
</body>
</html>
