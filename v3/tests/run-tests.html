<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TeamTowers v3.5 - Core Engine Tests</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .test-container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
        h1 { color: #3b82f6; border-bottom: 2px solid #333; }
        .test-item { margin-bottom: 10px; padding: 15px; border-radius: 8px; background: #252525; border-left: 5px solid #444; }
        .test-item.pass { border-left-color: #10b981; background: #1a2e26; }
        .test-item.fail { border-left-color: #ef4444; background: #2e1a1a; }
        .error-msg { color: #ff8a8a; font-size: 0.9em; margin-top: 5px; font-family: monospace; }
        .console-box { background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="test-container">
        <h1>🏗️ TeamTowers v3.5 - Test Suite</h1>
        <div id="test-results">Esperando al motor core...</div>
        <div id="console-output" class="console-box"></div>
    </div>

    <script type="module">
        import { store } from '../js/core/store.js';
        import { Selectors } from '../js/core/selectors.js';
        
        // Los inyectamos en window para que los tests los vean
        window.store = store;
        window.Selectors = Selectors;
        
        console.log("🚀 Módulos cargados correctamente en window.");
        // Avisamos que estamos listos
        window.dispatchEvent(new Event('core-ready'));
    </script>

    <script>
        const resultsContainer = document.getElementById('test-results');
        const consoleBox = document.getElementById('console-output');

        function log(msg) {
            console.log(msg);
            consoleBox.innerHTML += `> ${msg}<br>`;
        }

        function runTest(name, testFn) {
            const item = document.createElement('div');
            item.className = 'test-item';
            try {
                testFn();
                item.classList.add('pass');
                item.innerHTML = `✅ <b>PASS:</b> ${name}`;
            } catch (error) {
                item.classList.add('fail');
                item.innerHTML = `❌ <b>FAIL:</b> ${name} <div class="error-msg">${error.message}</div>`;
            }
            resultsContainer.appendChild(item);
        }

        // EL SECRETO: Esperar al evento 'core-ready'
        window.addEventListener('core-ready', () => {
            resultsContainer.innerHTML = ''; // Limpiar el "Esperando..."
            log("Iniciando suite de tests...");

            // 1. Test Store
            runTest("1. El Store se inicializa correctamente", () => {
                const state = window.store.getState();
                if (!state.projects) throw new Error("No existe la propiedad 'projects'");
            });

            // 2. Test Registro
            runTest("2. Registro de Proyecto en el Store", () => {
                const id = 'test-' + Math.random();
                window.store.dispatch({ type: 'ADD_PROJECT', payload: { id, nombre: 'TDD Test' } });
                const found = window.store.getState().projects.find(p => p.id === id);
                if (!found) throw new Error("Proyecto no encontrado tras dispatch");
            });

            // 3. Test Resiliencia (Saludable)
            runTest("3. Cálculo VNA: Ratio de Resiliencia (Saludable)", () => {
                const mock = {
                    projects: [{
                        id: 'vna-1',
                        transactions: [
                            { uv: 500, tipo_valor: 'tangible' },
                            { uv: 500, tipo_valor: 'intangible' }
                        ]
                    }]
                };
                const res = window.Selectors.getProjectResilienceIndex(mock, 'vna-1');
                if (res.status !== 'saludable') throw new Error(`Status incorrecto: ${res.status}`);
            });

            // 4. Test Resiliencia (Frágil)
            runTest("4. Cálculo VNA: Ratio de Resiliencia (Frágil)", () => {
                const mock = {
                    projects: [{
                        id: 'vna-2',
                        transactions: [{ uv: 1000, tipo_valor: 'tangible' }]
                    }]
                };
                const res = window.Selectors.getProjectResilienceIndex(mock, 'vna-2');
                if (res.status !== 'fragil') throw new Error(`Status incorrecto: ${res.status}`);
            });

            log("Suite finalizada.");
        });

        // Timeout de seguridad por si falla la carga de módulos
        setTimeout(() => {
            if (!window.store) {
                resultsContainer.innerHTML = '<b style="color:red">❌ ERROR: El motor core no cargó en 3 segundos. Revisa la consola (F12).</b>';
            }
        }, 3000);
    </script>
</body>
</html>
