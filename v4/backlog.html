<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS | Backlog & Slicing Pie</title>
    <style>
        :root {
            --bg-base: #010409;
            --bg-surface: #0d1117;
            --bg-panel: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-purple: #a371f7;
            --accent-gold: #d29922;
            --font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0; padding: 40px 20px;
            line-height: 1.6;
        }

        .container { max-width: 950px; margin: 0 auto; }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        h1, h2, h3 { color: #f0f6fc; margin: 0; }
        
        .version-block {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .version-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px; margin-bottom: 20px;
        }

        .tx-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 4px solid var(--border-color);
            padding: 15px; border-radius: 8px; margin-bottom: 15px;
            display: grid; grid-template-columns: 180px 1fr auto; gap: 20px; align-items: center;
        }

        .tx-intangible { border-left-color: var(--accent-purple); }
        .tx-tangible { border-left-color: var(--accent-blue); }

        .role-badge {
            display: inline-block; font-size: 0.75rem; font-weight: bold;
            padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05);
            font-family: monospace;
        }

        .financial-pill {
            background: rgba(210, 153, 34, 0.05);
            border: 1px solid rgba(210, 153, 34, 0.2);
            color: var(--accent-gold);
            padding: 8px 12px;
            border-radius: 6px;
            text-align: right;
            font-size: 0.85rem;
            min-width: 150px;
        }

        .btn {
            background: var(--accent-green); color: white; border: none;
            padding: 10px 16px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-family: inherit;
        }
        .btn:hover { background: #2ea043; }
        .btn-outline { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); }

        pre {
            background: #000; padding: 15px; border-radius: 8px;
            overflow-x: auto; font-size: 0.85rem; color: #a5d6ff;
            display: none; border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .fase-indicator {
            font-family: monospace;
            font-size: 0.7rem;
            color: var(--accent-green);
            background: rgba(35, 134, 54, 0.1);
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1 style="color: var(--accent-blue);">📜 SOS Ledger (Dogfooding)</h1>
                <p class="text-muted" style="margin: 5px 0 0 0;">Reporte real de inyección de valor: Humano vs IA</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" onclick="window.location.href='index.html'">← App</button>
                <button class="btn" onclick="toggleJson()">⚙️ Data JSON</button>
            </div>
        </header>

        <pre id="json-viewer"></pre>

        <div id="timeline"></div>
    </div>

    <script id="vna-data" type="application/json">
    {
        "projectId": "sos-kernel-build",
        "nombre": "Construcción Core v4.x",
        "sector": "saas",
        "roles": [
            { "id": "user_arch", "name": "Humano", "levelId": "@anxaneta", "desc": "Lead Arch.", "fmv": 45.0, "multiplier": 3.0 },
            { "id": "user_qa", "name": "Humano", "levelId": "@dosos", "desc": "Auditor QA", "fmv": 30.0, "multiplier": 2.0 },
            { "id": "ai_dev", "name": "Gemini IA", "levelId": "@baixos", "desc": "AI Developer", "fmv": 0.08, "multiplier": 1.5 }
        ],
        "versiones": [
            {
                "version": "v4.6",
                "titulo": "Gravedad de Valor & Ontología de Prompts",
                "transacciones": [
                    { "fase": 1, "from": "user_arch", "to": "ai_dev", "tipo": "intangible", "entregable": "Req: Ontología extendida (50 prompts)", "horas": 2.0 },
                    { "fase": 2, "from": "user_arch", "to": "ai_dev", "tipo": "intangible", "entregable": "Req: Algoritmo de Gravedad (Auto-sort)", "horas": 1.5 },
                    { "fase": 3, "from": "ai_dev", "to": "user_arch", "tipo": "tangible", "entregable": "Core: Store.js (Matriz de Órbitas)", "horas": 0.15 },
                    { "fase": 3, "from": "ai_dev", "to": "user_arch", "tipo": "tangible", "entregable": "UI: Sugeridor ✨ en ProjectEditView", "horas": 0.2 },
                    { "fase": 4, "from": "ai_dev", "to": "user_arch", "tipo": "tangible", "entregable": "UI: Ensamblado de Prompt Maestro", "horas": 0.15 },
                    { "fase": 5, "from": "user_qa", "to": "ai_dev", "tipo": "intangible", "entregable": "Audit: Test de persistencia de Prompts", "horas": 0.5 }
                ]
            },
            {
                "version": "v4.5",
                "titulo": "Slicing Pie, Ledger & Sistema de Usuarios",
                "transacciones": [
                    { "fase": 1, "from": "user_arch", "to": "ai_dev", "tipo": "intangible", "entregable": "Req: Paradigma Usuario vs Rol (Contabilidad)", "horas": 1.5 },
                    { "fase": 3, "from": "ai_dev", "to": "user_arch", "tipo": "tangible", "entregable": "Core: Store v4.5 (Ledger + Usuarios)", "horas": 0.1 },
                    { "fase": 4, "from": "user_qa", "to": "ai_dev", "tipo": "intangible", "entregable": "Bug: Desincronización de 10 Sectores HTML", "horas": 0.5 },
                    { "fase": 3, "from": "ai_dev", "to": "user_qa", "tipo": "tangible", "entregable": "Fix: DashboardView y Store Integrados", "horas": 0.05 },
                    { "fase": 3, "from": "ai_dev", "to": "user_arch", "tipo": "tangible", "entregable": "UI: ProjectAccountingView.js (Cap Table)", "horas": 0.1 }
                ]
            }
        ]
    }
    </script>

    <script>
        const rawData = document.getElementById('vna-data').textContent;
        const data = JSON.parse(rawData);
        
        document.getElementById('json-viewer').textContent = JSON.stringify(data, null, 4);

        function toggleJson() {
            const el = document.getElementById('json-viewer');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        const timeline = document.getElementById('timeline');

        data.versiones.forEach(v => {
            let versionPieTotal = 0;

            // Ordenamos por fase lógica según la nueva metodología
            const sortedTxs = [...v.transacciones].sort((a, b) => (a.fase || 99) - (b.fase || 99));

            let txsHtml = sortedTxs.map(tx => {
                const fromRole = data.roles.find(r => r.id === tx.from);
                const toRole = data.roles.find(r => r.id === tx.to);
                const typeColor = tx.tipo === 'intangible' ? 'var(--accent-purple)' : 'var(--accent-blue)';
                
                // CÁLCULO SLICING PIE (Lógica Humano vs IA)
                const valorGenerado = tx.horas * fromRole.fmv * fromRole.multiplier;
                versionPieTotal += valorGenerado;
                
                return `
                    <div class="tx-card tx-${tx.tipo}">
                        <div>
                            <div style="margin-bottom: 5px;">
                                <span class="role-badge" style="color: ${typeColor}">${fromRole.levelId}</span> 
                                <span style="color: var(--text-muted); margin: 0 2px;">→</span> 
                                <span class="role-badge">${toRole.levelId}</span>
                            </div>
                            <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Flujo ${tx.tipo}</span>
                            ${tx.fase ? `<br><span class="fase-indicator">FASE ${tx.fase}</span>` : ''}
                        </div>
                        <div>
                            <strong style="display:block; font-size: 1rem; color: #f0f6fc;">${tx.entregable}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
                                <span style="color: var(--accent-blue)">${fromRole.name}</span> entregó a <span style="color: var(--accent-blue)">${toRole.name}</span>
                            </div>
                        </div>
                        <div class="financial-pill">
                            <strong style="display: block; font-size: 1.1rem;">+ ${valorGenerado.toFixed(3)} €</strong>
                            <span style="font-size: 0.7rem; opacity: 0.8;">${tx.horas}h × ${fromRole.fmv}€ × ${fromRole.multiplier}x</span>
                        </div>
                    </div>
                `;
            }).join('');

            timeline.innerHTML += `
                <div class="version-block">
                    <div class="version-header">
                        <h2>${v.version} - <span style="color: var(--text-muted); font-size: 1.2rem; font-weight: normal;">${v.titulo}</span></h2>
                        <div style="text-align: right;">
                            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05rem;">Fondo Slicing Pie Generado</div>
                            <div style="font-size: 1.4rem; font-weight: bold; color: var(--accent-gold);">${versionPieTotal.toFixed(2)} €</div>
                        </div>
                    </div>
                    ${txsHtml}
                </div>
            `;
        });
    </script>
</body>
</html>
