<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>SOS v4 | Agile Canvas</title><link rel="stylesheet" href="css/sos-style.css"></head>
<body>
    <div id="app"></div>
    <script type="module">
        import { store } from './js/core/store.js';
        import { ProjectView } from './js/views/ProjectView.js';

        const pId = new URLSearchParams(window.location.search).get('id') || 'p-default';

        window.ejecutarTransaccion = (projectId) => {
            const transaction = {
                rolId: document.getElementById('f-from').value,
                to: document.getElementById('f-to').value,
                concepto: document.getElementById('f-concepto').value,
                horas: parseFloat(document.getElementById('f-horas').value)
            };
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId, transaction } });
        };

        const update = () => { document.getElementById('app').innerHTML = ProjectView.render(pId); };
        window.addEventListener('store-ready', () => {
            if (!store.getState().projects.find(p => p.id === pId)) {
                store.dispatch({ type: 'ADD_PROJECT', payload: { id: pId, nombre: 'Proyecto Activo' } });
            }
            update();
        });
        store.subscribe(update);
    </script>
</body>
</html>
