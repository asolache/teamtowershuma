<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOS v5.4 | Suite de Validación Total</title>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .nav-link { color: #58a6ff; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        h1 { border-bottom: 2px solid #30363d; padding-bottom: 10px; color: #f0f6fc; }
        .test-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; }
        .pass { border-left: 5px solid #238636; }
        .fail { border-left: 5px solid #f85149; background: #2a1215; }
        .msg { flex-grow: 1; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; }
        .badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: #30363d; margin-left: 10px; color: #8b949e; text-transform: uppercase; font-weight: bold; }
        .summary { margin-top: 30px; padding: 20px; border-radius: 8px; background: #0d1117; border: 1px solid #3b82f6; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html#/" class="nav-link">← Volver al Dashboard</a>
        <h1>🧪 SOS v5.4: Test de Estrés del Kernel</h1>
        <div id="results"></div>
        <div id="summary-box"></div>
    </div>

    <script type="module">
        import { store } from '../js/core/store.js';

        function runSuite() {
            const results = document.getElementById('results');
            let passed = 0; let total = 0;

            const assert = (condition, message, tag) => {
                total++;
                const div = document.createElement('div');
                div.className = `test-card ${condition ? "pass" : "fail"}`;
                if(condition) passed++;
                div.innerHTML = `<span style="margin-right:15px">${condition ? '✅' : '❌'}</span>
                                 <span class="msg">${message}</span>
                                 <span class="badge">${tag}</span>`;
                results.appendChild(div);
            };

            // --- FASE 1 A 7 (INTACTAS) ---
            assert(typeof store.calculateResilience === 'function', "Función de Resiliencia presente", "KERNEL");
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-proj', nombre: 'Test Project', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 'test-proj');
            assert(p !== undefined && p.sector === 'marketing', "Proyecto creado con sector asignado", "CORE");
            assert(p.roles && p.roles.length === 5, "Ontología Unificada inyectada (5 roles)", "ONTOLOGY");
            const anxanetaRole = p.roles.find(r => r.levelId === '@anxaneta');
            assert(anxanetaRole !== undefined && anxanetaRole.name === 'Strategy', "Alias de marketing inyectado correctamente", "ONTOLOGY");
            
            const anxanetaId = anxanetaRole.id;
            store.dispatch({ type: 'UPDATE_ROLE', payload: { projectId: 'test-proj', roleId: anxanetaId, field: 'name', value: 'CEO Global' } });
            const pUpdated = store.getState().projects.find(x => x.id === 'test-proj');
            assert(pUpdated.roles.find(r => r.id === anxanetaId).name === 'CEO Global', "Edición de nombres de roles", "STORE");
            
            store.dispatch({ type: 'UPDATE_PROJECT_INFO', payload: { projectId: 'test-proj', description: 'Misión IA' } });
            assert(store.getState().projects.find(x => x.id === 'test-proj').description === 'Misión IA', "Metadatos persistidos", "DESIGN");

            store.dispatch({ type: 'CREATE_ROLE', payload: { projectId: 'test-proj', name: 'Analista', levelId: '@baixos' } });
            let pAfterCreate = store.getState().projects.find(x => x.id === 'test-proj');
            const newRole = pAfterCreate.roles.find(r => r.name === 'Analista');
            assert(newRole !== undefined && newRole.price === 45, "Herencia financiera en nuevos roles", "ONTOLOGY");

            store.dispatch({ type: 'ARCHIVE_ROLE', payload: { projectId: 'test-proj', roleId: newRole.id } });
            assert(store.getState().projects.find(p => p.id === 'test-proj').roles.find(r => r.id === newRole.id).isArchived === true, "Inmutabilidad vía Archivado", "STORE");

            const dososRole = pAfterCreate.roles.find(r => r.levelId === '@dosos');
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: anxanetaId, to: dososRole.id, horas: 2, entregable: 'Plan Q1', tipo: 'tangible' } } });
            const tx1 = store.getState().projects.find(x => x.id === 'test-proj').transactions[0];
            
            assert(tx1.valorCongelado === (2 * 3.0 * 90), "Cálculo financiero (540€) OK", "ECONOMY");
            assert(tx1.hash !== undefined, "Hash de seguridad generado", "SECURITY");

            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: dososRole.id, to: anxanetaId, horas: 1, entregable: 'Review', tipo: 'intangible' } } });
            const tx2 = store.getState().projects.find(x => x.id === 'test-proj').transactions[1];
            assert(tx2.prevHash === tx1.hash, "Triple Entrada: Chaining de hashes OK", "SECURITY");

            const salud = store.calculateResilience('test-proj');
            assert(salud > 0, `Salud sistémica calculada (${salud}%)`, "RESILIENCE");

            store.dispatch({ type: 'UPDATE_TRANSACTION_PHASE', payload: { projectId: 'test-proj', txHash: tx1.hash, fase: 1 } });
            const prompt = store.generateSystemPrompt('test-proj');
            assert(prompt.includes('Fase 1:'), "Prompt incluye secuenciación temporal", "INTEL");
            
            // --- FASE 8: CONFIGURACIÓN GLOBAL ---
            assert(store.getState().config !== undefined, "Objeto config global inicializado", "KERNEL");
            store.dispatch({ type: 'UPDATE_GLOBAL_CONFIG', payload: { theme: 'light', ecosystemName: 'Test Ecosistema' } });
            const currentConfig = store.getState().config;
            assert(currentConfig.theme === 'light' && currentConfig.ecosystemName === 'Test Ecosistema', "Actualización de Configuración Global OK", "SETTINGS");

            // 🚀 --- FASE 9: AUTO-LEDGER (PARSER DE CHAT) ---
            assert(typeof store.parseChatToLedger === 'function', "El parser de chat (Auto-Ledger) existe en el Kernel", "PARSER");
            
            // Simulamos un chat corto
            const mockChatText = `
                USER: Necesito que hagas el módulo de login.
                AI: Claro, aquí tienes el código.
                USER: Gracias, arregla este pequeño bug.
                AI: Arreglado.
            `;
            
            store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'TestUser' } });
            store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'TestAI' } });
            const pForChat = store.getState().projects.find(x => x.id === 'test-proj');
            
            const numLedgersBefore = pForChat.ledger ? pForChat.ledger.length : 0;
            
            // Ejecutamos el parser: Debería detectar 2 prompts de USER y 2 de AI
            store.parseChatToLedger('test-proj', mockChatText, pForChat.usuarios[0].id, pForChat.usuarios[1].id, anxanetaId, newRole.id);
            
            const numLedgersAfter = store.getState().projects.find(x => x.id === 'test-proj').ledger.length;
            
assert(numLedgersAfter === numLedgersBefore + 2, "El parser ha inyectado 2 transacciones consolidadas al Ledger", "AUTO-LEDGER");            // --- RESULTADO ---
            const summary = document.getElementById('summary-box');
            summary.className = "summary";
            const ok = passed === total;
            summary.innerHTML = `<h3 style="margin:0">Certificación: ${passed}/${total}</h3>
                                 <p style="font-weight:bold; color:${ok ? '#3fb950' : '#f85149'}; margin:5px 0 0 0;">
                                    ${ok ? "🚀 KERNEL v5.4 VALIDADO PARA PRODUCCIÓN" : "🛠️ FALLO DETECTADO"}
                                 </p>`;
        }
        
        runSuite();
    </script>
</body>
</html>
