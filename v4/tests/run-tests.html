<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOS v4 | Suite de Validación</title>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: monospace; padding: 40px; }
        .pass { color: #238636; }
        .fail { color: #f85149; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #30363d; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🧪 SOS v4 Test Runner</h1>
    <div id="results"></div>

    <script type="module">
        import { store } from '../js/core/store.js';

        async function runSuite() {
            const results = document.getElementById('results');
            const assert = (condition, message) => {
                const div = document.createElement('div');
                div.className = condition ? "pass" : "fail";
                div.innerHTML = `${condition ? '✅' : '❌'} ${message}`;
                results.appendChild(div);
            };

            // 1. Esperar inicialización
            await new Promise(resolve => window.addEventListener('store-ready', resolve));
            await new Promise(resolve => setTimeout(resolve, 100));

            // Test 1: Ontología
            assert(store.state.ontology !== null, "Kernel cargado con ontología");

            // Test 2: Creación de Proyecto
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-vna', nombre: 'Test Project', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 'test-vna');
            assert(p.sector === 'marketing', "Sector marketing registrado");

            // Test 3: Nombres de Sector
            assert(p.customRoles['@anxaneta'] === 'Strategy Director', "Nombres de marketing asignados correctamente");

            // Test 4: Persistencia Edición
            store.dispatch({ type: 'UPDATE_ROLE_NAME', payload: { projectId: 'test-vna', rolId: '@baixos', newName: 'Junior' } });
            const p2 = store.getState().projects.find(x => x.id === 'test-vna');
            assert(p2.customRoles['@baixos'] === 'Junior', "Edición de rol persistente");

            // Test 5: Economía SOS (540€)
            store.dispatch({ 
                type: 'ADD_TRANSACTION', 
                payload: { 
                    projectId: 'test-vna', 
                    transaction: { rolId: '@anxaneta', horas: 2, concepto: 'Consultoría', tipo_flujo: 'tangible' } 
                } 
            });
            const pFinal = store.getState().projects.find(x => x.id === 'test-vna');
            const tx = pFinal.transactions[pFinal.transactions.length - 1];
            assert(tx.liquidación === 540, `Cálculo 540€ OK (90*3*2). Resultado: ${tx.liquidación}€`);

            // Test 6: Metadato VNA
            assert(tx.tipo_flujo === 'tangible', "Metadato VNA (tipo_flujo) presente y correcto");

            results.innerHTML += `<hr><h2>Validación Completada</h2>`;
        }

        runSuite();
    </script>
</body>
</html>
