<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOS v4.4 | Suite de Validación Total</title>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .nav-link { color: #58a6ff; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        .nav-link:hover { text-decoration: underline; }
        h1 { border-bottom: 2px solid #30363d; padding-bottom: 10px; color: #f0f6fc; margin-top: 10px; }
        .test-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; }
        .pass { border-left: 5px solid #238636; }
        .fail { border-left: 5px solid #f85149; background: #2a1215; }
        .msg { flex-grow: 1; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; }
        .badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: #30363d; margin-left: 10px; color: #8b949e; text-transform: uppercase; font-weight: bold; }
        .summary { margin-top: 30px; padding: 20px; border-radius: 8px; background: #0d1117; border: 1px solid #3b82f6; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html#/test" class="nav-link">← Volver al Dashboard</a>
        <h1>🧪 SOS v4.4: Full Stress Test (Ontología Unificada)</h1>
        <div id="results"></div>
        <div id="summary-box"></div>
    </div>

    <script type="module">
        import { store } from '../js/core/store.js';

        function runSuite() {
            const results = document.getElementById('results');
            let passed = 0; let total = 0;

            const assert = (condition, message, tag) => {
                total++;
                const div = document.createElement('div');
                div.className = `test-card ${condition ? "pass" : "fail"}`;
                if(condition) passed++;
                div.innerHTML = `<span style="margin-right:15px">${condition ? '✅' : '❌'}</span>
                                 <span class="msg">${message}</span>
                                 <span class="badge">${tag}</span>`;
                results.appendChild(div);
            };

            // --- FASE 1: KERNEL Y CREACIÓN DE PROYECTO ---
            assert(store.getState().ontology !== null, "Kernel cargado con ontología maestra", "KERNEL");
            
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-proj', nombre: 'Test Project', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 'test-proj');
            assert(p !== undefined && p.sector === 'marketing', "Proyecto creado con sector asignado", "CORE");
            
            assert(p.roles && p.roles.length === 5, "Ontología Unificada inyectada (5 roles)", "ONTOLOGY");
            const anxanetaRole = p.roles.find(r => r.levelId === '@anxaneta');
            assert(anxanetaRole !== undefined && anxanetaRole.name === 'Strategy', "Alias de marketing inyectado correctamente", "ONTOLOGY");

            // --- FASE 2: DISEÑO Y EDICIÓN DE ROLES ---
            const anxanetaId = anxanetaRole.id;
            store.dispatch({ type: 'UPDATE_ROLE', payload: { projectId: 'test-proj', roleId: anxanetaId, field: 'name', value: 'CEO Global' } });
            const pUpdated = store.getState().projects.find(x => x.id === 'test-proj');
            assert(pUpdated.roles.find(r => r.id === anxanetaId).name === 'CEO Global', "Renombrado de roles unificados", "STORE");
            
            store.dispatch({ type: 'UPDATE_PROJECT_INFO', payload: { projectId: 'test-proj', description: 'Prompt de IA para tests' } });
            assert(store.getState().projects.find(x => x.id === 'test-proj').description === 'Prompt de IA para tests', "Metadatos de proyecto guardados", "DESIGN");

            // --- FASE 3: CICLO DE VIDA DE ROLES ---
            store.dispatch({ type: 'CREATE_ROLE', payload: { projectId: 'test-proj', name: 'Data Analyst', levelId: '@baixos' } });
            let pAfterCreate = store.getState().projects.find(x => x.id === 'test-proj');
            const newRole = pAfterCreate.roles.find(r => r.name === 'Data Analyst');
            assert(newRole !== undefined && newRole.price === 45, "Creación de Nuevo Rol con herencia financiera", "ONTOLOGY");

            store.dispatch({ type: 'ARCHIVE_ROLE', payload: { projectId: 'test-proj', roleId: newRole.id } });
            const pAfterArchive = store.getState().projects.find(p => p.id === 'test-proj');
            assert(pAfterArchive.roles.find(r => r.id === newRole.id).isArchived === true, "Rol marcado como Archivado (Inmutabilidad)", "STORE");

            // --- FASE 4: ECONOMÍA DIRECCIONAL Y LEDGER ---
            const dososRole = pAfterArchive.roles.find(r => r.levelId === '@dosos');
            const baixosRole = pAfterArchive.roles.find(r => r.levelId === '@baixos');
            
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: anxanetaId, to: dososRole.id, horas: 2, entregable: 'Plan Q1', tipo: 'tangible' } } });
            const pWithTx = store.getState().projects.find(x => x.id === 'test-proj');
            const tx1 = pWithTx.transactions[0];
            
            assert(tx1.valorCongelado === (2 * 3.0 * 90), "Cálculo financiero y congelación (540€) OK", "ECONOMY");
            assert(tx1.tipo === 'tangible', "Metadato de tipo de flujo presente", "VNA");
            assert(tx1.hash !== undefined && tx1.hash.length > 5, "Transacción generó Hash criptográfico", "SECURITY");

            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: dososRole.id, to: baixosRole.id, horas: 1, entregable: 'Review', tipo: 'intangible' } } });
            const tx2 = store.getState().projects.find(x => x.id === 'test-proj').transactions[1];
            assert(tx2.prevHash === tx1.hash, "Transacción encadenada al Hash previo (Triple Entrada)", "SECURITY");

            // --- FASE 5: WATCHDOGS DE SALUD ---
            const salud = store.calculateResilience('test-proj');
            assert(salud === 100, `Cálculo de Resiliencia Sistémica (${salud}%)`, "RESILIENCE");

            // --- FASE 6: INTELIGENCIA Y SECUENCIACIÓN ---
            store.dispatch({ type: 'UPDATE_TRANSACTION_PHASE', payload: { projectId: 'test-proj', txHash: tx1.hash, fase: 1 } });
            store.dispatch({ type: 'UPDATE_TRANSACTION_PHASE', payload: { projectId: 'test-proj', txHash: tx2.hash, fase: 2 } });
            
            const prompt = store.generateSystemPrompt('test-proj');
            assert(prompt.includes('Fase 1:'), "Prompt generado incluye secuenciación de transacciones (Fase 1)", "INTEL");
            assert(prompt.includes('CEO Global'), "Prompt incluye los nombres de roles personalizados", "INTEL");

            // --- RESULTADO DE LA SUITE ---
            const summary = document.getElementById('summary-box');
            summary.className = "summary";
            summary.innerHTML = `<h3 style="margin-top:0; color:#f0f6fc;">Puntuación de Cobertura: ${passed}/${total}</h3>
                                 <p style="margin-bottom:0; font-weight:bold; color:${passed === total ? '#3fb950' : '#f85149'};">
                                    ${passed === total ? "🚀 KERNEL ESTABLE Y BLINDADO (v4.4)" : "🛠️ REPARACIÓN REQUERIDA"}
                                 </p>`;
        }
        
        runSuite();
    </script>
</body>
</html>
