<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS v5.7 | Suite de Validación Total</title>
    <style>
        :root {
            --bg-base: #010409; --bg-surface: #0d1117; --bg-panel: #161b22;
            --border-color: #30363d; --text-main: #c9d1d9; --text-muted: #8b949e;
            --text-heading: #f0f6fc; --accent-blue: #58a6ff; --accent-green: #238636;
            --accent-purple: #a371f7; --accent-red: #f85149; --accent-gold: #d29922; 
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-base); color: var(--text-main); 
            margin: 0; font-family: var(--font-family); line-height: 1.5; 
            padding-top: 90px;
        }

        /* 🚀 TOPBAR NATIVA */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--border-color);
            z-index: 2000; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; backdrop-filter: blur(10px);
        }

        .breadcrumb a { color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .breadcrumb a:hover { color: var(--accent-blue); }
        .breadcrumb span.separator { margin: 0 8px; color: var(--border-color); }
        .breadcrumb span.current { color: var(--text-heading); font-weight: bold; }

        .btn-back-nav { 
            margin-right: 12px; font-size: 1.2rem; text-decoration: none; display: inline-block; 
        }

        /* --- UI DE LOS TESTS --- */
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-top: 0; color: var(--text-heading); display: flex; align-items: center; gap: 15px; }
        
        .test-card { 
            background: var(--bg-panel); border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; 
            display: flex; align-items: center;
        }
        .pass { border-left: 5px solid var(--accent-green); }
        .fail { border-left: 5px solid var(--accent-red); background: rgba(248, 81, 73, 0.05); }
        
        .msg { flex-grow: 1; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; }
        .badge { 
            font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; 
            background: var(--bg-base); border: 1px solid var(--border-color); 
            margin-left: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; 
        }
        
        .summary { 
            margin-top: 40px; padding: 25px; border-radius: 12px; 
            background: var(--bg-surface); border: 2px solid var(--accent-blue); 
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="../index.html#/" style="text-decoration: none;">
                <div style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); border-radius: 8px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;">TT</div>
            </a>
            <div class="breadcrumb" style="font-size: 0.95rem; display: flex; align-items: center;">
                <a href="../index.html#/" class="btn-back-nav" title="Volver Atrás">⬅️</a>
                <a href="../index.html#/">Hub</a> <span class="separator">/</span>
                <span class="current">🧪 Suite de Validación Total</span>
            </div>
        </div>
        <div><span class="badge" style="background: rgba(163, 113, 247, 0.1); color: var(--accent-purple); border-color: var(--accent-purple);">MODO INGENIERO</span></div>
    </nav>

    <div class="container">
        <h1>⚙️ Test de Estrés del Kernel <span style="font-size: 1rem; color: var(--text-muted); font-weight: normal;">(v5.7.1)</span></h1>
        <div id="results"></div>
        <div id="summary-box"></div>
    </div>

    <script type="module">
        import { store } from '../js/core/store.js';

        function runSuite() {
            const results = document.getElementById('results');
            let passed = 0; let total = 0;

            const assert = (condition, message, tag) => {
                total++;
                const div = document.createElement('div');
                div.className = `test-card ${condition ? "pass" : "fail"}`;
                if(condition) passed++;
                div.innerHTML = `<span style="margin-right:15px; font-size:1.1rem;">${condition ? '✅' : '❌'}</span>
                                 <span class="msg">${message}</span>
                                 <span class="badge">${tag}</span>`;
                results.appendChild(div);
            };

            // --- TUS 31 TESTS ORIGINALES (FASES 1 A 12) ---
            assert(typeof store.calculateResilience === 'function', "Función de Resiliencia presente", "KERNEL");
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-proj', nombre: 'Test Project', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 'test-proj');
            assert(p !== undefined && p.sector === 'marketing', "Proyecto creado con sector asignado", "CORE");
            
            assert(p.roles && p.roles.length === 5, "Ontología Unificada inyectada (5 roles)", "ONTOLOGY");
            const anxanetaRole = p.roles.find(r => r.levelId === '@anxaneta');
            assert(anxanetaRole !== undefined && anxanetaRole.name === 'Strategy', "Alias de marketing inyectado correctamente", "ONTOLOGY");

            const anxanetaId = anxanetaRole.id;
            store.dispatch({ type: 'UPDATE_ROLE', payload: { projectId: 'test-proj', roleId: anxanetaId, field: 'name', value: 'CEO Global' } });
            const pUpdated = store.getState().projects.find(x => x.id === 'test-proj');
            assert(pUpdated.roles.find(r => r.id === anxanetaId).name === 'CEO Global', "Edición de nombres de roles", "STORE");
            
            store.dispatch({ type: 'UPDATE_PROJECT_INFO', payload: { projectId: 'test-proj', updates: { prompt: 'Misión IA' } } });
            assert(store.getState().projects.find(x => x.id === 'test-proj').prompt === 'Misión IA', "Metadatos persistidos", "DESIGN");

            store.dispatch({ type: 'ADD_ROLE', payload: { projectId: 'test-proj', role: { id: 'r-analista', name: 'Analista', levelId: '@baixos' } } });
            let pAfterCreate = store.getState().projects.find(x => x.id === 'test-proj');
            const newRole = pAfterCreate.roles.find(r => r.name === 'Analista');
            assert(newRole !== undefined, "Herencia financiera en nuevos roles", "ONTOLOGY");

            store.dispatch({ type: 'TOGGLE_ROLE_ARCHIVE', payload: { projectId: 'test-proj', roleId: newRole.id } });
            assert(store.getState().projects.find(proj => proj.id === 'test-proj').roles.find(r => r.id === newRole.id).isArchived === true, "Inmutabilidad vía Archivado", "STORE");

            const dososRole = pAfterCreate.roles.find(r => r.levelId === '@dosos');
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: anxanetaId, to: dososRole.id, horas: 2, entregable: 'Plan Q1', tipo: 'tangible' } } });
            const tx1 = store.getState().projects.find(x => x.id === 'test-proj').transactions[0];
            assert(tx1.valorCongelado === (2 * 3.0 * 90), "Cálculo financiero (540€) OK", "ECONOMY");
            assert(tx1.hash !== undefined, "Hash de seguridad generado", "SECURITY");

            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: dososRole.id, to: anxanetaId, horas: 1, entregable: 'Review', tipo: 'intangible' } } });
            const tx2 = store.getState().projects.find(x => x.id === 'test-proj').transactions[1];
            assert(tx2.prevHash === tx1.hash, "Triple Entrada: Chaining de hashes OK", "SECURITY");

            const salud = store.calculateResilience('test-proj');
            assert(salud > 0, `Salud sistémica calculada (${salud}%)`, "RESILIENCE");

            store.dispatch({ type: 'UPDATE_TRANSACTION_PHASE', payload: { projectId: 'test-proj', txHash: tx1.hash, fase: 1 } });
            const prompt = store.generateSystemPrompt('test-proj');
            assert(prompt.includes('Fase 1:'), "Prompt incluye secuenciación temporal", "INTEL");
            assert(prompt.includes('CEO Global'), "Prompt incluye personalización de roles", "INTEL");

            assert(store.getState().config !== undefined, "Objeto config global inicializado", "KERNEL");
            store.dispatch({ type: 'UPDATE_GLOBAL_CONFIG', payload: { theme: 'light', ecosystemName: 'Test Ecosistema' } });
            const currentConfig = store.getState().config;
            assert(currentConfig.theme === 'light' && currentConfig.ecosystemName === 'Test Ecosistema', "Actualización de Configuración Global OK", "SETTINGS");

            assert(typeof store.importSessionJSON === 'function', "El importador JSON existe en el Kernel", "PARSER");
            
            const dynTestUser1 = '@test_user_' + Date.now();
            const dynTestUser2 = '@test_ai_' + Date.now();
            store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'TestUser', id: dynTestUser1 } });
            store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'TestAI', id: dynTestUser2 } });
            
            const p
