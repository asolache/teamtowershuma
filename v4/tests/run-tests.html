<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>SOS v4 | Test Runner</title></head>
<body style="background:#010409; color:#c9d1d9; font-family:monospace; padding:40px;">
    <h1>🧪 Suite de Validación v4.0</h1>
    <div id="results"></div>

    <script type="module">
        import { store } from '../js/core/store.js';

        async function run() {
            const res = document.getElementById('results');
            const assert = (cond, msg) => {
                res.innerHTML += `<div style="color:${cond ? '#238636':'#f85149'}">${cond ? '✅':'❌'} ${msg}</div>`;
            };

            // Espera técnica de seguridad
            await new Promise(r => window.addEventListener('store-ready', r));
            await new Promise(r => setTimeout(r, 100));

            // Test 1: Ontología
            assert(store.state.ontology !== null, "Kernel cargado con ontología");

            // Test 2 & 3: Sectores y Nombres
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 't1', nombre: 'Test', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 't1');
            assert(p.sector === 'marketing', "Sector marketing registrado");
            assert(p.customRoles['@anxaneta'] === 'Strategy Director', "Nombres de marketing asignados correctamente");

            // Test 4: Edición
            store.dispatch({ type: 'UPDATE_ROLE_NAME', payload: { projectId: 't1', rolId: '@baixos', newName: 'Junior' } });
            const p2 = store.getState().projects.find(x => x.id === 't1');
            assert(p2.customRoles['@baixos'] === 'Junior', "Edición de rol persistente");

            // Test 5: Economía (540€)
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 't1', transaction: { rolId: '@anxaneta', horas: 2, concepto: 'Test' } } });
            const tx = p2.transactions[0];
            assert(tx.liquidación === 540, "Cálculo 540€ OK (90*3*2)");

            // Test 6: VNA
            assert(tx.hasOwnProperty('tipo_flujo'), "Metadato VNA presente");
        }
        run();
    </script>
</body>
</html>
