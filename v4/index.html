<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS v4.5 | Ecosistema</title>
    <style>
        /* --- VARIABLES GLOBALES --- */
        :root {
            --bg-base: #010409;
            --bg-surface: #0d1117;
            --bg-panel: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --text-heading: #f0f6fc;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-purple: #a371f7;
            --accent-red: #f85149;
            
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --transition-speed: 0.2s;
        }

        /* --- RESET Y BASE --- */
        * { box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            margin: 0; 
            font-family: var(--font-family);
            overflow-x: hidden;
            line-height: 1.5;
        }

        #app { min-height: 100vh; }

        /* --- TIPOGRAFÍA --- */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-heading);
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        p { margin-top: 0; margin-bottom: 1rem; }
        
        .text-muted { color: var(--text-muted); }
        .text-accent { color: var(--accent-blue); }
        .text-small { font-size: 0.85rem; }
        .text-uppercase { text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; }

        /* --- LAYOUT Y CONTENEDORES --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .container-sm {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        .panel-surface {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        /* --- COMPONENTES (Botones, Inputs, Cards) --- */
        .btn {
            display: inline-block;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.5;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: all var(--transition-speed) ease;
            font-family: var(--font-family);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #ffffff;
        }
        .btn-primary:hover { background-color: var(--accent-green-hover); }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-blue);
            border-color: var(--border-color);
        }
        .btn-outline:hover {
            border-color: var(--accent-blue);
            background-color: rgba(88, 166, 255, 0.1);
        }
        
        .btn-secondary {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border-color: var(--border-color);
        }
        .btn-secondary:hover { background-color: var(--bg-panel); border-color: var(--text-muted); }

        .btn-block {
            display: block;
            width: 100%;
            text-align: center;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 10px 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-heading);
            background-color: var(--bg-surface);
            background-clip: padding-box;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: border-color var(--transition-speed) ease;
            font-family: var(--font-family);
            margin-bottom: 12px;
        }
        .form-control:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .card-interactive {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: transform var(--transition-speed) ease, border-color var(--transition-speed) ease;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-interactive:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        /* --- MAPA --- */
        .map-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            height: 750px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
        }

        /* --- ANIMACIONES --- */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { store } from './js/core/store.js';
        import { HomeView } from './js/views/HomeView.js';
        import { ProjectView } from './js/views/ProjectView.js';
        import { AboutView } from './js/views/AboutView.js';
        import { ProjectEditView } from './js/views/ProjectEditView.js';
        import { ProjectAccountingView } from './js/views/ProjectAccountingView.js';
        
        // 🚀 NUEVA IMPORTACIÓN: El Portal del Contribuidor
        import { UserDashboardView } from './js/views/UserDashboardView.js';
        
        // 💡 NOTA: Si tienes un TestView.js real, descomenta la línea de abajo e impórtalo.
        // import { TestView } from './js/views/TestView.js';

        const app = document.getElementById('app');

        function router() {
            const hash = window.location.hash || '#/';
            const parts = hash.split('/');
            const pId = parts[2];
            const action = parts[3];

            // Animación suave entre vistas
            app.classList.remove('fade-in');
            void app.offsetWidth;

            try {
                if (hash === '#/' || hash === '' || hash === '#') {
                    app.innerHTML = HomeView.render();
                
                } else if (hash === '#/about') {
                    app.innerHTML = AboutView.render();
                
                // 🚀 NUEVA RUTA: Carga el dashboard personal del usuario
                } else if (hash === '#/user') {
                    app.innerHTML = UserDashboardView.render();

                } else if (hash === '#/test') {
                    // 💡 Si usas el import de arriba, cambia esta línea por: app.innerHTML = TestView.render();
                    app.innerHTML = `
                        <div class="container container-sm text-center">
                            <header class="header-main" style="justify-content: center;">
                                <h1>🧪 Entorno de Pruebas (Test)</h1>
                            </header>
                            <div class="panel" style="border-color: var(--accent-purple);">
                                <p>Zona de experimentación aislada del sistema principal.</p>
                                <button class="btn btn-secondary" onclick="location.hash='#/'">← Volver al Dashboard</button>
                            </div>
                        </div>`;
                
                } else if (hash.startsWith('#/project/')) {
                    if (action === 'edit') {
                        app.innerHTML = ProjectEditView.render(pId);
                    } else if (action === 'accounting') {
                        app.innerHTML = ProjectAccountingView.render(pId);
                    } else {
                        app.innerHTML = ProjectView.render(pId);
                    }
                
                } else {
                     app.innerHTML = `
                        <div class="container container-sm text-center">
                            <h2 class="text-accent" style="font-size: 3rem;">⚠️ 404</h2>
                            <p>Coordenada desconocida en el ecosistema.</p>
                            <button class="btn btn-secondary" onclick="location.hash='#/'">Volver a la Base</button>
                        </div>`;
                }
            } catch (e) {
                console.error("SOS Router Error:", e);
                app.innerHTML = `
                    <div class="container container-sm">
                        <div class="panel" style="border-color: var(--accent-red);">
                            <h3 style="color: var(--accent-red);">Error de Renderizado</h3>
                            <p>${e.message}</p>
                            <button class="btn btn-outline" onclick="location.hash='#/'">Forzar Reinicio</button>
                        </div>
                    </div>`;
            }
            
            app.classList.add('fade-in');
        }

        // --- SISTEMA REACTIVO ---
        window.addEventListener('hashchange', router);
        window.addEventListener('store-ready', router); // Escucha los cambios del store sin recargar
        
        // Inicialización
        if (store.getState()) router();
    </script>
</body>
</html>
