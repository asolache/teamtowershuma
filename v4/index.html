<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Dashboard SOS v4</title></head>
<body style="background:#010409; color:white; font-family:sans-serif; padding:40px;">
    <h1>🏗️ Gestión de Castells</h1>
    <div style="background:#0d1117; padding:20px; border-radius:8px; border:1px solid #30363d; max-width:500px;">
        <h3>Nuevo Proyecto</h3>
        <input id="name" placeholder="Nombre..." style="width:100%; padding:10px; margin-bottom:10px;">
        <select id="sector" style="width:100%; padding:10px; margin-bottom:10px;">
            <option value="software">Software / IT</option>
            <option value="marketing">Marketing / Agencia</option>
        </select>
        <button onclick="nuevo()" style="width:100%; padding:10px; background:#238636; color:white; border:none; cursor:pointer;">Crear</button>
    </div>
    <div id="lista" style="margin-top:20px;"></div>

    <script type="module">
        import { store } from './js/core/store.js';
        window.nuevo = () => {
            const nombre = document.getElementById('name').value;
            const sector = document.getElementById('sector').value;
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'p-'+Date.now(), nombre, sector } });
        };
        const render = () => {
            document.getElementById('lista').innerHTML = store.getState().projects.map(p => `
                <div style="padding:10px; border-bottom:1px solid #333;">
                    ${p.nombre} (${p.sector}) - <a href="project.html?id=${p.id}" style="color:#58a6ff;">Abrir Canvas</a>
                </div>
            `).join('');
        };
        window.addEventListener('store-ready', render);
        store.subscribe(render);
    </script>
</body>
</html>
