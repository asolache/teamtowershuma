<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOS v5.7 | Suite de Validación Total</title>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .nav-link { color: #58a6ff; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        h1 { border-bottom: 2px solid #30363d; padding-bottom: 10px; color: #f0f6fc; }
        .test-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; }
        .pass { border-left: 5px solid #238636; }
        .fail { border-left: 5px solid #f85149; background: #2a1215; }
        .msg { flex-grow: 1; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; }
        .badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: #30363d; margin-left: 10px; color: #8b949e; text-transform: uppercase; font-weight: bold; }
        .summary { margin-top: 30px; padding: 20px; border-radius: 8px; background: #0d1117; border: 1px solid #3b82f6; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html#/" class="nav-link">← Volver al Dashboard</a>
        <h1>🧪 SOS v5.7: Test de Estrés del Kernel</h1>
        <div id="results"></div>
        <div id="summary-box"></div>
    </div>

<script type="module">
        import { store } from '../js/core/store.js';

        function runSuite() {
            const results = document.getElementById('results');
            let passed = 0; let total = 0;

            const assert = (condition, message, tag) => {
                total++;
                const div = document.createElement('div');
                div.className = `test-card ${condition ? "pass" : "fail"}`;
                if(condition) passed++;
                div.innerHTML = `<span style="margin-right:15px">${condition ? '✅' : '❌'}</span>
                                 <span class="msg">${message}</span>
                                 <span class="badge">${tag}</span>`;
                results.appendChild(div);
            };

            // --- FASE 1: NÚCLEO ---
            assert(typeof store.calculateResilience === 'function', "Función de Resiliencia presente", "KERNEL");
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-proj', nombre: 'Test Project', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 'test-proj');
            assert(p !== undefined && p.sector === 'marketing', "Proyecto creado con sector asignado", "CORE");
            
            // --- FASE 2: ONTOLOGÍA BASE ---
            assert(p.roles && p.roles.length === 5, "Ontología Unificada inyectada (5 roles)", "ONTOLOGY");
            const anxanetaRole = p.roles.find(r => r.levelId === '@anxaneta');
            assert(anxanetaRole !== undefined && anxanetaRole.name === 'Strategy', "Alias de marketing inyectado correctamente", "ONTOLOGY");

            // --- FASE 3: EDICIÓN ---
            const anxanetaId = anxanetaRole.id;
            store.dispatch({ type: 'UPDATE_ROLE', payload: { projectId: 'test-proj', roleId: anxanetaId, field: 'name', value: 'CEO Global' } });
            const pUpdated = store.getState().projects.find(x => x.id === 'test-proj');
            assert(pUpdated.roles.find(r => r.id === anxanetaId).name === 'CEO Global', "Edición de nombres de roles", "STORE");
            
            store.dispatch({ type: 'UPDATE_PROJECT_INFO', payload: { projectId: 'test-proj', description: 'Misión IA' } });
            assert(store.getState().projects.find(x => x.id === 'test-proj').description === 'Misión IA', "Metadatos persistidos", "DESIGN");

            // --- FASE 4: CICLO DE VIDA ---
            store.dispatch({ type: 'CREATE_ROLE', payload: { projectId: 'test-proj', name: 'Analista', levelId: '@baixos' } });
            let pAfterCreate = store.getState().projects.find(x => x.id === 'test-proj');
            const newRole = pAfterCreate.roles.find(r => r.name === 'Analista');
            assert(newRole !== undefined && newRole.price === 45, "Herencia financiera en nuevos roles", "ONTOLOGY");

            store.dispatch({ type: 'ARCHIVE_ROLE', payload: { projectId: 'test-proj', roleId: newRole.id } });
            assert(store.getState().projects.find(proj => proj.id === 'test-proj').roles.find(r => r.id === newRole.id).isArchived === true, "Inmutabilidad vía Archivado", "STORE");

            // --- FASE 5: ECONOMÍA ---
            const dososRole = pAfterCreate.roles.find(r => r.levelId === '@dosos');
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: anxanetaId, to: dososRole.id, horas: 2, entregable: 'Plan Q1', tipo: 'tangible' } } });
            const tx1 = store.getState().projects.find(x => x.id === 'test-proj').transactions[0];
            
            assert(tx1.valorCongelado === (2 * 3.0 * 90), "Cálculo financiero (540€) OK", "ECONOMY");
            assert(tx1.hash !== undefined, "Hash de seguridad generado", "SECURITY");

            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: dososRole.id, to: anxanetaId, horas: 1, entregable: 'Review', tipo: 'intangible' } } });
            const tx2 = store.getState().projects.find(x => x.id === 'test-proj').transactions[1];
            assert(tx2.prevHash === tx1.hash, "Triple Entrada: Chaining de hashes OK", "SECURITY");

            // --- FASE 6: ANALÍTICA ---
            const salud = store.calculateResilience('test-proj');
            assert(salud > 0, `Salud sistémica calculada (${salud}%)`, "RESILIENCE");

            // --- FASE 7: INTELIGENCIA ---
            store.dispatch({ type: 'UPDATE_TRANSACTION_PHASE', payload: { projectId: 'test-proj', txHash: tx1.hash, fase: 1 } });
            const prompt = store.generateSystemPrompt('test-proj');
            assert(prompt.includes('Fase 1:'), "Prompt incluye secuenciación temporal", "INTEL");
            assert(prompt.includes('CEO Global'), "Prompt incluye personalización de roles", "INTEL");

            // --- FASE 8: CONFIGURACIÓN GLOBAL ---
            assert(store.getState().config !== undefined, "Objeto config global inicializado", "KERNEL");
            store.dispatch({ type: 'UPDATE_GLOBAL_CONFIG', payload: { theme: 'light', ecosystemName: 'Test Ecosistema' } });
            const currentConfig = store.getState().config;
            assert(currentConfig.theme === 'light' && currentConfig.ecosystemName === 'Test Ecosistema', "Actualización de Configuración Global OK", "SETTINGS");

            // --- FASE 9: AUTO-LEDGER (INYECCIÓN JSON) ---
            assert(typeof store.importSessionJSON === 'function', "El importador JSON existe en el Kernel", "PARSER");
            
            const dynTestUser1 = '@test_user_' + Date.now();
            const dynTestUser2 = '@test_ai_' + Date.now();

            store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'TestUser', uniqueId: dynTestUser1 } });
            store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'TestAI', uniqueId: dynTestUser2 } });
            const pForJson = store.getState().projects.find(x => x.id === 'test-proj');
            
            const numLedgersBefore = pForJson.ledger ? pForJson.ledger.length : 0;
            
            const mockAIResponse = [
                { userId: dynTestUser1, roleId: anxanetaId, receiverId: newRole.id, description: "Diseño TDD", horas: 0.5 },
                { userId: dynTestUser2, roleId: newRole.id, receiverId: anxanetaId, description: "Refactor", horas: 0.8 }
            ];
            
            store.importSessionJSON('test-proj', mockAIResponse);
            
            const numLedgersAfter = store.getState().projects.find(x => x.id === 'test-proj').ledger.length;
            assert(numLedgersAfter === numLedgersBefore + 2, "El importador ha inyectado el JSON al Ledger", "AUTO-LEDGER");

            // --- FASE 10: IDENTIDAD GLOBAL (SSO) Y @ID ÚNICO ---
            assert(store.getState().globalUsers !== undefined, "Pool Global de Usuarios inicializado", "KERNEL");
            
            const dynLauraId = '@laura_dev_' + Math.floor(Math.random() * 100000);

            store.dispatch({ 
                type: 'ADD_USER', 
                payload: { projectId: 'test-proj', name: 'Laura (Node Dev)', uniqueId: dynLauraId, walletOrSocial: '0x123...abc' } 
            });
            
            const stateAfterUser = store.getState();
            const lauraGlobal = stateAfterUser.globalUsers.find(u => u.id === dynLauraId);
            
            assert(lauraGlobal !== undefined, "Usuario añadido al Pool Global con @id único", "IDENTITY");
            assert(lauraGlobal.wallet === '0x123...abc', "Metadatos extendidos (Wallet/Social) guardados", "IDENTITY");
            
            const lauraInProject = stateAfterUser.projects.find(x => x.id === 'test-proj').usuarios.find(u => u.id === dynLauraId);
            assert(lauraInProject !== undefined, "Usuario enlazado al Proyecto local usando su @id", "IDENTITY");

            let errorThrown = false;
            try {
                store.dispatch({ type: 'ADD_USER', payload: { projectId: 'test-proj', name: 'Laura Falsa', uniqueId: dynLauraId } });
            } catch (error) {
                errorThrown = true;
            }
            assert(errorThrown, "El Kernel bloquea la creación de usuarios con @id duplicado", "SECURITY");

            // --- FASE 11: CONTROL DE ACCESO (RBAC) Y SESIONES ---
            store.dispatch({ type: 'LOGIN_USER', payload: { userId: dynLauraId } });
            const sessionActive = store.getState().session;
            
            assert(sessionActive !== undefined, "Objeto de sesión creado en el Kernel", "RBAC");
            assert(sessionActive.activeUserId === dynLauraId, "El usuario activo se registró correctamente en la sesión", "RBAC");
            assert(sessionActive.role === 'user', "Por defecto, el usuario entra con permisos básicos", "RBAC");

            store.dispatch({ type: 'LOGIN_USER', payload: { userId: 'ecosystem-admin' } });
            assert(store.getState().session.role === 'admin', "El Administrador recupera el rol máximo (admin)", "RBAC");

            // 🚀 --- FASE 12: ONTOLOGÍA DINÁMICA (NUEVO v5.7) ---
            assert(store.getState().ontology !== undefined && store.getState().ontology.sectores !== undefined, "La Ontología es accesible desde el estado dinámico", "ONTOLOGY");
            
            // Inyectamos un nuevo sector dinámicamente
            store.dispatch({
                type: 'ADD_ONTOLOGY_SECTOR',
                payload: {
                    sectorId: 'deep-tech',
                    rolesData: {
                        "@anxaneta": { name: "Lead Scientist", prompt: "Diriges la investigación..." },
                        "@aixecador": { name: "Lab Manager", prompt: "Coordinas el laboratorio..." },
                        "@dosos": { name: "Peer Reviewer", prompt: "Auditas la ciencia..." },
                        "@baixos": { name: "Researcher", prompt: "Ejecutas experimentos..." },
                        "@pinya": { name: "Data Analyst", prompt: "Procesas métricas..." }
                    }
                }
            });

            const newOntology = store.getState().ontology;
            assert(newOntology.sectores['deep-tech'] !== undefined, "El EO puede crear nuevos Sectores dinámicamente", "DATABASE");
            assert(newOntology.sectores['deep-tech']['@anxaneta'].name === 'Lead Scientist', "Los roles del nuevo sector se guardaron correctamente", "DATABASE");

            // Creamos un proyecto para probar que coge la ontología nueva
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-proj-2', nombre: 'Deep Tech Lab', sector: 'deep-tech' } });
            const p2 = store.getState().projects.find(x => x.id === 'test-proj-2');
            assert(p2.roles.find(r => r.levelId === '@anxaneta').name === 'Lead Scientist', "Un nuevo proyecto usa la ontología dinámica correctamente", "CORE");

            // --- RESULTADO ---
            const summary = document.getElementById('summary-box');
            summary.className = "summary";
            const ok = passed === total;
            summary.innerHTML = `<h3 style="margin:0">Certificación: ${passed}/${total}</h3>
                                 <p style="font-weight:bold; color:${ok ? '#3fb950' : '#f85149'}; margin:5px 0 0 0;">
                                    ${ok ? "🚀 KERNEL v5.7 VALIDADO PARA PRODUCCIÓN" : "🛠️ FALLO DETECTADO"}
                                 </p>`;
        }
        
        runSuite();
    </script>
</body>
</html>
