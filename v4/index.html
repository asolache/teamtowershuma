<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS v4.2 | Dashboard</title>
    <style>
        :root {
            --bg-color: #010409;
            --card-bg: #0d1117;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        #app { min-height: 100vh; }
        
        /* Animación de entrada para las vistas */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { store } from './js/core/store.js';
        import { HomeView } from './js/views/HomeView.js';
        import { ProjectView } from './js/views/ProjectView.js';
        import { AboutView } from './js/views/AboutView.js';

        const app = document.getElementById('app');

        /**
         * ROUTER: Orquestador de navegación SPA
         */
        function router() {
            const rawHash = window.location.hash || '#/';
            // Normalizamos el hash eliminando slash final si existe (ej: #/about/ -> #/about)
            const hash = rawHash.replace(/\/$/, "");
            
            console.log("SOS Kernel -> Navegando a:", hash);

            // Reiniciar estado visual para la transición
            app.classList.remove('fade-in');
            void app.offsetWidth; // Reflow forzoso para reiniciar animación

            // Lógica de Enrutamiento
            if (hash === '#/' || hash === '') {
                app.innerHTML = HomeView.render();
            } 
            else if (hash === '#/about') {
                app.innerHTML = AboutView.render();
            } 
            else if (hash.startsWith('#/project/')) {
                const parts = hash.split('/');
                const projectId = parts[2];
                if (projectId) {
                    app.innerHTML = ProjectView.render(projectId);
                } else {
                    window.location.hash = '#/';
                }
            } 
            else {
                // Vista 404 personalizada
                app.innerHTML = `
                    <div style="padding:100px; text-align:center; color:#8b949e;">
                        <h2 style="color:#f0f6fc;">⚠️ 404 - Coordenada Inválida</h2>
                        <p>El sector <code>${hash}</code> no existe en la ontología del Castell.</p>
                        <a href="#/" style="color:var(--accent); text-decoration:none; font-weight:bold;">← Volver al Dashboard</a>
                    </div>
                `;
            }

            app.classList.add('fade-in');
        }

        // --- GESTIÓN DE CICLO DE VIDA ---

        // El Kernel emite 'store-ready' tras cargar localStorage y ontología
        window.addEventListener('store-ready', () => {
            console.log("SOS v4.2: Motor de datos listo.");
            router();
        });

        // Escucha cambios de URL (atrás/adelante en el navegador)
        window.addEventListener('hashchange', router);

        // Fallback: Si el store tarda más de lo previsto, intentar router inicial
        if (store && store.state && store.state.projects.length > 0) {
            router();
        }

    </script>
</body>
</html>
