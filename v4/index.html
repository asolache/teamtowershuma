<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS v4.3 | Dashboard</title>
    <style>
        :root { --bg-color: #010409; --text-main: #c9d1d9; --accent: #58a6ff; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; font-family: sans-serif; overflow-x: hidden; }
        #app { min-height: 100vh; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { store } from './js/core/store.js';
        import { HomeView } from './js/views/HomeView.js';
        import { ProjectView } from './js/views/ProjectView.js';
        import { AboutView } from './js/views/AboutView.js';
        import { ProjectEditView } from './js/views/ProjectEditView.js';

        const app = document.getElementById('app');

        function router() {
            let hash = window.location.hash || '#/';
            if (hash !== '#/' && hash.endsWith('/')) hash = hash.slice(0, -1);
            
            app.classList.remove('fade-in');
            void app.offsetWidth;

            if (hash === '#/' || hash === '#' || hash === '') {
                app.innerHTML = HomeView.render();
            } else if (hash === '#/about') {
                app.innerHTML = AboutView.render();
            } else if (hash.startsWith('#/project/')) {
                const parts = hash.split('/');
                const pId = parts[2];
                const action = parts[3];
                if (action === 'edit') app.innerHTML = ProjectEditView.render(pId);
                else if (action === 'accounting') app.innerHTML = '<div style="padding:100px;text-align:center;"><h2>💰 Contabilidad</h2><a href="#/project/'+pId+'">Volver</a></div>';
                else app.innerHTML = ProjectView.render(pId);
            }
            app.classList.add('fade-in');
        }

        window.addEventListener('store-ready', router);
        window.addEventListener('hashchange', router);
        if (store && store.state) setTimeout(router, 50);
    </script>
</body>
</html>
