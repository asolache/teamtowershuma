<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS v4.2 | Dashboard</title>
    <style>
        :root {
            --bg-color: #010409;
            --card-bg: #0d1117;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        #app { min-height: 100vh; }
        
        /* Transición suave entre vistas */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="app">
        </div>

    <script type="module">
        import { store } from './js/core/store.js';
        import { HomeView } from './js/views/HomeView.js';
        import { ProjectView } from './js/views/ProjectView.js';

        const app = document.getElementById('app');

        // --- ROUTER LÓGICO ---
        function router() {
            const hash = window.location.hash || '#/';
            app.classList.remove('fade-in');
            
            // Forzamos un reflow para que la animación se repita
            void app.offsetWidth; 
            app.classList.add('fade-in');

            if (hash === '#/') {
                app.innerHTML = HomeView.render();
            } else if (hash.startsWith('#/project/')) {
                const projectId = hash.split('/')[2];
                app.innerHTML = ProjectView.render(projectId);
            } else {
                app.innerHTML = `<div style="padding:50px; color:white;">404 - Ruta no encontrada</div>`;
            }
        }

        // --- ESCUCHADORES DE EVENTOS ---
        
        // Renderizar cuando el store esté listo (primera carga)
        window.addEventListener('store-ready', () => {
            console.log("SOS Kernel: Online");
            router();
        });

        // Renderizar cuando cambie la URL (navegación)
        window.addEventListener('hashchange', router);

        // Opcional: Re-renderizar cuando el store cambie (reactividad)
        // store.subscribe(() => router()); 
        // Nota: Por ahora usamos location.reload() en las vistas para simplificar, 
        // pero esta línea permitiría actualizaciones sin refrescar.

    </script>
</body>
</html>
