<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS v5.7 | Suite de Validación Total</title>
    <style>
        /* --- VARIABLES GLOBALES --- */
        :root {
            --bg-base: #010409; --bg-surface: #0d1117; --bg-panel: #161b22;
            --border-color: #30363d; --text-main: #c9d1d9; --text-muted: #8b949e;
            --text-heading: #f0f6fc; --accent-blue: #58a6ff; --accent-green: #238636;
            --accent-purple: #a371f7; --accent-red: #f85149; --accent-gold: #d29922; 
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-base); color: var(--text-main); 
            margin: 0; font-family: var(--font-family); line-height: 1.5; 
            padding-top: 90px;
        }

        /* 🚀 TOPBAR NATIVA */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--border-color);
            z-index: 2000; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; backdrop-filter: blur(10px);
        }

        .breadcrumb a { color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .breadcrumb a:hover { color: var(--accent-blue); }
        .breadcrumb span.separator { margin: 0 8px; color: var(--border-color); }
        .breadcrumb span.current { color: var(--text-heading); font-weight: bold; }

        .btn-back-nav { 
            margin-right: 12px; font-size: 1.2rem; text-decoration: none; 
            transition: transform 0.2s; display: inline-block; 
        }
        .btn-back-nav:hover { transform: translateX(-3px); }

        /* --- UI DE LOS TESTS --- */
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-top: 0; color: var(--text-heading); display: flex; align-items: center; gap: 15px; }
        
        .test-card { 
            background: var(--bg-panel); border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; 
            display: flex; align-items: center; transition: transform 0.2s;
        }
        .test-card:hover { transform: translateX(5px); }
        .pass { border-left: 5px solid var(--accent-green); }
        .fail { border-left: 5px solid var(--accent-red); background: rgba(248, 81, 73, 0.05); }
        
        .msg { flex-grow: 1; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; }
        .badge { 
            font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; 
            background: var(--bg-base); border: 1px solid var(--border-color); 
            margin-left: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; 
        }
        
        .summary { 
            margin-top: 40px; padding: 25px; border-radius: 12px; 
            background: var(--bg-surface); border: 2px solid var(--accent-blue); 
            text-align: center; box-shadow: 0 10px 30px rgba(88,166,255,0.1);
        }
    </style>
</head>
<body>
    
    <nav class="topbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="../index.html#/" style="text-decoration: none;">
                <div style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); border-radius: 8px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; box-shadow: 0 2px 8px rgba(88,166,255,0.3);">TT</div>
            </a>
            <div class="breadcrumb" style="font-size: 0.95rem; display: flex; align-items: center;">
                <a href="javascript:history.back()" class="btn-back-nav" title="Volver Atrás">⬅️</a>
                <a href="../index.html#/">Hub</a> <span class="separator">/</span>
                <span class="current">🧪 Suite de TDD (Pruebas de Estrés)</span>
            </div>
        </div>
        <div>
            <span class="badge" style="background: rgba(163, 113, 247, 0.1); color: var(--accent-purple); border-color: var(--accent-purple);">MODO INGENIERO</span>
        </div>
    </nav>

    <div class="container fade-in">
        <h1>⚙️ Test de Estrés del Kernel <span style="font-size: 1rem; color: var(--text-muted); font-weight: normal;">(v5.7.1)</span></h1>
        <p class="text-muted" style="margin-bottom: 30px;">Ejecutando validaciones en tiempo real sobre la inmutabilidad, el Value Accounting y las nuevas dinámicas de Tokenomics.</p>
        
        <div id="results"></div>
        <div id="summary-box"></div>
    </div>

    <script type="module">
        import { store } from '../js/core/store.js';

        function runSuite() {
            const results = document.getElementById('results');
            let passed = 0; let total = 0;

            const assert = (condition, message, tag) => {
                total++;
                const div = document.createElement('div');
                div.className = `test-card ${condition ? "pass" : "fail"}`;
                if(condition) passed++;
                div.innerHTML = `<span style="margin-right:15px; font-size:1.2rem;">${condition ? '✅' : '❌'}</span>
                                 <span class="msg">${message}</span>
                                 <span class="badge">${tag}</span>`;
                results.appendChild(div);
            };

            // FASES 1-12 (Mantenidas del Kernel blindado original)
            assert(typeof store.calculateResilience === 'function', "Función de Resiliencia presente", "KERNEL");
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-proj', nombre: 'Test Project', sector: 'marketing' } });
            const p = store.getState().projects.find(x => x.id === 'test-proj');
            assert(p !== undefined && p.sector === 'marketing', "Proyecto creado con sector asignado", "CORE");
            
            assert(p.roles && p.roles.length === 5, "Ontología Unificada inyectada (5 roles)", "ONTOLOGY");
            const anxanetaRole = p.roles.find(r => r.levelId === '@anxaneta');
            assert(anxanetaRole !== undefined && anxanetaRole.name === 'Strategy', "Alias inyectado", "ONTOLOGY");

            const anxanetaId = anxanetaRole.id;
            store.dispatch({ type: 'UPDATE_ROLE', payload: { projectId: 'test-proj', roleId: anxanetaId, field: 'name', value: 'CEO Global' } });
            assert(store.getState().projects.find(x => x.id === 'test-proj').roles.find(r => r.id === anxanetaId).name === 'CEO Global', "Edición de roles", "STORE");
            
            store.dispatch({ type: 'UPDATE_PROJECT_INFO', payload: { projectId: 'test-proj', updates: { prompt: 'Misión IA' } } });
            assert(store.getState().projects.find(x => x.id === 'test-proj').prompt === 'Misión IA', "Metadatos persistidos", "DESIGN");

            store.dispatch({ type: 'ADD_ROLE', payload: { projectId: 'test-proj', role: { id: 'r-analista', name: 'Analista', levelId: '@baixos' } } });
            const pAfterCreate = store.getState().projects.find(x => x.id === 'test-proj');
            const newRole = pAfterCreate.roles.find(r => r.name === 'Analista');
            assert(newRole !== undefined, "Inyección de nodos nuevos", "ONTOLOGY");

            store.dispatch({ type: 'TOGGLE_ROLE_ARCHIVE', payload: { projectId: 'test-proj', roleId: newRole.id } });
            assert(store.getState().projects.find(proj => proj.id === 'test-proj').roles.find(r => r.id === newRole.id).isArchived === true, "Archivado inmutable", "STORE");

            const dososRole = pAfterCreate.roles.find(r => r.levelId === '@dosos');
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: anxanetaId, to: dososRole.id, horas: 2, entregable: 'Plan Q1', tipo: 'tangible' } } });
            const tx1 = store.getState().projects.find(x => x.id === 'test-proj').transactions[0];
            assert(tx1.hash !== undefined, "Hash de seguridad criptográfica generado", "SECURITY");

            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-proj', tx: { from: dososRole.id, to: anxanetaId, horas: 1, entregable: 'Review', tipo: 'intangible' } } });
            const tx2 = store.getState().projects.find(x => x.id === 'test-proj').transactions[1];
            assert(tx2.prevHash === tx1.hash, "Chaining de hashes OK (Triple Entrada)", "SECURITY");

            const dynLauraId = '@laura_dev_' + Math.floor(Math.random() * 100000);
            store.dispatch({ type: 'ADD_USER', payload: { id: dynLauraId, projectId: 'test-proj', name: 'Laura' } });
            assert(store.getState().globalUsers.find(u => u.id === dynLauraId) !== undefined, "Identidad Soberana (@id) registrada", "IDENTITY");

            store.dispatch({ type: 'LOGIN_USER', payload: { userId: dynLauraId } });
            assert(store.getState().session.activeUserId === dynLauraId, "RBAC: Sesión de usuario activo", "RBAC");
            store.dispatch({ type: 'LOGIN_USER', payload: { userId: 'ecosystem-admin' } });

            // 🚀 --- FASE 13: TOKENOMICS, ECOSISTEMAS Y PULL SYSTEM (NUEVO v5.7) ---
            
            // 1. Tipos de Redes (Proyectos vs Ecosistemas)
            store.dispatch({ type: 'ADD_PROJECT', payload: { id: 'test-eco', nombre: 'DAO Project', sector: 'general', tipo: 'ecosystem' } });
            let pEco = store.getState().projects.find(x => x.id === 'test-eco');
            assert(pEco.tipo === 'ecosystem', "El Kernel diferencia estructuralmente entre Proyectos y Ecosistemas", "NETWORK");

            // 2. Tokenomics (Configuración)
            store.dispatch({ type: 'UPDATE_PROJECT_CONFIG', payload: { projectId: 'test-eco', config: { tokenomics: 'dao' } } });
            assert(store.getState().projects.find(x => x.id === 'test-eco').config.tokenomics === 'dao', "Modelo Tokenomics (DAO) guardado en el Kernel", "TOKENOMICS");

            // 3. Multiplicadores de Riesgo
            store.dispatch({ type: 'ADD_ROLE', payload: { projectId: 'test-eco', role: { id: 'role-inversor', name: 'Angel Investor', levelId: '@anxaneta', multiplier: 2.5 } } });
            let investorRole = store.getState().projects.find(x => x.id === 'test-eco').roles.find(r => r.id === 'role-inversor');
            assert(investorRole.multiplier === 2.5, "El Multiplicador de Riesgo (Slicing Pie) se ancla al Rol Teórico", "ECONOMY");

            // 4. Pull System (Auto-asignación)
            store.dispatch({ type: 'ADD_TRANSACTION', payload: { projectId: 'test-eco', tx: { from: anxanetaId, to: 'role-inversor', horas: 10, entregable: 'Inversión Semilla', tipo: 'tangible' } } });
            let txPull = store.getState().projects.find(x => x.id === 'test-eco').transactions[0];
            assert(txPull.status === 'theoretical', "El Entregable nace como Teórico (Disponible en el mercado)", "PULL-SYSTEM");

            store.dispatch({ type: 'PING_TRANSACTION', payload: { projectId: 'test-eco', txHash: txPull.hash, userId: dynLauraId } });
            txPull = store.getState().projects.find(x => x.id === 'test-eco').transactions[0];
            assert(txPull.status === 'pinged' && txPull.assigneeId === dynLauraId, "El usuario puede auto-asignarse el entregable (Pull Method)", "PULL-SYSTEM");

            // --- RESULTADO ---
            const summary = document.getElementById('summary-box');
            summary.className = "summary";
            const ok = passed === total;
            summary.innerHTML = `<h2 style="margin:0; color: ${ok ? 'var(--accent-green)' : 'var(--accent-red)'}">
                                    ${ok ? '🚀 KERNEL v5.7 VALIDADO' : '🛠️ FALLO EN KERNEL DETECTADO'}
                                 </h2>
                                 <p style="font-size: 1.2rem; color: var(--text-heading); margin-top: 10px;">
                                    ${passed} de ${total} Pruebas Criptográficas Superadas
                                 </p>`;
        }
        
        runSuite();
    </script>
</body>
</html>
