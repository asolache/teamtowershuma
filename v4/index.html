<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <title>TeamTowers SOS | Red de Valor</title>
    <style>
        /* --- VARIABLES GLOBALES --- */
        :root {
            --bg-base: #010409; --bg-surface: #0d1117; --bg-panel: #161b22;
            --border-color: #30363d; --text-main: #c9d1d9; --text-muted: #8b949e;
            --text-heading: #f0f6fc; --accent-blue: #58a6ff; --accent-green: #238636;
            --accent-purple: #a371f7; --accent-red: #f85149; --accent-gold: #d29922; 
            --radius-md: 8px; --radius-lg: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --transition-speed: 0.2s;
            --logo-filter: brightness(0) invert(1);
        }

        [data-theme="light"] {
            --bg-base: #f6f8fa; --bg-surface: #ffffff; --bg-panel: #f3f4f6;
            --border-color: #d0d7de; --text-main: #24292f; --text-muted: #57606a;
            --text-heading: #0f1419; --accent-blue: #0969da; --accent-green: #1a7f37;
            --logo-filter: none;
        }

        * { box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-base); color: var(--text-main); 
            margin: 0; font-family: var(--font-family); line-height: 1.5; 
            padding-top: 110px;
        }
        
        #app { min-height: calc(100vh - 110px); }

        /* 🚀 TOPBAR (Global) */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--border-color);
            z-index: 2000; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; backdrop-filter: blur(10px);
        }
        [data-theme="light"] .topbar { background: rgba(255, 255, 255, 0.95); }

        /* 🚀 TOOLBAR (Contextual & Breadcrumbs) */
        .toolbar {
            position: fixed; top: 60px; left: 0; right: 0; height: 50px;
            background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
            z-index: 1999; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 🍞 BREADCRUMB STYLING v4.1 */
        .breadcrumb-container {
            display: flex; align-items: center; gap: 8px;
            overflow: hidden; white-space: nowrap; max-width: 70%;
        }
        .breadcrumb-item {
            display: flex; align-items: center; font-size: 0.85rem; color: var(--text-muted);
        }
        .breadcrumb-item a { color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .breadcrumb-item a:hover { color: var(--accent-blue); }
        .breadcrumb-separator { margin: 0 4px; opacity: 0.3; font-size: 0.7rem; }
        
        /* El "Dónde estoy" ahora es prominente */
        .breadcrumb-current {
            font-size: 1.1rem; font-weight: 800; color: var(--text-heading);
            letter-spacing: -0.3px; padding-left: 4px;
        }

        .btn-back-nav { 
            margin-right: 8px; font-size: 1rem; text-decoration: none; 
            padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.05);
        }

        /* --- UI HELPERS --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .btn { display: inline-block; padding: 8px 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: var(--radius-md); border: 1px solid transparent; transition: all var(--transition-speed) ease; text-decoration: none; }
        .btn-primary { background-color: var(--accent-green); color: #ffffff; }
        .btn-secondary { background-color: var(--bg-panel); color: var(--text-main); border-color: var(--border-color); }
        .btn-outline { background-color: transparent; color: var(--accent-blue); border-color: var(--border-color); }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .brand-logo { filter: var(--logo-filter); height: 28px; width: auto; }
    </style>
</head>
<body>
    
    <nav class="topbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="#/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
                <img src="assets/img/logoteamtowers.png" alt="TeamTowers" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div style="display:none; width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); border-radius: 8px; align-items:center; justify-content:center; color:white; font-weight:bold; font-size: 0.8rem;">TT</div>
            </a>
        </div>
        
        <div class="dropdown" style="position: relative;">
            <button id="btn-user-menu" class="btn btn-secondary" style="display:flex; gap:10px; align-items:center; border-radius: 20px; padding: 6px 14px;">
                <span id="navbar-identity">Cargando...</span> <span style="font-size: 0.5rem;">▼</span>
            </button>
            <div id="dropdown-menu" style="display:none; position:absolute; right:0; top:100%; background:var(--bg-panel); border:1px solid var(--border-color); border-radius:12px; padding:8px; width:220px; box-shadow:0 10px 40px rgba(0,0,0,0.6); margin-top:8px;">
                <a href="#" id="menu-switch-role" style="display:block; padding:10px; color:var(--accent-blue); text-decoration:none; border-bottom:1px solid var(--border-color); font-weight:bold; font-size: 0.85rem;">🔄 Simular Nodo</a>
                <a href="#/" style="display:block; padding:10px; color:var(--text-main); text-decoration:none; font-size: 0.85rem;">🏠 Hub Global</a>
                <a href="#/user-dashboard" style="display:block; padding:10px; color:var(--text-main); text-decoration:none; font-size: 0.85rem;">👤 Tu Dashboard</a>
                <a href="#/settings" style="display:block; padding:10px; color:var(--text-main); text-decoration:none; font-size: 0.85rem;">⚙️ Configuración</a>
                <a href="#" id="btn-toggle-theme" style="display:block; padding:10px; color:var(--text-main); text-decoration:none; border-top:1px solid var(--border-color); font-size: 0.85rem;">🌗 Alternar Tema</a>
            </div>
        </div>
    </nav>

    <div id="app-toolbar" class="toolbar" style="display: none;">
        <div id="toolbar-left" style="display:flex; align-items: center; overflow: hidden;">
            </div>
        <div id="toolbar-right" style="display:flex; gap:10px; align-items: center; flex-shrink: 0;">
            </div>
    </div>

    <div id="app"></div>

    <script type="module">
        import { store } from './js/core/store.js';
        import { DashboardView } from './js/views/DashboardView.js';
        import { ProjectDashboardView } from './js/views/ProjectDashboardView.js';
        import { ProjectView } from './js/views/ProjectView.js';
        import { ProjectEditView } from './js/views/ProjectEditView.js';
        import { ProjectAccountingView } from './js/views/ProjectAccountingView.js';
        import { UserDashboardView } from './js/views/UserDashboardView.js';
        import { SettingsView } from './js/views/SettingsView.js';

        // 🍞 API DE NAVEGACIÓN v4.1 (Mejorada para visualización y truncado)
        window.setNavbar = (breadcrumbs = [], actionsLeft = '', actionsRight = '') => {
            const toolbar = document.getElementById('app-toolbar');
            const leftContainer = document.getElementById('toolbar-left');
            const rightContainer = document.getElementById('toolbar-right');
            
            if (breadcrumbs.length === 0 && !actionsLeft && !actionsRight) {
                toolbar.style.display = 'none';
                document.body.style.paddingTop = '60px';
                return;
            }

            let html = `<div class="breadcrumb-container">`;
            
            // Botón atrás inteligente
            if (breadcrumbs.length > 1) {
                html += `<a href="javascript:history.back()" class="btn-back-nav">⬅️</a>`;
            }

            breadcrumbs.forEach((item, index) => {
                const isLast = index === breadcrumbs.length - 1;
                
                if (isLast) {
                    html += `<span class="breadcrumb-current">${item.label}</span>`;
                } else {
                    // Truncado: Si hay muchos pasos, solo mostramos el texto si es el primero o el penúltimo
                    const hideLabel = breadcrumbs.length > 3 && index !== 0 && index !== breadcrumbs.length - 2;
                    html += `
                        <div class="breadcrumb-item">
                            <a href="${item.hash}">${hideLabel ? '...' : item.label}</a>
                            <span class="breadcrumb-separator">/</span>
                        </div>`;
                }
            });

            html += `</div>`;
            
            leftContainer.innerHTML = html + actionsLeft;
            rightContainer.innerHTML = actionsRight;

            toolbar.style.display = 'flex';
            document.body.style.paddingTop = '110px';
        };

        function updateIdentityBadge() {
            const state = store.getState();
            const session = state.session || { activeUserId: 'ecosystem-admin', role: 'admin' };
            const idBadge = document.getElementById('navbar-identity');
            
            if (session.role === 'admin') {
                idBadge.innerHTML = `<span style="color:var(--accent-red); font-weight:bold; font-size:0.8rem;">👑 Owner</span>`;
            } else {
                const user = state.globalUsers.find(u => u.id === session.activeUserId);
                idBadge.innerHTML = `<span style="color:var(--accent-blue); font-weight:bold; font-size:0.8rem;">👤 ${user ? user.name.split(' ')[0] : session.activeUserId}</span>`;
            }
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('dropdown-menu');
            if (e.target.closest('#btn-user-menu')) {
                dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            } else if(dropdown && !e.target.closest('#dropdown-menu')) {
                dropdown.style.display = 'none';
            }

            if (e.target.id === 'menu-switch-role') {
                e.preventDefault();
                const state = store.getState();
                if ((state.session?.role || 'admin') === 'user') {
                    store.dispatch({ type: 'LOGOUT_USER' }); window.location.hash = '#/';
                } else {
                    const id = prompt(`Simular Nodo (@id):`, state.globalUsers[0]?.id || '@user1');
                    if (id) {
                        store.dispatch({ type: 'LOGIN_USER', payload: { userId: id.startsWith('@') ? id : '@'+id } });
                        window.location.hash = `#/user-dashboard`;
                    }
                }
            }

            if (e.target.id === 'btn-toggle-theme') {
                e.preventDefault();
                const state = store.getState();
                const newTheme = state.config?.theme === 'light' ? 'dark' : 'light';
                store.dispatch({ type: 'UPDATE_GLOBAL_CONFIG', payload: { theme: newTheme } });
                if(dropdown) dropdown.style.display = 'none';
            }
        });

        function router() {
            const hash = window.location.hash || '#/';
            const parts = hash.split('/');
            const pId = parts[2];
            const action = parts[3];

            document.getElementById('app').classList.remove('fade-in');
            void document.getElementById('app').offsetWidth; 
            updateIdentityBadge();

            try {
                if (hash === '#/' || hash === '' || hash === '#') app.innerHTML = DashboardView.render();
                else if (hash === '#/settings') app.innerHTML = SettingsView.render();
                else if (hash.startsWith('#/user-dashboard')) app.innerHTML = UserDashboardView.render();
                else if (hash.startsWith('#/project/')) {
                    if (action === 'edit') app.innerHTML = ProjectEditView.render(pId);
                    else if (action === 'accounting') app.innerHTML = ProjectAccountingView.render(pId);
                    else if (action === 'map') app.innerHTML = ProjectView.render(pId);
                    else app.innerHTML = ProjectDashboardView.render(pId);
                } 
                else app.innerHTML = `<div class="container text-center"><h1>404</h1><a href="#/">Volver al Hub</a></div>`;
            } catch (e) {
                console.error("SOS Router Error:", e);
                app.innerHTML = `<div class="container"><h3>Error de Renderizado</h3><p>${e.message}</p></div>`;
            }
            document.getElementById('app').classList.add('fade-in');
        }

        window.addEventListener('hashchange', router);
        store.subscribe(() => {
            updateIdentityBadge();
            document.documentElement.setAttribute('data-theme', store.getState().config?.theme || 'dark');
        });

        if (store.getState()) {
            document.documentElement.setAttribute('data-theme', store.getState().config?.theme || 'dark'); 
            updateIdentityBadge();
            router();
        }
    </script>
</body>
</html>
