<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS v4.2 | Dashboard</title>
    <style>
        :root {
            --bg-color: #010409;
            --card-bg: #0d1117;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        #app { min-height: 100vh; }
        
        /* Transición suave entre vistas (SPA) */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="app">
        </div>

    <script type="module">
        import { store } from './js/core/store.js';
        import { HomeView } from './js/views/HomeView.js';
        import { ProjectView } from './js/views/ProjectView.js';
        import { AboutView } from './js/views/AboutView.js'; // <-- La nueva vista del Manifiesto

        const app = document.getElementById('app');

        // --- ENRUTADOR DINÁMICO ---
        function router() {
            const hash = window.location.hash || '#/';
            
            // Reiniciar animación
            app.classList.remove('fade-in');
            void app.offsetWidth; // Trigger reflow
            app.classList.add('fade-in');

            // Renderizar la vista correspondiente
            if (hash === '#/') {
                app.innerHTML = HomeView.render();
            } else if (hash === '#/about') {
                app.innerHTML = AboutView.render();
            } else if (hash.startsWith('#/project/')) {
                const projectId = hash.split('/')[2];
                app.innerHTML = ProjectView.render(projectId);
            } else {
                app.innerHTML = `
                    <div style="padding:100px; text-align:center; color:#8b949e;">
                        <h2>⚠️ 404 - Sector Desconocido</h2>
                        <p>La coordenada a la que intentas acceder no existe en el Castell.</p>
                        <a href="#/" style="color:#58a6ff; text-decoration:none;">Volver a la Base</a>
                    </div>
                `;
            }
        }

        // --- ESCUCHADORES DE EVENTOS ---
        
        // Esperamos a que el Kernel cargue la ontología y el localStorage antes de pintar nada
        window.addEventListener('store-ready', () => {
            console.log("SOS Kernel v4.2: Online y a la escucha");
            router();
        });

        // Detectar cambios en la URL para cambiar de vista sin recargar la página
        window.addEventListener('hashchange', router);

    </script>
</body>
</html>
