<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTowers SOS v4.3</title>
    <style>
        body { background: #010409; color: #c9d1d9; margin: 0; font-family: sans-serif; }
        #app { min-height: 100vh; opacity: 0; transition: opacity 0.3s; }
        .ready { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { store } from './js/core/store.js';
        import { HomeView } from './js/views/HomeView.js';
        import { ProjectView } from './js/views/ProjectView.js';
        import { AboutView } from './js/views/AboutView.js';
        import { ProjectEditView } from './js/views/ProjectEditView.js';
        import { ProjectAccountingView } from './js/views/ProjectAccountingView.js';

        const app = document.getElementById('app');

        function router() {
            const hash = window.location.hash || '#/';
            const parts = hash.split('/');
            const pId = parts[2];
            const action = parts[3];

            console.log("Navegando a:", hash);

            if (hash === '#/' || hash === '') {
                app.innerHTML = HomeView.render();
            } else if (hash === '#/about') {
                app.innerHTML = AboutView.render();
            } else if (hash.startsWith('#/project/')) {
                if (action === 'edit') {
                    app.innerHTML = ProjectEditView.render(pId);
                } else if (action === 'accounting') {
                    app.innerHTML = ProjectAccountingView.render(pId);
                } else {
                    app.innerHTML = ProjectView.render(pId);
                }
            }
            app.classList.add('ready');
        }

        // Escuchar al store y a la navegación
        window.addEventListener('hashchange', router);
        window.addEventListener('store-ready', () => {
            console.log("Store listo, cargando UI...");
            router();
        });

        // Arranque forzado si el store ya cargó
        if (store.getState().projects) router();
    </script>
</body>
</html>
