<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeamTowers SOS | V12</title>
    <link rel="stylesheet" href="/v5/css/master.css">
    <script type="module" src="/v5/js/router.js"></script>
    <style>
        :root { --bg-dark: #050507; --boot-blue: #00b0ff; --font-mono: 'Fira Code', monospace; }
        body, html { margin: 0; padding: 0; background: var(--bg-dark); height: 100%; overflow: hidden; }
        .kernel-boot {
            position: fixed; top: 0; left: 0; height: 100vh; width: 100vw; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 99999; background: radial-gradient(circle at center, #0a0a12 0%, #000 100%);
            color: var(--boot-blue); font-family: var(--font-mono);
        }
        .tower-logo { font-size: 4rem; margin-bottom: 1.5rem; animation: towerFloat 3s ease-in-out infinite; }
        .pulse-text { animation: pulse 1.5s infinite; font-size: 0.9rem; font-weight: bold; letter-spacing: 3px; }
        @keyframes towerFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #app:not(:empty) + .kernel-boot { display: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="kernel-boot">
        <div class="tower-logo">🗼</div>
        <p class="pulse-text">INITIALIZING SOS v12.0</p>
    </div>
</body>
</html>
