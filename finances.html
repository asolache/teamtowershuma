<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances · La Teva Colla</title>
    <!-- Chart.js (para futuros gráficos) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome para iconos (opcional, pero queda bien) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- MISMAS VARIABLES Y ESTILOS QUE EN INDEX.HTML Y LACOLLA.HTML ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        :root {
            --primary: #1e3a8a;
            --secondary: #4f46e5;
            --accent: #8b5cf6;
            --dark: #0f172a;
            --light: #f8fafc;
            --gold: #f59e01;
            --success: #10b981;
            --warning: #fbbf24;
            --danger: #ef4444;
            --gray: #64748b;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
        }

        body {
            background-color: #fff;
            color: #333;
            line-height: 1.6;
        }

        .language-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            background: none;
            transition: var(--transition);
        }

        .lang-btn.active {
            background: var(--gradient-primary);
            color: white;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-logo {
            height: 60px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            transition: var(--transition);
            background: var(--light);
        }

        .nav-menu a:hover {
            background: var(--gradient-primary);
            color: white;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .panel {
            background: white;
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--box-shadow);
            position: relative;
            margin-bottom: 30px;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient-primary);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .panel h2 {
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Stats bar (igual que en index) */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-around;
            background: linear-gradient(135deg, var(--light) 0%, #e0e7ff 100%);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .stat-item {
            text-align: center;
            min-width: 120px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--gray);
            font-weight: 600;
        }

        /* Lista de proyectos (similar a la de finances.html anterior) */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .project-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .project-header {
            background: var(--light);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .project-header:hover {
            background: #e0e7ff;
        }

        .project-name {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .project-token {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-type {
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }

        .type-comptable { background: #a855f7; }
        .type-participacio { background: #3b82f6; }
        .type-liquid { background: #10b981; }

        .project-details {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            display: none;
        }

        .project-details.active {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .vesting-breakdown {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }

        .vesting-item {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
        }

        .vesting-bar {
            flex: 1;
            height: 8px;
            background: #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
        }

        .vesting-progress {
            height: 100%;
            background: var(--success);
            width: 0%;
        }

        .cliff-timer {
            background: var(--warning);
            color: white;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        footer {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: rgba(255,255,255,0.85);
            padding: 40px 20px;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Selector de idioma -->
    <div class="language-selector">
        <button class="lang-btn active" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="ca">CA</button>
    </div>

    <!-- Capçalera -->
    <header>
        <div class="header-content">
            <img src="https://via.placeholder.com/60x60/1e3a8a/ffffff?text=LC" alt="La Colla" class="header-logo">
            <h1 data-i18n="title">Finances · La Teva Colla</h1>
            <p data-i18n="subtitle">Els teus actius, vesting i reputació</p>
        </div>
    </header>

    <!-- Menú de navegació (amb els noms de fitxer actuals del repositori) -->
    <nav class="nav-menu">
        <a href="index.html" data-i18n="home">Inici</a>
        <a href="lacolla.html" data-i18n="lacolla">La Colla</a>
        <a href="tokenomics.html" data-i18n="tokenomics">Tokenomics</a>
        <a href="app_comptabilitat.html" data-i18n="accounting">Comptabilitat</a>
        <a href="finances.html" data-i18n="finances">Finances</a>
        <a href="mapa.html" data-i18n="map">Mapa</a>
    </nav>

    <div class="container">
        <!-- Panel de resum personal -->
        <div class="panel">
            <h2><i class="fas fa-user"></i> <span data-i18n="welcomeUser">Hola, Anna</span></h2>
            <div class="stats-bar" id="statsBar">
                <!-- Es generarà amb JS -->
            </div>
        </div>

        <!-- Llista de projectes -->
        <div class="panel">
            <h2><i class="fas fa-project-diagram"></i> <span data-i18n="myProjects">Els meus projectes</span></h2>
            <div class="project-list" id="projectList">
                <!-- Es generarà amb JS -->
            </div>
        </div>

        <!-- Botó d'exportació (opcional) -->
        <div style="text-align: right;">
            <button class="btn-small" id="exportData" style="background: var(--accent);"><i class="fas fa-download"></i> <span data-i18n="export">Exportar dades</span></button>
        </div>
    </div>

    <footer>
        <p data-i18n="footer">© 2026 La Teva Colla · Tots els drets reservats</p>
    </footer>

    <script>
        // ---------- TRADUCCIONS ----------
        const translations = {
            es: {
                title: "Finanzas · La Teva Colla",
                subtitle: "Tus activos, vesting y reputación",
                home: "Inicio",
                lacolla: "La Colla",
                tokenomics: "Tokenomics",
                accounting: "Contabilidad",
                finances: "Finanzas",
                map: "Mapa",
                welcomeUser: "Hola, Anna",
                myProjects: "Mis proyectos",
                export: "Exportar datos",
                footer: "© 2026 La Teva Colla · Todos los derechos reservados",
                totalAssets: "Activos totales",
                inVesting: "En vesting",
                available: "Disponible",
                reputation: "Reputación",
                type: "Tipo",
                total: "Total",
                vested: "Liberado",
                nextCliff: "Próximo cliff",
                days: "días",
                release: "Liberar",
                details: "Detalles"
            },
            ca: {
                title: "Finances · La Teva Colla",
                subtitle: "Els teus actius, vesting i reputació",
                home: "Inici",
                lacolla: "La Colla",
                tokenomics: "Tokenomics",
                accounting: "Comptabilitat",
                finances: "Finances",
                map: "Mapa",
                welcomeUser: "Hola, Anna",
                myProjects: "Els meus projectes",
                export: "Exportar dades",
                footer: "© 2026 La Teva Colla · Tots els drets reservats",
                totalAssets: "Actius totals",
                inVesting: "En vesting",
                available: "Disponible",
                reputation: "Reputació",
                type: "Tipus",
                total: "Total",
                vested: "Alliberat",
                nextCliff: "Proper cliff",
                days: "dies",
                release: "Alliberar",
                details: "Detalls"
            }
        };

        // ---------- DADES D'EXEMPLE (simulen localStorage) ----------
        const userData = {
            name: "Anna",
            wallet: "0x3A2b...9Ef4",
            projects: [
                {
                    id: "proj1",
                    name: "Colla Castells 2025",
                    symbol: "CAST",
                    type: "liquid", // 'comptable', 'participacio', 'liquid'
                    totalUserTokens: 5000,
                    vested: 1200,
                    vestingSchedules: [
                        { amount: 2000, cliffEnd: Date.now() + 120 * 24 * 60 * 60 * 1000, released: 500 },
                        { amount: 3000, cliffEnd: Date.now() + 200 * 24 * 60 * 60 * 1000, released: 0 }
                    ],
                    reputationContribution: 1500
                },
                {
                    id: "proj2",
                    name: "Comunitat DeFi",
                    symbol: "DEF",
                    type: "comptable",
                    totalUserTokens: 1200,
                    vested: 1200,
                    vestingSchedules: [],
                    reputationContribution: 1200
                },
                {
                    id: "proj3",
                    name: "Horta Ecollaborativa",
                    symbol: "HORT",
                    type: "participacio",
                    totalUserTokens: 800,
                    vested: 300,
                    vestingSchedules: [
                        { amount: 800, cliffEnd: Date.now() - 10 * 24 * 60 * 60 * 1000, released: 300 }
                    ],
                    reputationContribution: 800
                }
            ],
            totalReputation: 3500
        };

        // ---------- FUNCIONS D'IDIOMA ----------
        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            localStorage.setItem('preferredLanguage', lang);
        }

        // ---------- RENDERITZAR ESTADÍSTIQUES I PROJECTES ----------
        function renderFinances() {
            const statsBar = document.getElementById('statsBar');
            const totalAssets = userData.projects.reduce((acc, p) => acc + p.totalUserTokens, 0);
            const inVesting = userData.projects.reduce((acc, p) => {
                const vestedTotal = p.vestingSchedules.reduce((sum, s) => sum + s.released, 0);
                return acc + (p.totalUserTokens - vestedTotal);
            }, 0);
            const available = totalAssets - inVesting;
            const lang = document.documentElement.lang || 'es';

            statsBar.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${totalAssets}</div>
                    <div class="stat-label">${translations[lang].totalAssets}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${inVesting}</div>
                    <div class="stat-label">${translations[lang].inVesting}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${available}</div>
                    <div class="stat-label">${translations[lang].available}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${userData.totalReputation}</div>
                    <div class="stat-label">${translations[lang].reputation}</div>
                </div>
            `;

            const projectList = document.getElementById('projectList');
            projectList.innerHTML = '';
            userData.projects.forEach(proj => {
                const card = document.createElement('div');
                card.className = 'project-card';

                const header = document.createElement('div');
                header.className = 'project-header';
                header.innerHTML = `
                    <span class="project-name">${proj.name} (${proj.symbol})</span>
                    <div class="project-token">
                        <span class="token-type type-${proj.type}">${proj.type}</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                `;
                header.addEventListener('click', () => {
                    details.classList.toggle('active');
                    header.querySelector('i').classList.toggle('fa-chevron-up');
                });

                const details = document.createElement('div');
                details.className = 'project-details';
                const totalVested = proj.vestingSchedules.reduce((acc, s) => acc + s.released, 0);
                const nextCliff = proj.vestingSchedules.find(s => s.cliffEnd > Date.now());
                const nextCliffText = nextCliff 
                    ? `<span class="cliff-timer">${Math.ceil((nextCliff.cliffEnd - Date.now()) / (1000*60*60*24))} ${translations[lang].days}</span>` 
                    : '';

                details.innerHTML = `
                    <div class="detail-row"><span>${translations[lang].total}</span> <strong>${proj.totalUserTokens}</strong></div>
                    <div class="detail-row"><span>${translations[lang].vested}</span> <strong>${totalVested}</strong></div>
                    <div class="vesting-breakdown">
                        <h4>Vesting schedule</h4>
                        ${proj.vestingSchedules.map(s => {
                            const progress = (s.released / s.amount) * 100;
                            const daysLeft = Math.ceil((s.cliffEnd - Date.now()) / (1000*60*60*24));
                            return `
                                <div class="vesting-item">
                                    <span>${s.amount} tokens</span>
                                    <div class="vesting-bar"><div class="vesting-progress" style="width:${progress}%"></div></div>
                                    <span>${daysLeft > 0 ? daysLeft + ' ' + translations[lang].days : 'Cliff passat'}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <button class="btn-small release-btn" data-proj="${proj.id}"><i class="fas fa-hand-holding-heart"></i> ${translations[lang].release}</button>
                `;

                card.appendChild(header);
                card.appendChild(details);
                projectList.appendChild(card);
            });

            // Simular botons d'alliberament
            document.querySelectorAll('.release-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    alert('Funcionalitat simulada: tokens alliberats!');
                });
            });
        }

        // ---------- EXPORTAR DADES (SIMULAT) ----------
        document.getElementById('exportData').addEventListener('click', () => {
            const dataStr = JSON.stringify(userData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `finances_${userData.wallet.slice(0,6)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // ---------- INICIALITZACIÓ ----------
        document.addEventListener('DOMContentLoaded', () => {
            let savedLang = localStorage.getItem('preferredLanguage');
            if (!savedLang) {
                savedLang = navigator.language.startsWith('ca') ? 'ca' : 'es';
            }
            setLanguage(savedLang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setLanguage(btn.dataset.lang);
                });
            });

            renderFinances();
        });
    </script>
</body>
</html>
