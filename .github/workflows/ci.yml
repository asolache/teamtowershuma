name: CI - Continuous Integration

on:
  pull_request:
    branches: [ main, feature/kb-v0.5-update ]
  push:
    branches: [ main, feature/kb-v0.5-update ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      # El SOS és un HTML autocontingut: un error de sintaxi deixa la pàgina en
      # blanc i cap altra comprovació d'aquest fitxer se n'adonava. Aquesta SÍ
      # que atura la construcció.
      - name: Sintaxi dels HTML autocontinguts
        run: node SOS/tools/check-syntax.js SOS/*.html index.html

      # La portada de l'arrel és per on entra tothom i no la comprovava res.
      # Hi mana el diccionari sobre l'HTML: una clau que hi és en català i no
      # en castellà no peta —deixa aquella frase en català per a qui llegeix en
      # castellà, i no ho veu ningú. Igual amb una clau escrita dues vegades.
      - name: Guarda de la portada (i18n de l'arrel)
        run: node SOS/tools/check-landing.js

      # El Comando es va escriure en llocs i moments diferents i cap d'ells
      # sabia dels altres: el mateix personatge tenia quatre grafies repartides
      # per l'app. Això no peta mai —només fa que qui llegeixi dues pantalles
      # cregui que hi ha dos personatges.
      - name: Guarda del relat (un sol roster d'herois)
        run: node SOS/tools/check-comando.js

      # El programa d'escola diu que és el SOS a mida d'aula. Si un superpoder
      # deixa de ser una categoria del banc de temps, o apareix un camp on
      # escriure el nom d'un infant, deixa de ser cert i no ho diu ningú.
      - name: Guarda del programa d'escola
        run: node SOS/tools/check-escola.js

      # La colla castellera surt a dos llocs: la portada i el mapa de valor.
      # Són dues còpies deliberades, i per això mateix poden divergir en
      # silenci — que és exactament el que va passar amb els herois.
      - name: Guarda del mapa de valor
        run: node SOS/tools/check-vna.js

      # Les caselles de bonus de la plaça porten el nom d'un projecte del SOS i
      # plantar-hi hi registra una aportació. Si a l'app se'n canvia el nom, la
      # casella segueix dient-lo i sona igual de real: el joc anomenaria un
      # projecte que ja no existeix i no petaria res.
      - name: Guarda del joc (caselles d'aportació)
        run: node SOS/tools/check-joc.js

      # La Compra dona xifres de diners que algú farà servir per parlar amb un
      # pagès. Una afirmació que la pàgina fa i les dades no sostenen —el 80%
      # de proximitat, un «estalvi» que no ho és— no és un error de format: és
      # fer quedar malament un grup davant de qui li ven.
      - name: Guarda de La Compra (preus i regla del 80%)
        run: node SOS/tools/check-compra.js

      # El SOS ha crescut sempre per addició. Aquesta guarda no prohibeix
      # créixer: obliga que créixer sigui una decisió escrita, no un descuit.
      # Puja un sostre a SOS/tools/check-kiss.js i digues per què al commit.
      - name: Guarda de KISS (pes, guies, superfícies)
        run: node SOS/tools/check-kiss.js

      # El text català incrustat creix a cada tanda de feina. Aquesta guarda no
      # falla per cobertura baixa —seria mentir sobre l'estat real—: la fa
      # visible a cada PR, i falla només si el diccionari ha deixat de quadrar
      # amb el codi.
      - name: Guarda de la segona llengua
        run: node SOS/tools/check-i18n.js

      # SOS/vedes.html es genera des de SOS/knowledge/codex.md i es guarda al
      # repositori perquè el lloc és estàtic i sense passos de construcció. El
      # preu és que pot quedar-se enrere: aquesta guarda ho impedeix. Si falla,
      # corre `node SOS/tools/build-vedes.js` i torna a fer commit.
      - name: La pàgina dels vedes correspon al codex
        run: node SOS/tools/build-vedes.js --check

      # `formacio.html` és la font única de la docència i FORMACIO_MODULES només
      # n'és l'esquelet referenciable. Que siguin dues coses està bé; que es
      # desincronitzin en silenci, no —la pàgina va arribar a tenir 16 mòduls
      # amb l'app modelant-ne 8, i els vuit del Bloc B eren invisibles.
      - name: L'esquelet de la formació correspon a la docència
        run: node SOS/tools/check-formacio.js

      - name: Install dependencies
        run: if [ -f package.json ]; then npm ci; fi
      - name: Run tests
        run: if [ -f package.json ]; then npm test || echo "No tests"; fi
        continue-on-error: true
      - name: Validate HTML
        run: find . -name "*.html" -not -path "./node_modules/*" | head -5
        continue-on-error: true
      - name: Check common-model.js
        run: if [ -f common-model.js ]; then node -c common-model.js; fi
        continue-on-error: true
