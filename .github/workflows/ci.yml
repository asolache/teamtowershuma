name: CI - Continuous Integration

on:
  pull_request:
    branches: [ main, feature/kb-v0.5-update ]
  push:
    branches: [ main, feature/kb-v0.5-update ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      # El SOS és un HTML autocontingut: un error de sintaxi deixa la pàgina en
      # blanc i cap altra comprovació d'aquest fitxer se n'adonava. Aquesta SÍ
      # que atura la construcció.
      - name: Sintaxi dels HTML autocontinguts
        run: node SOS/tools/check-syntax.js SOS/*.html

      # El SOS ha crescut sempre per addició. Aquesta guarda no prohibeix
      # créixer: obliga que créixer sigui una decisió escrita, no un descuit.
      # Puja un sostre a SOS/tools/check-kiss.js i digues per què al commit.
      - name: Guarda de KISS (pes, guies, superfícies)
        run: node SOS/tools/check-kiss.js

      - name: Install dependencies
        run: if [ -f package.json ]; then npm ci; fi
      - name: Run tests
        run: if [ -f package.json ]; then npm test || echo "No tests"; fi
        continue-on-error: true
      - name: Validate HTML
        run: find . -name "*.html" -not -path "./node_modules/*" | head -5
        continue-on-error: true
      - name: Check common-model.js
        run: if [ -f common-model.js ]; then node -c common-model.js; fi
        continue-on-error: true
