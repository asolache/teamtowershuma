# El banc de proves de la IA (SOS/tools/banc-ia.mjs): la mateixa feina a
# Claude, GPT, Gemini i DeepSeek, amb nota a cegues. Només a mà, des de
# Actions → «Banc de proves de la IA» → Run workflow. No desplega res.
# Les claus són secrets del repositori; qui no en té, no entra.
name: Banc de proves de la IA

on:
  workflow_dispatch:
    inputs:
      tasca:
        description: 'Només una feina (classifica, resumeix, escriu, tradueix, estrategia) o buit per a totes'
        required: false
        default: ''
      eina:
        description: 'banc-ia (models), banc-mapes (mapes de valor) o diagnosi-ux (pantalles del SOS)'
        required: false
        default: 'banc-ia'
      ordres:
        description: 'banc-mapes: les ordres, p. ex. «corre --variant actual --tope 15» (separa passos amb ;)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: El banc de mapes
        if: ${{ inputs.eina == 'banc-mapes' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORDRES: ${{ inputs.ordres }}
        run: |
          mkdir -p banc-ia
          IFS=';' read -ra PASSOS <<< "$ORDRES"
          for p in "${PASSOS[@]}"; do
            p="$(echo "$p" | xargs)"; [ -z "$p" ] && continue
            read -ra A <<< "$p"
            node SOS/tools/banc-mapes.mjs "${A[@]}" --sortida banc-ia
          done
          cp SOS/knowledge/vna/banc-mapes/*.json banc-ia/ 2>/dev/null || true
          [ -f banc-ia/informe.md ] && cat banc-ia/informe.md >> "$GITHUB_STEP_SUMMARY" || true
      # Els resultats del banc de mapes tornen a la mateixa branca (mai a main):
      # casos i oficis al seu lloc, i cada execució a resultats/<data>-<run>/.
      - name: Desa els resultats a la branca
        if: ${{ inputs.eina == 'banc-mapes' && github.ref != 'refs/heads/main' }}
        run: |
          R="SOS/knowledge/vna/banc-mapes/resultats/$(date -u +%Y%m%d-%H%M)-${{ github.run_id }}"
          mkdir -p "$R"
          for f in respostes.json notes.json notes-final.json simulacio.json informe.md; do [ -f "banc-ia/$f" ] && cp "banc-ia/$f" "$R/"; done
          git config user.name "banc-mapes"
          git config user.email "banc-mapes@users.noreply.github.com"
          # El mapa del cervell compta les mides: es refà amb els resultats nous (si no, el CI peta).
          node SOS/tools/cervell.js > /dev/null
          git add SOS/knowledge/vna/banc-mapes SOS/knowledge/MAPA.md
          git diff --cached --quiet && exit 0
          git commit -m "banc-mapes: resultats de ${{ github.run_id }} (${{ inputs.ordres }})"
          # Si una altra execució ha tocat el mateix fitxer (oficis.json), guanya la d'ara.
          ok=0; for i in 1 2 3 4 5; do git rebase --abort 2>/dev/null || true; git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && node SOS/tools/cervell.js > /dev/null && { git diff --quiet SOS/knowledge/MAPA.md || git commit -qam "Cervell: MAPA.md al dia"; } && git push -q origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; sleep $((i*3)); done
          [ "$ok" = 1 ] || { echo "no s'han pogut desar els resultats"; exit 1; }
      # Diagnòstic d'UX: captura totes les pantalles de l'app i les fa mirar a la IA.
      # L'informe torna a la branca (mai a main); les captures, com a artefacte.
      - name: Diagnòstic d'UX
        if: ${{ inputs.eina == 'diagnosi-ux' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORDRES: ${{ inputs.ordres }}
        run: |
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.63.0 && npx playwright install --with-deps chromium >/dev/null)
          ln -sfn /tmp/pw/node_modules node_modules
          node SOS/tools/captura-ux.mjs banc-ia/captures
          read -ra A <<< "$ORDRES"
          node SOS/tools/diagnosi-ux.mjs banc-ia/captures "${A[@]}"
          cat banc-ia/captures/informe-ux.md >> "$GITHUB_STEP_SUMMARY"
          rm -f node_modules
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            R="SOS/knowledge/dev/diagnosi-ux/$(date -u +%Y%m%d-%H%M)-${{ github.run_id }}"
            mkdir -p "$R" && cp banc-ia/captures/informe-ux.md banc-ia/captures/diagnosi-ux.json banc-ia/captures/inventari.json "$R/"
            git config user.name "diagnosi-ux"
            git config user.email "diagnosi-ux@users.noreply.github.com"
            node SOS/tools/cervell.js > /dev/null
            git add "$R" SOS/knowledge/MAPA.md
            git commit -qm "diagnosi-ux: informe de ${{ github.run_id }}"
            for i in 1 2 3 4 5; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && node SOS/tools/cervell.js > /dev/null && { git diff --quiet SOS/knowledge/MAPA.md || git commit -qam "Cervell: MAPA.md al dia"; } && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*3)); done
          fi
      - name: El banc
        if: ${{ inputs.eina != 'banc-mapes' && inputs.eina != 'diagnosi-ux' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BANC_MODEL_OPENAI: ${{ vars.BANC_MODEL_OPENAI }}
          BANC_MODEL_GEMINI: ${{ vars.BANC_MODEL_GEMINI }}
          BANC_MODEL_DEEPSEEK: ${{ vars.BANC_MODEL_DEEPSEEK }}
          BANC_PREU_OPENAI: ${{ vars.BANC_PREU_OPENAI }}
          BANC_PREU_GEMINI: ${{ vars.BANC_PREU_GEMINI }}
          BANC_PREU_DEEPSEEK: ${{ vars.BANC_PREU_DEEPSEEK }}
          TASCA: ${{ inputs.tasca }}
        run: |
          if [ -n "$TASCA" ]; then node SOS/tools/banc-ia.mjs --tasca "$TASCA" --sortida banc-ia; else node SOS/tools/banc-ia.mjs --sortida banc-ia; fi
          cat banc-ia/informe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: banc-ia
          path: banc-ia/
