[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."anthropic-proxy"]
  timeout = 26

# Forzar revalidación de JS modules en cada request
[[headers]]
  for = "/ia/dev/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/ia/dev/styles/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/ia/dev/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/ia/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/v9/*"
  to     = "/v9/index.html"
  status = 200

[[redirects]]
  from   = "/v8/*"
  to     = "/v8/index.html"
  status = 200
