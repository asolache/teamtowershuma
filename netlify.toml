[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."anthropic-proxy"]
  timeout = 26

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/ia/dev/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/ia/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/v9/*"
  to     = "/v9/index.html"
  status = 200

[[redirects]]
  from   = "/v8/*"
  to     = "/v8/index.html"
  status = 200
