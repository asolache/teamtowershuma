[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# ── Forzar revalidación de JS modules ──────────────────────────
[[headers]]
  for = "/ia/dev/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/ia/dev/styles/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ── SPA redirects (orden: más específico primero) ──────────────
[[redirects]]
  from   = "/ia/dev/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/ia/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/v9/*"
  to     = "/v9/index.html"
  status = 200

[[redirects]]
  from   = "/v8/*"
  to     = "/v8/index.html"
  status = 200
