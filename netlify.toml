[build]
  publish   = "."
  functions = "netlify/functions"

# ── Edge Functions (proxy Anthropic sin CORS, sin timeout 504) ──
[edge_functions]
  directory = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"

# Forzar revalidación de JS modules en cada request
[[headers]]
  for = "/ia/dev/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/ia/dev/styles/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ── Ruta del proxy → Edge Function (debe ir ANTES de los redirects SPA) ──
[[edge_functions]]
  path     = "/api/anthropic-proxy"
  function = "anthropic-proxy"

[[redirects]]
  from   = "/ia/dev/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/ia/*"
  to     = "/ia/dev/index.html"
  status = 200

[[redirects]]
  from   = "/v9/*"
  to     = "/v9/index.html"
  status = 200

[[redirects]]
  from   = "/v8/*"
  to     = "/v8/index.html"
  status = 200
