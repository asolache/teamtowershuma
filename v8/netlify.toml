# Archivo Maestro de Configuración de Netlify

# Redirección específica para el motor V8
[[redirects]]
  from = "/v8/*"
  to = "/v8/index.html"
  status = 200
  force = true

# (Opcional) Si quieres que tu V7 antigua siga funcionando, déjale su regla:
[[redirects]]
  from = "/v7/*"
  to = "/v7/index.html"
  status = 200
  force = true
