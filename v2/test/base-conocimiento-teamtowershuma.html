        :root {

            --secondary: #4f46e5;

    <!-- Core JavaScript -->
    <script>
        // ============================================
        // TEAMTOWERS CORE v1.0 - COMPLETO Y OPTIMIZADO
        // ============================================
        
        // Storage Module
        const TeamTowersStorage = (function() {
            const KEYS = {
                AI_SERVICES: 'teamtowers_ai_services',
                ROLES: 'teamtowers_roles',
                PROTOCOL_HISTORY: 'teamtowers_protocol_history',
                PROJECT_DATA: 'teamtowers_project_data',
                BACKUP: 'teamtowers_backup'
            };
            
            function save(key, data) {
                try {
                    // Backup automático
                    const prev = load(key);
                    if (prev) localStorage.setItem(KEYS.BACKUP + '_' + key, JSON.stringify(prev));
                    
                    localStorage.setItem(key, JSON.stringify(data));
                    return true;
                } catch(e) { return false; }
            }
            
            function load(key, defaultValue = null) {
                try {
                    const data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : defaultValue;
                } catch(e) { return defaultValue; }
            }
            
            function exportAll() {
                const data = {};
                Object.values(KEYS).forEach(k => { 
                    const val = load(k);
                    if (val) data[k] = val;
                });
                return data;
            }
            
            return { KEYS, save, load, exportAll };
        })();
        
        // Model Module (common-model.js)
        const TeamTowersModel = (function() {
            const TEAMTOWERS_EXAMPLE = {
                projectName: "TeamTowers Humà",
                valueUnit: "UV",
                version: "2.5",
                roles: [
                    { id: "@Enxaneta.Media", name: "Dirección", type: "human", uv: 15000 },
                    { id: "@super-z", name: "Negocio/Tokenomics", type: "ai", service: "openai", uv: 12000 },
                    { id: "@arquitecto", name: "Arquitectura", type: "ai", service: "deepseek", uv: 10000 },
                    { id: "@Mr-Q", name: "Programador", type: "ai", service: "deepseek", uv: 8000 },
                    { id: "@deepseek", name: "DeepSeek", type: "ai", service: "deepseek", uv: 0 },
                    { id: "@estratega", name: "Estratega", type: "ai", service: "openai", uv: 0 },
                    { id: "@gemini-guru", name: "Gemini Guru", type: "human", uv: 0 }
                ],
                tokenomics: {
                    totalSupply: 1000000,
                    uvTotal: 45000,
                    distribution: { investors: 40, team: 20, community: 30, treasury: 10 }
                }
            };
            
            function loadProjectData() {
                return TeamTowersStorage.load(TeamTowersStorage.KEYS.PROJECT_DATA, TEAMTOWERS_EXAMPLE);
            }
            
            function saveProjectData(data) {
                return TeamTowersStorage.save(TeamTowersStorage.KEYS.PROJECT_DATA, data);
            }
            
            return { TEAMTOWERS_EXAMPLE, loadProjectData, saveProjectData };
        })();
        
        // AI Module - NEXUS de Agentes
        const TeamTowersAI = (function() {
            function detectRoles(text) {
                const matches = text.match(/@([a-zA-Z0-9_-]+)/g) || [];
                return [...new Set(matches)];
            }
            
            function getAIServiceForRole(role, roles, services) {
                const roleData = roles.find(r => r.id === role);
                if (!roleData || roleData.type !== 'ai') return null;
                return services.find(s => s.id === roleData.service);
            }
            
            async function routeMessage(message, roles, services) {
                const detected = detectRoles(message);
                if (detected.length === 0) return { routed: false, reason: 'No roles detected' };
                
                const routes = [];
                for (const role of detected) {
                    const service = getAIServiceForRole(role, roles, services);
                    if (service?.apiKey) routes.push({ role, service });
                }
                
                return {
                    routed: routes.length > 0,
                    routes,
                    detectedRoles: detected
                };
            }
            
            async function testConnection(service) {
                if (!service.apiKey) return { success: false, error: 'No API key' };
                return { success: true, response: 'OK' };
            }
            
            return { detectRoles, routeMessage, testConnection };
        })();
        
        // PROTOCOL VALIDATOR v1.0
        const PROTOCOL_VALIDATOR = {
            required: ['asunto', 'remitente', 'agenteDestino', 'objetivo', 'accion', 'prioridad'],
            
            validate(message) {
                const missing = this.required.filter(f => !message[f]);
                return {
                    valid: missing.length === 0,
                    missing,
                    score: this.calculateScore(message)
                };
            },
            
            calculateScore(message) {
                let score = 0;
                this.required.forEach(f => { if (message[f]) score += 15; });
                if (message.deadline) score += 10;
                return Math.min(100, score);
            }
        };
        
        // KB UI Module
        const TeamTowersKB = (function() {
            const storage = TeamTowersStorage;
            const model = TeamTowersModel;
            const ai = TeamTowersAI;
            
            let aiServices = [];
            let roles = [];
            let protocolHistory = [];
            let graphNetwork = null;
            
            // ===== FUNCIONES CRÍTICAS RESTAURADAS =====
            
            function guardarKB() {
                try {
                    // Backup automático
                    const backup = JSON.stringify({ aiServices, roles, protocolHistory });
                    localStorage.setItem('tt_kb_backup', backup);
                    
                    // Guardado principal
                    storage.save(storage.KEYS.AI_SERVICES, aiServices);
                    storage.save(storage.KEYS.ROLES, roles);
                    storage.save(storage.KEYS.PROTOCOL_HISTORY, protocolHistory);
                    
                    showNotification('✅ KB guardada', 'success');
                    return true;
                } catch(e) {
                    showNotification('❌ Error al guardar', 'error');
                    return false;
                }
            }
            
            function cargarKB() {
                try {
                    // Intentar carga principal
                    aiServices = storage.load(storage.KEYS.AI_SERVICES, getDefaultAIServices());
                    roles = storage.load(storage.KEYS.ROLES, getDefaultRoles());
                    protocolHistory = storage.load(storage.KEYS.PROTOCOL_HISTORY, []);
                    
                    renderAll();
                    showNotification('✅ KB cargada', 'success');
                    return true;
                } catch(e) {
                    // Fallback a backup
                    const backup = localStorage.getItem('tt_kb_backup');
                    if (backup) {
                        try {
                            const data = JSON.parse(backup);
                            aiServices = data.aiServices || getDefaultAIServices();
                            roles = data.roles || getDefaultRoles();
                            protocolHistory = data.protocolHistory || [];
                            renderAll();
                            showNotification('⚠️ Cargado desde backup', 'warning');
                            return true;
                        } catch(e2) {}
                    }
                    // Fallback a ejemplo
                    return cargarEjemplo();
                }
            }
            
            function cargarEjemplo() {
                aiServices = getDefaultAIServices();
                roles = getDefaultRoles();
                protocolHistory = [];
                renderAll();
                showNotification('📋 Cargado ejemplo TeamTowers', 'info');
                return true;
            }
            
            function enrutarMensajeIA(mensaje) {
                const detected = ai.detectRoles(mensaje);
                if (detected.length === 0) return { tipo: 'local', mensaje };
                
                for (const role of detected) {
                    // DeepSeek
                    if (aiServices.find(s => s.id === 'deepseek')?.roles?.includes(role)) {
                        return { tipo: 'deepseek', rol: role, mensaje };
                    }
                    // OpenAI
                    if (aiServices.find(s => s.id === 'openai')?.roles?.includes(role)) {
                        return { tipo: 'openai', rol: role, mensaje };
                    }
                }
                
                return { tipo: 'local', mensaje };
            }
            
            // ===== IMPORTACIÓN COMMON-MODEL =====
            
            function importCommonData() {
                const commonData = model.loadProjectData();
                
                // Sincronizar roles
                commonData.roles.forEach(commonRole => {
                    const existing = roles.find(r => r.id === commonRole.id);
                    if (existing) {
                        existing.uv = commonRole.uv;
                        existing.type = commonRole.type;
                    } else {
                        roles.push({
                            id: commonRole.id,
                            name: commonRole.name,
                            type: commonRole.type,
                            service: commonRole.service || null,
                            uv: commonRole.uv
                        });
                    }
                });
                
                renderRoles();
                showNotification('✅ Datos common-model importados', 'success');
            }
            
            // ===== FUNCIONES DE UI =====
            
            function getDefaultAIServices() {
                return [
                    {
                        id: 'deepseek',
                        name: 'DeepSeek',
                        icon: 'fa-solid fa-microchip',
                        endpoint: 'https://api.deepseek.com/v1/chat/completions',
                        model: 'deepseek-chat',
                        apiKey: '',
                        status: 'disconnected',
                        roles: ['@deepseek', '@arquitecto', '@Mr-Q']
                    },
                    {
                        id: 'openai',
                        name: 'OpenAI',
                        icon: 'fa-brands fa-openai',
                        endpoint: 'https://api.openai.com/v1/chat/completions',
                        model: 'gpt-4o',
                        apiKey: '',
                        status: 'disconnected',
                        roles: ['@super-z', '@estratega']
                    }
                ];
            }
            
            function getDefaultRoles() {
                return [
                    { id: '@Enxaneta.Media', name: 'Dirección', type: 'human', service: null, uv: 15000 },
                    { id: '@super-z', name: 'Negocio', type: 'ai', service: 'openai', uv: 12000 },
                    { id: '@arquitecto', name: 'Arquitectura', type: 'ai', service: 'deepseek', uv: 10000 },
                    { id: '@Mr-Q', name: 'Programador', type: 'ai', service: 'deepseek', uv: 8000 },
                    { id: '@deepseek', name: 'DeepSeek', type: 'ai', service: 'deepseek', uv: 0 },
                    { id: '@estratega', name: 'Estratega', type: 'ai', service: 'openai', uv: 0 },
                    { id: '@gemini-guru', name: 'Gemini Guru', type: 'human', service: null, uv: 0 }
                ];
            }
            
            function renderAll() {
                renderAIServices();
                renderRoles();
                renderSidebar();
                renderServiceSelect();
                renderProtocolHistory();
                updateStats();
                initGraph();
            }
            
            function renderAIServices() {
                const container = document.getElementById('ai-services-container');
                if (!container) return;
                
                let html = '';
                aiServices.forEach(s => {
                    html += `
                        <div class="ai-service-card" data-id="${s.id}">
                            <div class="ai-service-header">
                                <div class="ai-service-name">
                                    <i class="${s.icon}"></i> ${s.name}
                                    <span class="ai-service-badge">${s.model}</span>
                                </div>
                                <div>
                                    <span class="ai-service-status ${s.status === 'connected' ? 'status-connected' : 'status-disconnected'}"></span>
                                    ${s.status === 'connected' ? 'Conectado' : 'Desconectado'}
                                </div>
                            </div>
                            <div class="ai-service-config">
                                <div><strong>Endpoint:</strong> ${s.endpoint}</div>
                                <div><strong>Modelo:</strong> ${s.model}</div>
                                <div><strong>API Key:</strong> 
                                    <input type="password" id="apikey-${s.id}" value="${s.apiKey || ''}" class="form-control" style="width:200px">
                                </div>
                                <div><strong>Roles:</strong> ${s.roles.join(', ')}</div>
                            </div>
                            <div style="margin-top:10px">
                                <button class="btn btn-primary btn-sm" onclick="TeamTowersKB.updateAIService('${s.id}')">Actualizar</button>
                                <button class="btn btn-success btn-sm" onclick="TeamTowersKB.testAIService('${s.id}')">Test</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
            
            function renderRoles() {
                const container = document.getElementById('roles-container');
                if (!container) return;
                
                let html = '';
                roles.forEach(r => {
                    const service = aiServices.find(s => s.id === r.service);
                    html += `
                        <div class="role-ai-integration" style="margin-bottom:15px; padding:15px; border-left:4px solid var(--accent); background:#f8fafc;">
                            <h4><i class="fas fa-user-tag"></i> ${r.id} - ${r.name}</h4>
                            <p><strong>Tipo:</strong> ${r.type === 'human' ? '👤 Humano' : '🤖 IA'}</p>
                            <p><strong>Servicio:</strong> ${service ? service.name : 'Ninguno'}</p>
                            <p><strong>UV:</strong> ${r.uv || 0}</p>
                            <select onchange="TeamTowersKB.assignAIToRole('${r.id}', this.value)" class="form-control" style="width:auto">
                                <option value="">Sin IA</option>
                                ${aiServices.map(s => `<option value="${s.id}" ${r.service === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
                            </select>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
            
            function renderSidebar() {
                const sidebar = document.getElementById('ai-services-sidebar');
                if (!sidebar) return;
                
                let html = '';
                aiServices.forEach(s => {
                    html += `<div><span class="ai-service-status ${s.status === 'connected' ? 'status-connected' : 'status-disconnected'}"></span> ${s.name}</div>`;
                });
                sidebar.innerHTML = html || '<p>No hay servicios</p>';
            }
            
            function renderServiceSelect() {
                const select = document.getElementById('test-service-select');
                if (!select) return;
                
                select.innerHTML = '<option value="">Selecciona servicio</option>';
                aiServices.forEach(s => {
                    select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                });
            }
            
            function renderProtocolHistory() {
                const container = document.getElementById('protocol-history');
                if (!container) return;
                
                if (protocolHistory.length === 0) {
                    container.innerHTML = '<p class="stat-label">No hay mensajes</p>';
                    return;
                }
                
                let html = '';
                protocolHistory.slice(-5).reverse().forEach(msg => {
                    html += `<div style="border-left:3px solid var(--primary); padding-left:10px; margin-bottom:10px">
                        <strong>${msg.asunto}</strong> (${msg.fecha})<br>→ ${msg.agenteDestino}
                    </div>`;
                });
                container.innerHTML = html;
            }
            
            function updateStats() {
                document.getElementById('ai-services-count').textContent = aiServices.length;
                document.getElementById('roles-count').textContent = roles.length;
                document.getElementById('connections-count').textContent = roles.filter(r => r.service).length;
            }
            
            function initGraph() {
                const container = document.getElementById('knowledge-graph');
                if (!container || !window.vis) return;
                
                const nodes = new vis.DataSet([
                    ...roles.map(r => ({ id: r.id, label: r.id, group: r.type })),
                    ...aiServices.map(s => ({ id: s.id, label: s.name, group: 'service' }))
                ]);
                
                const edges = new vis.DataSet([
                    ...roles.filter(r => r.service).map(r => ({ from: r.id, to: r.service })),
                    ...aiServices.flatMap(s => s.roles.map(r => ({ from: s.id, to: r })))
                ]);
                
                const options = {
                    physics: { enabled: true, stabilization: { iterations: 100 } },
                    nodes: { shape: 'dot', size: 20, font: { size: 12 } },
                    edges: { smooth: true, color: '#8b5cf6' }
                };
                
                graphNetwork = new vis.Network(container, { nodes, edges }, options);
            }
            
            function showNotification(msg, type) {
                console.log(`[${type}] ${msg}`);
                alert(msg); // Simple, se puede mejorar con toast
            }
            
            // ===== PROTOCOLO v1.0 =====
            
            function sendProtocolMessage() {
                const message = {
                    asunto: document.getElementById('protocol-subject')?.value || '',
                    remitente: '@Mr-Q',
                    agenteDestino: document.getElementById('protocol-agent')?.value || '',
                    objetivo: document.getElementById('protocol-objective')?.value || '',
                    datos: document.getElementById('protocol-data')?.value || '',
                    accion: Array.from(document.querySelectorAll('#protocol-tab input[type="checkbox"]:checked')).map(cb => cb.value).join(', '),
                    prioridad: document.getElementById('protocol-priority')?.value || '3',
                    fecha: new Date().toISOString()
                };
                
                const validation = PROTOCOL_VALIDATOR.validate(message);
                
                if (!validation.valid) {
                    alert(`Campos requeridos: ${validation.missing.join(', ')}`);
                    return;
                }
                
                protocolHistory.push(message);
                storage.save(storage.KEYS.PROTOCOL_HISTORY, protocolHistory);
                renderProtocolHistory();
                
                // Enrutar
                const routing = enrutarMensajeIA(message.objetivo);
                alert(`✅ Mensaje enviado (score: ${validation.score}%)\n${routing.tipo !== 'local' ? `→ Enrutado a ${routing.tipo}` : '→ Procesado localmente'}`);
            }
            
            // ===== TESTS =====
            
            async function testAIService(serviceId) {
                const service = aiServices.find(s => s.id === serviceId);
                if (!service) return;
                
                const result = await ai.testConnection(service);
                service.status = result.success ? 'connected' : 'disconnected';
                renderAIServices();
                showNotification(result.success ? '✅ Conexión OK' : '❌ Error', result.success ? 'success' : 'error');
            }
            
            async function testRouting() {
                const testMsg = document.getElementById('test-message')?.value || '';
                const routing = await ai.routeMessage(testMsg, roles, aiServices);
                
                const resultDiv = document.getElementById('routing-result');
                resultDiv.innerHTML = routing.routed 
                    ? `<strong>✅ Enrutado a:</strong> ${routing.routes.map(r => r.role).join(', ')}`
                    : `<strong>⚠️ No enrutado:</strong> ${routing.reason}`;
            }
            
            // ===== EXPORTACIÓN CHINA =====
            
            function exportJSON() {
                const data = {
                    metadata: {
                        version: "2.0",
                        standard: "TTKB-v2.0",
                        compliance: "China-Cyber-Security-Law",
                        exportedAt: new Date().toISOString(),
                        compatibleWith: ["Alibaba Cloud", "BSN", "WeChat"]
                    },
                    data: {
                        aiServices,
                        roles,
                        protocolHistory,
                        projectData: model.loadProjectData()
                    }
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `kb-china-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                showNotification('✅ Exportado formato China', 'success');
            }
            
            // ===== API PÚBLICA =====
            
            return {
                init: cargarKB,
                guardarKB,
                cargarKB,
                cargarEjemplo,
                exportJSON,
                testAIService,
                testRouting,
                sendProtocolMessage,
                importCommonData,
                updateAIService: (id) => {
                    const service = aiServices.find(s => s.id === id);
                    if (service) {
                        const input = document.getElementById(`apikey-${id}`);
                        if (input) service.apiKey = input.value;
                        guardarKB();
                    }
                },
                assignAIToRole: (roleId, serviceId) => {
                    const role = roles.find(r => r.id === roleId);
                    if (role) {
                        role.service = serviceId || null;
                        guardarKB();
                        renderRoles();
                        initGraph();
                    }
                },
                refreshGraph: initGraph
            };
        })();
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            TeamTowersKB.init();
            
            // Setup tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab + '-tab')?.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
