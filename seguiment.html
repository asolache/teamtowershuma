<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguiment de la proposta | TeamTowers Humà</title>
    <meta name="description" content="Com van les propostes per al vostre esdeveniment amb TeamTowers Humà.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" content="Álvaro Solache · TeamTowers Humà">
    <meta name="referrer" content="no-referrer">
    <!-- El seguiment d'una proposta, sense entrar: /seguiment/<id>/<clau>.
         Les dades no són d'aquí: les dona eventspenedes.com/seguimiento amb
         ?formato=json, que és l'única font (el mateix enllaç allà es pinta amb
         l'estil d'Events Penedès). Sense preus: la proposta amb preu arriba
         per correu. -->
    <link rel="stylesheet" href="/SOS/fonts/fonts.css">
    <style>
        :root {
/*TT-PELL*/
  --bg           : #fbfaf7;   /* el paper */
  --panel        : #f4f1ea;   /* el fons d'un bloc */
  --card         : #ffffff;   /* una targeta, que és el més clar */
  --text         : #15130f;   /* la tinta */
  --light        : #4a463e;   /* text secundari · 9,1:1 */
  --muted        : #5e594d;   /* text apagat · 6,8:1 · i 5,7 sobre un fons tenyit */
  --border       : #ddd7c8;   /* la vora */
  --border-strong: #cac3b0;   /* la vora que s'ha de veure */
  --indigo       : #4f46e5;   /* 6,1:1 */
  --blue         : #005795;   /* tangible · 6,2:1 · i 5,3 sobre un vel del seu to */
  --purple       : #a3187f;   /* intangible · 6,8:1 */
  --green        : #0c6640;   /* 5,9:1 · i 5,4 sobre un vel del seu to */
  --orange       : #9c4408;   /* 5,9:1 · i 5,0 sobre --panel */
  --red          : #c0392b;   /* 5,2:1 */
  --gold         : #8a6000;   /* 5,3:1 */
  --on-accent    : #ffffff;   /* text a sobre d'un accent ple */
  --mono         : 'SF Mono',Monaco,Consolas,monospace;
  --t0           : .9375rem;   /* 15 px · el terra */
  --t1           : 1.0625rem;   /* 17 px · el cos */
  --t2           : 1.25rem;
  --t3           : clamp(1.3rem,2.4vw,1.65rem);
  --t4           : clamp(1.75rem,4vw,2.6rem);
  --t5           : clamp(2.1rem,6vw,3.5rem);
/*/TT-PELL*/
            --sans: 'Space Grotesk', system-ui, sans-serif;
        }
/*TT-COMPONENTS*/
/* GENERAT per SOS/tools/build-components.js · no s'edita a mà: hi ha guarda. */
/* Botons · guia de marca §6: un primari per pantalla, la resta amb vora, i
   44 px d'alçada sempre. */
.btn,.btn-primary,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:44px;padding:.7rem 1.35rem;border:1px solid var(--border-strong);border-radius:10px;
  background:var(--card);color:var(--text);font:inherit;font-size:var(--t0);font-weight:600;line-height:1.25;
  text-align:center;text-decoration:none;cursor:pointer;touch-action:manipulation;
  transition:background-color .15s,border-color .15s,color .15s}
.btn:hover,.btn-ghost:hover{border-color:var(--indigo);color:var(--indigo)}
.btn-ghost{background:transparent}
.btn-primary{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent)}
.btn-primary:hover{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn-sm{padding:.45rem .85rem}
.btn:focus-visible,.btn-primary:focus-visible,.btn-ghost:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.btn:disabled,.btn-primary:disabled,.btn-ghost:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
/* `display:inline-flex` guanya al `[hidden]` del navegador: sense això, un
   botó amagat amb l'atribut es veuria. */
.btn[hidden],.btn-primary[hidden],.btn-ghost[hidden]{display:none}
/* La capçalera d'una secció: etiqueta, títol i entradeta. */
.section-header{text-align:center;max-width:720px;margin:0 auto 5rem}
.section-eyebrow{font-family:var(--mono);font-size:var(--t0);letter-spacing:.06em;color:var(--indigo);
  text-transform:uppercase;margin-bottom:1.25rem}
.section-header h2{font-size:clamp(2.1rem,4vw,3.2rem);font-weight:700;line-height:1.15;margin-bottom:1.25rem}
.section-header h2 em{font-style:normal;color:var(--blue)}
.section-header p{font-size:var(--t1);color:var(--light);line-height:1.8}
/* La targeta: la de «Tres serveis» de la portada n'és el model. Guia §6:
   radi de 10 a 14 px i la vora de la pell. */
.targeta{display:flex;flex-direction:column;gap:.6rem;padding:1.6rem 1.5rem;
  background:var(--card);border:1px solid var(--border);border-radius:14px}
.targeta-k{font-family:var(--mono);font-size:var(--t0);letter-spacing:.06em;color:var(--indigo);font-weight:600}
.targeta-t{font-size:var(--t2);font-weight:650;color:var(--text);line-height:1.3;margin:0}
.targeta-d{font-size:var(--t0);color:var(--light);line-height:1.6;margin:0}
/*/TT-COMPONENTS*/
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .container { max-width: 860px; margin: 0 auto; padding: 0 2rem; }
        @media (max-width: 600px) { .container { padding: 0 1rem; } }
        .sg-marca { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .sg-marca a { color: var(--text); font-weight: 700; text-decoration: none; }
        .sg-marca a span { color: var(--indigo); }
        .lang-b { min-height: 44px; min-width: 44px; border: 1px solid var(--border); background: var(--card); color: var(--light); font: inherit; font-size: var(--t0); border-radius: 8px; cursor: pointer; }
        .lang-b.on { border-color: var(--indigo); color: var(--indigo); }
        .pg-cap { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--border); }
        .pg-eyebrow { font-family: var(--mono); font-size: var(--t0); letter-spacing: .06em; text-transform: uppercase; color: var(--indigo); margin: 0 0 .9rem; }
        .pg-cap h1 { font-size: var(--t5); line-height: 1.1; margin: 0 0 1.1rem; letter-spacing: -.02em; }
        .pg-lead { font-size: var(--t1); color: var(--light); }
        .sg { padding: 2rem 0 4rem; }
        .sg-resum { font-size: var(--t1); color: var(--light); margin: 0 0 1.4rem; }
        .sg-llista { list-style: none; display: grid; gap: 1rem; }
        .sg-opcio { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .sg-opcio img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
        .sg-cos { padding: 1.2rem 1.4rem 1.4rem; }
        .sg-estat { font-family: var(--mono); font-size: var(--t0); letter-spacing: .06em; text-transform: uppercase; color: var(--orange); }
        .sg-opcio.llesta .sg-estat { color: var(--green); }
        .sg-opcio h2 { font-size: var(--t3); line-height: 1.25; margin: .3rem 0 .6rem; }
        .sg-opcio p { font-size: var(--t1); color: var(--light); }
        .sg-nota { font-size: var(--t0); color: var(--muted); margin-top: .6rem; }
        .sg-peu { font-family: var(--mono); font-size: var(--t0); color: var(--muted); margin-top: 1.6rem; }
    </style>
</head>
<body>
<header class="container sg-marca">
    <a href="/">TeamTowers <span>Humà</span></a>
    <span><button type="button" class="lang-b on" data-lang="ca">CA</button> <button type="button" class="lang-b" data-lang="es">ES</button></span>
</header>
<main>
    <section class="pg-cap">
        <div class="container">
            <p class="pg-eyebrow" data-i18n="eyebrow">Seguiment de la vostra proposta</p>
            <h1 id="sg-titol" data-i18n="carregant">Un moment…</h1>
            <p class="pg-lead" id="sg-quan"></p>
        </div>
    </section>
    <section class="sg">
        <div class="container">
            <p class="sg-resum" id="sg-resum" role="status" aria-live="polite"></p>
            <ol class="sg-llista" id="sg-llista"></ol>
            <p class="sg-peu" id="sg-peu"></p>
        </div>
    </section>
</main>
<script>
var ORIGEN = 'https://eventspenedes.com';
var T = {
    ca: { eyebrow: 'Seguiment de la vostra proposta', carregant: 'Un moment…', res: 'Aquí no hi ha res', resText: 'Aquest enllaç no és vàlid o ha caducat. Contesta el correu i t\'ho mirem.',
          llesta: 'Proposta llesta', curs: 'En curs', notaLlesta: 'Te l\'enviem per correu amb el preu.', notaCurs: 'Estem esperant la seva proposta formal.', fora: 'No disponible', notaFora: 'No tenen lliure aquest dia: seguim amb les altres opcions.',
          persones: 'persones', resum: function (l, n, f) { return l + ' de ' + n + ' propostes llestes.' + (f ? ' ' + (f === 1 ? 'Un espai no té' : f + ' espais no tenen') + ' lliure aquest dia.' : '') + ' Aquesta pàgina s\'actualitza sola quan arriba cadascuna.'; },
          buit: 'Estem preparant les propostes: surten aquí tan bon punt les tinguem.', peu: 'Actualitzat el ', dubte: '. Qualsevol dubte, contesta el correu i ho mirem.', loc: 'ca-ES' },
    es: { eyebrow: 'Seguimiento de vuestra propuesta', carregant: 'Un momento…', res: 'Aquí no hay nada', resText: 'Este enlace no es válido o ha caducado. Contesta al correo y lo miramos.',
          llesta: 'Propuesta lista', curs: 'En curso', notaLlesta: 'Te la enviamos por correo con el precio.', notaCurs: 'Estamos esperando su propuesta formal.', fora: 'No disponible', notaFora: 'No tienen libre ese día: seguimos con las otras opciones.',
          persones: 'personas', resum: function (l, n, f) { return l + ' de ' + n + ' propuestas listas.' + (f ? ' ' + (f === 1 ? 'Un espacio no tiene' : f + ' espacios no tienen') + ' libre ese día.' : '') + ' Esta página se actualiza sola cuando llega cada una.'; },
          buit: 'Estamos preparando las propuestas: salen aquí en cuanto las tengamos.', peu: 'Actualizado el ', dubte: '. Cualquier duda, contesta al correo y lo vemos.', loc: 'es-ES' }
};
var lang = 'ca', dades = null, error = false;
try { lang = localStorage.getItem('tt_lang') || 'ca'; } catch (e) {}
try { var q = new URLSearchParams(location.search).get('lang'); if (q === 'ca' || q === 'es') lang = q; } catch (e) {}

function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }

function pinta() {
    var t = T[lang] || T.ca;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (n) { var k = n.getAttribute('data-i18n'); if (typeof t[k] === 'string') n.textContent = t[k]; });
    document.querySelectorAll('.lang-b').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
    var titol = document.getElementById('sg-titol'), quan = document.getElementById('sg-quan'),
        resum = document.getElementById('sg-resum'), llista = document.getElementById('sg-llista'), peu = document.getElementById('sg-peu');
    if (error) { titol.textContent = t.res; quan.textContent = ''; resum.textContent = t.resText; llista.replaceChildren(); peu.textContent = ''; return; }
    if (!dades) return;
    titol.removeAttribute('data-i18n');
    titol.textContent = dades.titulo;
    var dia = dades.fecha ? new Date(dades.fecha + 'T12:00:00Z').toLocaleDateString(t.loc, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/Madrid' }) : '';
    quan.textContent = [dia, dades.pax ? dades.pax + ' ' + t.persones : ''].filter(Boolean).join(' · ');
    var ps = dades.propuestas || [], llestes = ps.filter(function (p) { return p.estado === 'lista'; }).length,
        fora = ps.filter(function (p) { return p.estado === 'no_disponible'; }).length;
    resum.textContent = ps.length ? t.resum(llestes, ps.length - fora, fora) : t.buit;
    llista.replaceChildren.apply(llista, ps.map(function (p) {
        var li = el('li', 'sg-opcio' + (p.estado === 'lista' ? ' llesta' : ''));
        if (p.foto && /^https:\/\/eventspenedes\.com\//.test(p.foto)) { var im = el('img'); im.src = p.foto; im.alt = p.alt || ''; im.loading = 'lazy'; li.appendChild(im); }
        var cos = el('div', 'sg-cos');
        var e = p.estado === 'lista' ? [t.llesta, t.notaLlesta] : p.estado === 'no_disponible' ? [t.fora, t.notaFora] : [t.curs, t.notaCurs];
        cos.appendChild(el('p', 'sg-estat', e[0]));
        cos.appendChild(el('h2', null, p.titulo));
        if (p.estado === 'lista' && p.texto) cos.appendChild(el('p', null, p.texto));
        cos.appendChild(el('p', 'sg-nota', e[1]));
        li.appendChild(cos);
        return li;
    }));
    peu.textContent = t.peu + new Date(dades.actualizado_en).toLocaleString(t.loc, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' }) + t.dubte;
}

document.querySelectorAll('.lang-b').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); try { localStorage.setItem('tt_lang', lang); } catch (e) {} pinta(); });
});

var parts = location.pathname.replace(/\/+$/, '').split('/').slice(2);
if (!/^[a-z0-9-]{3,80}$/.test(parts[0] || '') || !/^[a-f0-9]{32}$/.test(parts[1] || '')) { error = true; pinta(); }
else {
    pinta();
    fetch(ORIGEN + '/seguimiento/' + parts[0] + '/' + parts[1] + '?formato=json', { referrerPolicy: 'no-referrer' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) { dades = j; pinta(); })
        .catch(function () { error = true; pinta(); });
}
</script>
</body>
</html>
